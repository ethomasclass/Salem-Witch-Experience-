  knowsAll(flags) {
    if (!flags || !flags.length) return true;
    return flags.every((f) => this.flags.has(f));
  }

  /** True when none of the listed flags are known. */
  knowsNone(flags) {
    if (!flags || !flags.length) return true;
    return flags.every((f) => !this.flags.has(f));
  }

  /** Copy a document into the notebook. */
  copyDoc(id) {
    if (this.docs.has(id)) return false;
    this.docs.set(id, { chapter: this.chapter, at: Date.now() });
    if (this.onRecord) this.onRecord(`doc:${id}`);
    return true;
  }

  hasDoc(id) { return this.docs.has(id); }

  docLog() {
    return [...this.docs.entries()]
      .sort((a, b) => a[1].at - b[1].at)
      .map(([id, rec]) => ({ id, ...rec }));
  }

  markSpoke(npcId) {
    if (!this.metIn.has(npcId)) this.metIn.set(npcId, this.chapter);
    this.talkedTo.add(npcId);
    this.lastSpoke = npcId;
  }

  hasSpokenTo(npcId) { return this.talkedTo.has(npcId); }

  /** True when the player met this character in an earlier chapter than the
   *  one they are standing in now. This is what makes March retroactively
   *  matter: the people you bothered to talk to then know you now. */
  metBefore(npcId) {
    const then = this.metIn.get(npcId);
    if (!then) return false;
    const i = CHAPTER_ORDER.indexOf(then), j = CHAPTER_ORDER.indexOf(this.chapter);
    return i >= 0 && j >= 0 && i < j;
  }

  /** True the first time a given dispute is raised. */
  noteDispute(id) {
    if (this.disputesSeen.has(id)) return false;
    this.disputesSeen.add(id);
    return true;
  }

  /** File or unfile a piece of evidence under one of the four cases. */
  toggleFiled(flag, theoryId) {
    if (!this.filed.has(flag)) this.filed.set(flag, new Set());
    const set = this.filed.get(flag);
    if (set.has(theoryId)) set.delete(theoryId); else set.add(theoryId);
    if (!set.size) this.filed.delete(flag);
    return set.has(theoryId);
  }

  filedUnder(flag) { return this.filed.get(flag) || new Set(); }

  /** Record, clear, or read which side the player finds more credible. */
  setPosition(id, side) {
    if (side === null) this.positions.delete(id);
    else this.positions.set(id, side);
  }

  positionOn(id) { return this.positions.get(id) || null; }

  /** Everything the player knows, newest first — backs the notebook screen
   *  and the end-of-game export. */
  knowledgeLog() {
    return [...this.flags.entries()]
      .sort((a, b) => a[1].at - b[1].at)
      .map(([flag, rec]) => ({ flag, ...rec }));
  }

  // ---- persistence -----------------------------------------------------

  serialize(player) {
    return JSON.stringify({
      v: 1,
      chapter: this.chapter,
      flags: [...this.flags.entries()],
      docs: [...this.docs.entries()],
      answer: this.answer,
      talkedTo: [...this.talkedTo],
      metIn: [...this.metIn.entries()],
      visited: [...this.visited],
      finalAnswer: this.finalAnswer,
      disputesSeen: [...this.disputesSeen],
      positions: [...this.positions.entries()],
      filed: [...this.filed.entries()].map(([f, set]) => [f, [...set]]),
      player: player ? { map: player.map, x: player.tx, y: player.ty, dir: player.dir } : null,
    });
  }

  save(player) {
    try {
      localStorage.setItem(SAVE_KEY, this.serialize(player));
      return true;
    } catch {
      // Private browsing, or storage disabled by policy. The game still
      // plays start-to-finish in one sitting; only resume is lost.
      return false;
    }
  }

  static load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch { return null; }
    if (!raw) return null;
    let data;
    try { data = JSON.parse(raw); } catch { return null; }
    if (!data || data.v !== 1) return null;

    const s = new GameState();
    s.chapter = data.chapter || 'memorial';
    s.flags = new Map(data.flags || []);
    s.docs = new Map(data.docs || []);
    s.answer = data.answer || '';
    s.talkedTo = new Set(data.talkedTo || []);
    // A save from before metIn existed still loads; those characters simply
    // do not recognise the player, which is the safe way to be wrong.
    s.metIn = new Map(data.metIn || []);
    s.visited = new Set(data.visited || []);
    s.finalAnswer = data.finalAnswer || '';
    s.disputesSeen = new Set(data.disputesSeen || []);
    s.positions = new Map(data.positions || []);
    s.filed = new Map((data.filed || []).map(([f, ids]) => [f, new Set(ids)]));

    // Repair saves written while the memorial exit was missing its
    // setChapter. Those players walked into 1692 with the chapter still on
    // 'memorial', which froze the goal tracker on memorial steps and — worse
    // — meant the village never gained its exit to the dig, so the game
    // could not be finished. Standing on 1692 ground is proof the transition
    // happened, whatever the saved chapter says.
    if (s.chapter === 'memorial' && (s.visited.has('road') || s.visited.has('village'))) {
      s.chapter = 'march';
    }
    return { state: s, player: data.player || null };
  }

  static clear() {
    try { localStorage.removeItem(SAVE_KEY); } catch { /* nothing to do */ }
  }
}

/* ===== src/engine/dialogue.js ===== */
// The dialogue runner.
//
// Scripts are plain arrays of ops so that writing a conversation stays close
// to writing prose. The interpreter is a small stack machine — enough for
// branching, knowledge gates and source-sensitive replies, and deliberately
// not enough to become a scripting language nobody wants to maintain.
//
//   'a bare string'                  the current speaker says it
//   { say, who, mood }               explicit speaker / portrait mood
//   { learn: 'flag' }                record knowledge, sourced to this NPC
//   { if: {...}, then: [], else: [] } branch on what the player knows
//   { bySource: 'flag', cases: {}, default: [] }
//                                    branch on WHO told them
//   { choice: [ { label, require, then } ] }
//   { end: true }                    stop early
//
// Condition objects accept: knows: [], notKnows: [], spokenTo: [], metBefore: [],
// notMetBefore: [], chapter.
class DialogueRunner {
  constructor(state) {
    this.state = state;
    this.stack = [];
    this.speaker = null;      // { id, name, spec }
    this.current = null;      // { type: 'say' | 'choice', ... }
    this.onEnd = null;
  }

  get active() { return this.current !== null; }

  start(script, speaker, onEnd = null) {
    this.speaker = speaker || null;
    this.stack = [{ ops: script, i: 0 }];
    this.onEnd = onEnd;
    this.current = null;
    this.step();
  }

  /** Player pressed confirm on a line of text. */
  advance() {
    if (!this.current || this.current.type !== 'say') return;
    this.current = null;
    this.step();
  }

  /** Player picked option `idx` from a choice. */
  choose(idx) {
    if (!this.current || this.current.type !== 'choice') return;
    const opt = this.current.options[idx];
    // Remembered so the caller can tell "asked a question" (reopen the topic
    // list) from "chose to stop talking" (end the conversation).
    this.lastChoiceIndex = idx;
    this.lastChoiceCount = this.current.options.length;
    this.current = null;
    if (opt && opt.then && opt.then.length) {
      this.stack.push({ ops: opt.then, i: 0 });
    }
    this.step();
  }

  // ---- interpreter -----------------------------------------------------

  step() {
    while (this.stack.length) {
      const frame = this.stack[this.stack.length - 1];
      if (frame.i >= frame.ops.length) { this.stack.pop(); continue; }
      const op = frame.ops[frame.i++];
      if (this.exec(op)) return;   // yielded something for the UI to show
    }
    this.finish();
  }

  /** Returns true if this op produced output and execution should pause. */
  exec(op) {
    if (op == null) return false;

    if (typeof op === 'string') {
      this.current = {
        type: 'say',
        who: this.speaker ? this.speaker.name : '',
        text: op,
        speaker: this.speaker,
        mood: 'neutral',
      };
      return true;
    }

    if (op.say !== undefined) {
      this.current = {
        type: 'say',
        who: op.who !== undefined ? op.who : (this.speaker ? this.speaker.name : ''),
        text: op.say,
        // `who: null` means narration — no portrait, no name plate.
        speaker: op.who === null ? null : (op.speaker || this.speaker),
        mood: op.mood || 'neutral',
      };
      return true;
    }

    if (op.learn) {
      const src = op.source || (this.speaker ? this.speaker.id : 'observed');
      const flags = Array.isArray(op.learn) ? op.learn : [op.learn];
      for (const f of flags) this.state.learn(f, src);
      return false;
    }

    if (op.if) {
      const branch = this.test(op.if) ? op.then : op.else;
      if (branch && branch.length) this.stack.push({ ops: branch, i: 0 });
      return false;
    }

    if (op.bySource) {
      // "Who told you that? Was it Putnam?" — the same fact lands
      // differently depending on whose mouth it came out of.
      const src = this.state.sourceOf(op.bySource);
      const branch = (src && op.cases && op.cases[src]) || op.default;
      if (branch && branch.length) this.stack.push({ ops: branch, i: 0 });
      return false;
    }

    if (op.choice) {
      const options = op.choice
        .filter((o) => this.test(o))
        .map((o) => ({ label: o.label, then: o.then || [] }));
      if (!options.length) return false;
      this.current = { type: 'choice', options, speaker: this.speaker };
      return true;
    }

    if (op.end) { this.stack.length = 0; return false; }

    return false;
  }

  /** Evaluate a gate object. Missing keys always pass. */
  test(cond) {
    if (!cond) return true;
    const s = this.state;
    if (cond.require && !s.knowsAll(cond.require)) return false;
    if (cond.knows && !s.knowsAll(cond.knows)) return false;
    if (cond.notKnows && !s.knowsNone(cond.notKnows)) return false;
    if (cond.hide && s.knowsAll(cond.hide)) return false;
    if (cond.spokenTo && !cond.spokenTo.every((id) => s.hasSpokenTo(id))) return false;
    if (cond.notSpokenTo && cond.notSpokenTo.some((id) => s.hasSpokenTo(id))) return false;
    // "You knew me before this started." Names the id from the EARLIER
    // chapter, so the jail versions of Tituba and Rebecca Nurse ask about
    // the March versions of themselves.
    if (cond.metBefore && !cond.metBefore.every((id) => s.metBefore(id))) return false;
    if (cond.notMetBefore && cond.notMetBefore.some((id) => s.metBefore(id))) return false;
    if (cond.chapter && s.chapter !== cond.chapter) return false;
    if (typeof cond.when === 'function' && !cond.when(s)) return false;
    return true;
  }

  finish() {
    this.current = null;
    this.stack.length = 0;
    const cb = this.onEnd;
    this.onEnd = null;
    if (cb) cb();
  }
}

/**
 * Build the topic menu for an NPC out of whatever the player currently
 * knows. Topics the player has no business asking about simply are not
 * listed — the design doc is firm that gating is by knowledge, and that an
 * unavailable topic should be invisible rather than greyed out. A visible
 * locked option tells the player there is a checklist; an absent one lets
 * them discover there was something to ask.
 */
function buildTopicMenu(npc, state) {
  const runner = { test: DialogueRunner.prototype.test, state };
  const available = (npc.topics || []).filter((t) => {
    // Asked topics drop off the list by default. Two reasons: the shrinking
    // menu shows the player what they have not raised yet, and it guarantees
    // a conversation terminates — otherwise a player holding the confirm key
    // re-picks the first topic forever and can never get out.
    if (!t.repeatable && state.knows(`asked.${npc.id}.${t.id}`)) return false;
    return DialogueRunner.prototype.test.call(runner, t);
  });

  const options = available.map((t) => ({
    label: t.label,
    then: [
      { learn: `asked.${npc.id}.${t.id}`, source: npc.id },
      ...t.lines,
    ],
  }));

  options.push({ label: 'Say nothing more.', then: npc.farewell || [] });
  return options;
}

/* ===== src/engine/input.js ===== */
// Input. Keyboard first, with a touch d-pad that only appears if the device
// actually reports touch — school Chromebooks are frequently touchscreens,
// and a kid on a 2-in-1 should not have to find the keyboard.

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'confirm', Space: 'confirm', Enter: 'confirm',
  KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel',
  KeyN: 'notebook', Tab: 'notebook',
  ShiftLeft: 'run', ShiftRight: 'run',
  // Taking a position on a disputed claim, and filing evidence under one of
  // the four cases. Same keys, different tab — both are "this number applies
  // to whatever the cursor is on", which is the one interaction idiom the
  // notebook uses everywhere.
  Digit1: 'pos1', Numpad1: 'pos1',
  Digit2: 'pos2', Numpad2: 'pos2',
  Digit3: 'pos3', Numpad3: 'pos3',
  Digit4: 'pos4', Numpad4: 'pos4',
};
class Input {
  constructor() {
    this.held = new Set();
    this.pressed = new Set();   // cleared once per frame after being read

    addEventListener('keydown', (e) => {
      const a = KEYMAP[e.code];
      if (!a) return;
      // Stop the page scrolling out from under the game.
      e.preventDefault();
      if (!this.held.has(a)) this.pressed.add(a);
      this.held.add(a);
    });

    addEventListener('keyup', (e) => {
      const a = KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      this.held.delete(a);
    });

    // Losing focus mid-walk should not leave a direction stuck down.
    addEventListener('blur', () => { this.held.clear(); });
  }

  /** Bind on-screen buttons. Each element carries data-act="up|confirm|...". */
  bindTouch(root) {
    const press = (a) => { if (!this.held.has(a)) this.pressed.add(a); this.held.add(a); };
    const release = (a) => this.held.delete(a);

    for (const el of root.querySelectorAll('[data-act]')) {
      const a = el.dataset.act;
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(a); });
      el.addEventListener('pointerup', (e) => { e.preventDefault(); release(a); });
      el.addEventListener('pointercancel', () => release(a));
      el.addEventListener('lostpointercapture', () => release(a));
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    }
  }

  isDown(a) { return this.held.has(a); }

  /** True once per physical press. */
  justPressed(a) { return this.pressed.has(a); }

  /** Call at the end of each frame. */
  endFrame() { this.pressed.clear(); }

  /** The direction currently being requested, or null. */
  direction() {
    if (this.held.has('up')) return 'up';
    if (this.held.has('down')) return 'down';
    if (this.held.has('left')) return 'left';
    if (this.held.has('right')) return 'right';
    return null;
  }
}

/* ===== src/engine/audio.js ===== */
// Sound, synthesised at runtime.
//
// No audio files. Everything here is generated with the Web Audio API, for
// the same reason the art is drawn in code: the game has to survive being a
// single HTML file on a filtered school network, and a blocked .mp3 is a
// silent game with no error message.
//
// Two rules that matter in a classroom:
//   - Nothing plays until the player presses a key. Browsers require a
//     gesture before audio anyway, and a game that starts making noise in a
//     room of thirty Chromebooks is a game a teacher turns off.
//   - The mute state is remembered. One toggle, honoured forever.

const SOUND_KEY = 'salem1692.sound';
const MUTE_KEY = 'salem1692.muted';
class Audio {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.ambientGain = null;
    this.ambient = null;        // { nodes: [], name }
    this.muted = false;
    try { this.muted = localStorage.getItem(MUTE_KEY) === '1'; } catch { /* private mode */ }
    this.pendingAmbience = null;
    this.pendingMusic = null;
    this.music = null;          // { name, timer, step }
    // Three settings, not two. A teacher who wants the room quieter usually
    // wants the tune off and the footsteps and dialogue blips left alone —
    // those are feedback, not atmosphere. 'all' | 'quiet' | 'off'.
    this.sound = 'all';
    try {
      const saved = localStorage.getItem(SOUND_KEY);
      if (saved === 'all' || saved === 'quiet' || saved === 'off') this.sound = saved;
      else if (this.muted) this.sound = 'off';
    } catch { /* private mode */ }
    this.muted = this.sound === 'off';
  }

  /** Called from the first real input event. Safe to call repeatedly. */
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = 0.35;
    this.ambientGain.connect(this.master);
    // Music sits on its own bus so it can be silenced without touching the
    // footsteps, and ducked under dialogue without ducking anything else.
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = this.sound === 'all' ? 1 : 0;
    this.musicGain.connect(this.master);
    if (this.pendingMusic) {
      const m = this.pendingMusic;
      this.pendingMusic = null;
      this.setMusic(m);
    }
    if (this.pendingAmbience) {
      const a = this.pendingAmbience;
      this.pendingAmbience = null;
      this.setAmbience(a);
    }
  }

  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch { /* nothing to do */ }
    if (this.master) {
      this.master.gain.setTargetAtTime(m ? 0 : 0.5, this.ctx.currentTime, 0.05);
    }
  }

  toggleMute() { this.setMuted(!this.muted); return this.muted; }

  /** Cycle all -> quiet (no music) -> off -> all. */
  cycleSound() {
    this.sound = this.sound === 'all' ? 'quiet' : this.sound === 'quiet' ? 'off' : 'all';
    try { localStorage.setItem(SOUND_KEY, this.sound); } catch { /* nothing to do */ }
    this.setMuted(this.sound === 'off');
    if (this.musicGain && this.ctx) {
      this.musicGain.gain.setTargetAtTime(this.sound === 'all' ? 1 : 0, this.ctx.currentTime, 0.4);
    }
    return this.sound;
  }

  /** Pull the tune down under a conversation without touching anything else. */
  duckMusic(on) {
    if (!this.musicGain || !this.ctx || this.sound !== 'all') return;
    this.musicGain.gain.setTargetAtTime(on ? 0.35 : 1, this.ctx.currentTime, 0.35);
  }

  /* ---- building blocks ------------------------------------------------ */

  /** A short buffer of white noise, reused for every noise-based voice. */
  noiseBuffer(seconds = 2) {
    if (this._noise && this._noiseLen >= seconds) return this._noise;
    const n = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf; this._noiseLen = seconds;
    return buf;
  }

  /** One short tone. */
  tone({ freq = 440, type = 'square', dur = 0.06, gain = 0.15, slide = 0, delay = 0 }) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  /** A filtered burst of noise — footsteps, thumps, wind gusts. */
  burst({ dur = 0.08, gain = 0.12, freq = 900, q = 1, type = 'bandpass', delay = 0 }) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer();
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  /* ---- one-shots ------------------------------------------------------ */

  step(terrain) {
    // Different ground, different footstep. Small detail, but it is the
    // sound the player hears more than any other.
    const kinds = {
      mud:    { freq: 420, dur: 0.07, gain: 0.055, q: 0.8 },
      grass:  { freq: 1500, dur: 0.05, gain: 0.035, q: 0.7 },
      lawn:   { freq: 1600, dur: 0.05, gain: 0.035, q: 0.7 },
      snow:   { freq: 2400, dur: 0.06, gain: 0.04, q: 0.9 },
      floor:  { freq: 260, dur: 0.06, gain: 0.06, q: 2.5 },
      paving: { freq: 1100, dur: 0.04, gain: 0.05, q: 3 },
      brick:  { freq: 950, dur: 0.04, gain: 0.05, q: 3 },
      asphalt:{ freq: 700, dur: 0.05, gain: 0.045, q: 1.5 },
    };
    const k = kinds[terrain] || kinds.grass;
    this.burst({ ...k, freq: k.freq * (0.9 + Math.random() * 0.2) });
  }

  /** The text-advance blip. Pitched per speaker so voices feel distinct. */
  blip(pitch = 1) {
    this.tone({ freq: 300 * pitch, type: 'square', dur: 0.028, gain: 0.045, slide: 40 });
  }

  menuMove() { this.tone({ freq: 520, type: 'triangle', dur: 0.05, gain: 0.07 }); }
  menuPick() {
    this.tone({ freq: 620, type: 'triangle', dur: 0.05, gain: 0.08 });
    this.tone({ freq: 930, type: 'triangle', dur: 0.07, gain: 0.06, delay: 0.05 });
  }

  /** Something went into the notebook. */
  noted() {
    this.tone({ freq: 740, type: 'sine', dur: 0.10, gain: 0.09 });
    this.tone({ freq: 1108, type: 'sine', dur: 0.14, gain: 0.07, delay: 0.08 });
  }

  /** An objective completed. Deliberately warmer than `noted`. */
  objective() {
    this.tone({ freq: 587, type: 'triangle', dur: 0.09, gain: 0.08 });
    this.tone({ freq: 784, type: 'triangle', dur: 0.09, gain: 0.08, delay: 0.07 });
    this.tone({ freq: 1175, type: 'triangle', dur: 0.20, gain: 0.07, delay: 0.14 });
  }

  door() { this.burst({ freq: 220, dur: 0.16, gain: 0.10, q: 1.2 }); }

  /** Crossing three centuries. Low, wrong-footed, and over quickly. */
  timeShift() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 1.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 1.8);
    this.burst({ freq: 200, dur: 1.4, gain: 0.05, q: 0.6, type: 'lowpass' });
  }

  /* ---- ambience ------------------------------------------------------- */

  /**
   * A continuous bed per era. 1692 is wind and, occasionally, a crow. The
   * present is traffic. The difference is doing the same job as the palette
   * shift: you should know what century you are in with your eyes shut.
   */
  setAmbience(name) {
    if (!this.ctx) { this.pendingAmbience = name; return; }
    if (this.ambient && this.ambient.name === name) return;
    this.stopAmbience();
    if (!name) return;

    const t = this.ctx.currentTime;
    const nodes = [];
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(4);
    src.loop = true;

    const filt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);

    if (name === 'present') {
      // Distant traffic: low rumble, very little movement.
      filt.type = 'lowpass'; filt.frequency.value = 260; filt.Q.value = 0.6;
      g.gain.linearRampToValueAtTime(0.30, t + 1.5);
    } else if (name === 'indoor') {
      filt.type = 'lowpass'; filt.frequency.value = 150; filt.Q.value = 0.5;
      g.gain.linearRampToValueAtTime(0.14, t + 1.2);
    } else {
      // Open ground in 1692: wind, with slow gusts.
      //
      // September is the same wind with the life taken out of it. By then the
      // village has lost a fifth of its households to the jail, the gallows or
      // flight, and a place that empty should not sound identical to the one
      // the player walked through in March. Thinner, colder, and — below —
      // no crows left calling to each other.
      const late = name === '1692-late';
      filt.type = 'bandpass';
      filt.frequency.value = late ? 620 : 480;
      filt.Q.value = late ? 0.8 : 0.5;
      g.gain.linearRampToValueAtTime(late ? 0.17 : 0.22, t + 1.5);
      const lfo = this.ctx.createOscillator();
      const lfoGain = this.ctx.createGain();
      lfo.frequency.value = late ? 0.06 : 0.09;
      lfoGain.gain.value = late ? 170 : 260;
      lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
      lfo.start(t); nodes.push(lfo, lfoGain);
    }

    src.connect(filt); filt.connect(g); g.connect(this.ambientGain);
    src.start(t);
    nodes.push(src, filt, g);
    this.ambient = { name, nodes, gain: g };

    // Occasional punctuation, so the bed does not become wallpaper.
    clearInterval(this._punct);
    if (name === '1692' || name === '1692-late') {
      // Crows thin out rather than vanish: one bird a long way off, now and
      // then, instead of a pair arguing overhead.
      const odds = name === '1692-late' ? 0.12 : 0.35;
      this._punct = setInterval(() => {
        if (!this.muted && Math.random() < odds) this.crow();
      }, name === '1692-late' ? 16000 : 9000);
    } else if (name === 'present') {
      this._punct = setInterval(() => {
        if (!this.muted && Math.random() < 0.3) this.passingCar();
      }, 11000);
    }
  }

  crow() {
    // Two harsh descending calls. Not a realistic corvid, but unmistakably
    // a bird and unmistakably not friendly.
    for (let i = 0; i < 2; i++) {
      const d = i * 0.26;
      this.tone({ freq: 720, type: 'sawtooth', dur: 0.15, gain: 0.035, slide: -300, delay: d });
      this.burst({ freq: 1400, dur: 0.13, gain: 0.02, q: 1.6, delay: d });
    }
  }

  passingCar() {
    this.burst({ freq: 300, dur: 2.2, gain: 0.045, q: 0.5, type: 'lowpass' });
  }

  /* ---- music ----------------------------------------------------------- *
   *
   * What music can this game honestly have?
   *
   * Almost none, which turns out to be the interesting answer. Puritan New
   * England permitted singing in worship and essentially nothing else: no
   * instruments in the meetinghouse, no organ, no part-singing. What a person
   * in Salem Village actually heard was the Bay Psalm Book, unaccompanied, in
   * a handful of common tunes — Old Hundredth, Windsor, Martyrs, York — sung
   * slowly and in unison by a congregation, most of whom could not read music
   * and were following a deacon lining the psalm out one phrase at a time.
   *
   * So the tunes below are not quotations. They are built out of the shapes
   * those melodies are made of: stepwise motion inside a minor-ish mode,
   * phrases that fall to the tonic, no leading tone, no ornament, and a
   * ceiling of about a sixth. Played on square and triangle waves at a fifth
   * of the volume of everything else, which is what makes it a chip tune
   * rather than a hymn.
   *
   * AND IT THINS OUT. The same material loses notes across the year: the
   * March tune is a whole phrase, June drops the answering half, and by
   * September it is three notes and a lot of silence. The village has lost a
   * fifth of its households by then, and the wind was already doing this — a
   * place that empty should not sound like the one the player walked through
   * in March. The present day gets no melody at all, because a memorial beside
   * a working street is not scored.
   *
   * Scale degrees, not frequencies, so the same phrase can be transposed and
   * so the shapes are readable as shapes. 0 is the tonic; null is a rest.
   */
  static get MODE() {
    // Aeolian on D, two octaves. The flat seventh is the point: a leading
    // tone would make this sound like the eighteenth century.
    return [146.83, 164.81, 174.61, 196.00, 220.00, 233.08, 261.63,
            293.66, 329.63, 349.23, 392.00, 440.00, 466.16, 523.25];
  }

  static get TUNES() {
    return {
      // Outdoors, March. A full psalm phrase and its answer.
      '1692': {
        beat: 0.62, gain: 0.030, type: 'triangle',
        notes: [0, 2, 4, 3, 2, null, 1, 0, null, 3, 4, 5, 4, 3, 2, null, 1, 0, null, null],
      },
      // June. The answering half is gone; what is left circles.
      '1692-june': {
        beat: 0.70, gain: 0.027, type: 'triangle',
        notes: [0, 2, 4, 3, null, 2, 1, null, 0, null, null, 2, 1, null, 0, null, null, null],
      },
      // September. Three notes and a great deal of nothing.
      '1692-late': {
        beat: 0.86, gain: 0.024, type: 'triangle',
        notes: [0, null, null, 2, null, null, null, 1, null, null, null, null,
                0, null, null, null, null, null, null, null],
      },
      // Under a roof: lower, slower, barely a tune. A drone with a memory.
      indoor: {
        beat: 0.95, gain: 0.022, type: 'sine', octave: -1,
        notes: [0, null, null, null, 2, null, null, null, 1, null, null, null,
                0, null, null, null, null, null],
      },
      // The meetinghouse. The only room in the village where this music was
      // ever actually sung, so here it is nearly four-square and in unison.
      meetinghouse: {
        beat: 0.66, gain: 0.032, type: 'square', fifth: true,
        notes: [0, 0, 1, 2, 2, 1, 0, null, 3, 3, 2, 1, 1, 0, null, null],
      },
      // The jail. One note, low, at long intervals. Not a tune at all.
      jail: {
        beat: 1.35, gain: 0.024, type: 'sine', octave: -1,
        notes: [0, null, null, null, null, 1, null, null, null, null, null, null],
      },
      // The archive: a reading room in the present. Neutral, almost still.
      archive: {
        beat: 1.10, gain: 0.018, type: 'sine',
        notes: [4, null, null, 3, null, null, null, 2, null, null, null, null],
      },
    };
  }

  /**
   * Start a tune, or stop everything with a falsy name.
   *
   * Scheduled note by note on a timer rather than as one long buffer, so the
   * tune can be swapped the instant the player walks through a door, and so
   * a thirty-two minute session never builds up anything to leak.
   */
  setMusic(name) {
    if (!this.ctx) { this.pendingMusic = name; return; }
    if (this.music && this.music.name === name) return;
    this.stopMusic();
    if (!name) return;
    const tune = Audio.TUNES[name];
    if (!tune) return;

    const scale = Audio.MODE;
    const base = 3 + (tune.octave || 0) * 7;   // start a fourth up the table
    let step = 0;
    const play = () => {
      if (!this.ctx || this.muted || this.sound !== 'all') return;
      const n = tune.notes[step % tune.notes.length];
      step += 1;
      if (n === null || n === undefined) return;
      const freq = scale[Math.max(0, Math.min(scale.length - 1, base + n))];
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = tune.type;
      o.frequency.setValueAtTime(freq, t);
      // Slow attack and a long tail: a sung note, not a blip. Sharing the
      // envelope shape with the UI beeps is what would make this sound like
      // a menu instead of a room.
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(tune.gain, t + 0.09);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tune.beat * 1.55);
      o.connect(g); g.connect(this.musicGain);
      o.start(t); o.stop(t + tune.beat * 1.6);

      // A bare fifth underneath — the one bit of harmony this music is
      // allowed, and the interval that makes it sound like a congregation
      // rather than a solo.
      if (tune.fifth && step % 4 === 1) {
        const o2 = this.ctx.createOscillator();
        const g2 = this.ctx.createGain();
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(freq / 2 * 1.5, t);
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.linearRampToValueAtTime(tune.gain * 0.55, t + 0.12);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + tune.beat * 1.8);
        o2.connect(g2); g2.connect(this.musicGain);
        o2.start(t); o2.stop(t + tune.beat * 1.9);
      }
    };
    play();
    this.music = { name, timer: setInterval(play, tune.beat * 1000) };
  }

  stopMusic() {
    if (this.music) clearInterval(this.music.timer);
    this.music = null;
  }

  stopAmbience() {
    clearInterval(this._punct);
    if (!this.ambient) return;
    const t = this.ctx.currentTime;
    try {
      this.ambient.gain.gain.cancelScheduledValues(t);
      this.ambient.gain.gain.setTargetAtTime(0, t, 0.2);
      for (const n of this.ambient.nodes) {
        if (n.stop) { try { n.stop(t + 1.2); } catch { /* already stopped */ } }
      }
    } catch { /* context torn down */ }
    this.ambient = null;
  }
}

/* ===== src/content/disputes.js ===== */
// Where the sources disagree.
//
// The design doc's promise is that "two students can finish with different
// notebooks and both be right about the facts, because characters contradict
// each other and the game never adjudicates." That was true, and it was also
// invisible: a student could copy Parris's account of the examinations and
// Tituba's account of the same afternoon into the same notebook, one after
// the other, and never register that they cannot both be the whole truth.
//
// So the game notices out loud, once, at the moment the second account
// arrives — and then marks the claim disputed and shows both sides with who
// said them. It still does not adjudicate. Naming a disagreement is not the
// same as settling it, and the settling is the student's job.
//
// EVERY PAIR HERE IS ALREADY IN THE WRITING. Nothing was invented to create
// a conflict; these are the seams that were always in the content, and the
// only new thing is that the game now points at them.
//
// `a` and `b` are knowledge flags, or 'doc:<id>' for a copied document.
// `line` is what a character says when the second one lands — written to be
// spoken by whoever the player is standing in front of, so it must work in
// anyone's mouth.
const DISPUTES = [
  {
    id: 'parris-tituba',
    a: 'june.parrisrecords',
    b: 'june.beating',
    line: 'That is not the account Mr. Parris gave you.',
    claim: 'What happened in the parsonage before Tituba was examined',
    sideA: 'Parris says he wrote the examinations down himself — names, questions, answers, everything the afflicted did while it was said.',
    sideB: 'Tituba says he beat her first and told her what it would be well for her to say.',
  },
  {
    id: 'ergot',
    a: 'law.ergot_claim',
    b: 'law.ergot_rebut',
    line: 'The tidy explanation and the objection to it do not sit together.',
    claim: 'Whether ergot poisoning explains 1692',
    sideA: 'Ergot-infected rye can cause hallucinations and convulsions, and it is the explanation most people have heard.',
    sideB: 'The symptoms are wrong, whole households ate the same bread, and it says nothing at all about WHO was accused.',
  },
  {
    id: 'who-swore-it',
    a: 'june.fatherwrites',
    b: 'doc:putnamDeposition',
    line: 'The paper says she swore it. She says her father wrote it.',
    claim: 'Whose words the depositions actually are',
    sideA: 'Ann Putnam Jr. says her father writes them down and reads them back to her for agreement.',
    sideB: 'The deposition itself is sworn in her name, upon her oath, before the Jurors of Inquest.',
  },
  {
    id: 'how-names-arrive',
    a: 'june.annnames',
    b: 'june.mercysees',
    line: 'Mercy Lewis does not describe it the way Ann Putnam does.',
    claim: 'How a name arrives during a fit',
    sideA: 'Ann Putnam Jr. says the shapes come to her, and she says whose they are.',
    sideB: 'Mercy Lewis says she sees dark shapes at the edge of a room, and that the magistrates wait patiently until she produces a name.',
  },
  {
    id: 'what-started-it',
    a: 'fact.griggs',
    b: 'fact.witchcake',
    line: 'That is a different account of what set it off.',
    claim: 'What turned an illness into an accusation',
    sideA: 'Doctor Griggs examined the girls, found nothing physical, and suggested the evil hand was upon them.',
    sideB: 'Mary Sibley had a witch cake baked and fed to a dog — and it was after that that the girls began naming names.',
  },
  {
    id: 'ingersoll-himself',
    a: 'june.ingersollguilt',
    b: 'sept.quiet',
    line: 'He tells it differently now than he did in June.',
    claim: 'How Nathaniel Ingersoll accounts for his own part',
    sideA: 'In June he said he was taking more money than ever and was ashamed of it, and that Rebecca Nurse was brought through his door in irons.',
    sideB: 'In September he says nobody in the village wants to be remembered as having enjoyed it.',
  },
];

/** Anything that fires a dispute, for a fast membership test. */
const DISPUTED_KEYS = new Set(DISPUTES.flatMap((d) => [d.a, d.b]));

/** The disputes both of whose sides the player now holds. */
function activeDisputes(state) {
  const has = (k) => (k.startsWith('doc:') ? state.hasDoc(k.slice(4)) : state.knows(k));
  return DISPUTES.filter((d) => has(d.a) && has(d.b));
}

/**
 * Which dispute, if any, has just been completed by learning `key`.
 *
 * Returns null when the player already had both sides, so the line fires
 * once — at the moment the second account arrives — and never again.
 */
function disputeCompletedBy(state, key) {
  if (!DISPUTED_KEYS.has(key)) return null;
  const has = (k) => (k.startsWith('doc:') ? state.hasDoc(k.slice(4)) : state.knows(k));
  return DISPUTES.find((d) => {
    const other = d.a === key ? d.b : d.b === key ? d.a : null;
    return other !== null && has(other);
  }) || null;
}

/** Who the player heard a side from, for the notebook. */
function sideSourceOf(state, key) {
  return key.startsWith('doc:') ? 'the document itself' : state.sourceOf(key);
}

// The reckoning: what the game says back before it asks its question.
//
// Thirty-two minutes of village and then a blank text box is an assignment
// prompt, not an ending. This is the beat in between — the game reading the
// player's own path back to them, out of state it already has, and then
// getting out of the way.
//
// THREE RULES, and the whole thing falls apart without them.
//
//   1. It reports what the player DID. Never what they missed. No counts out
//      of a total, no percentage, no "you only found eight of fifteen". A
//      memorial that grades you is a score screen, and the twenty benches are
//      deliberately identical for exactly this reason.
//
//   2. It does not adjudicate. It can say the player believed Tituba over
//      Parris. It cannot say they were right to. Historians have been at this
//      for three hundred and thirty years.
//
//   3. It works for a student who rushed. Somebody who talked to three people
//      and copied one paper still gets an ending that is about them and does
//      not sound disappointed.



/** People, not papers: how many living sources actually told this player
 *  something. 'observed' is the player's own eyes and does not count. */
function voices(state) {
  const who = new Set();
  for (const [, rec] of state.flags) {
    if (rec.source && rec.source !== 'observed') who.add(rec.source);
  }
  return who;
}
function reckoningScript(state) {
  const L = [];
  const say = (text) => L.push({ say: text, who: null });

  say('Charter Street. The traffic is still there, and the shop across the road is still open.');
  say('Twenty benches, all the same length.');

  // --- Rebecca Nurse, who is the spine of the whole structure -----------
  //
  // She is the only one of the twenty the player can meet alive. That is the
  // reason the memorial is chapter zero and the reason her bench is the one
  // beside the gap.
  const metHer = state.talkedTo.has('nurse') || state.talkedTo.has('nurseJail');
  if (metHer) {
    say('Of the twenty people named on this wall, you met one of them alive.');
    if (state.knows('june.warned')) {
      say('You stood on the other side of a grate in June and told her the date that is cut into her bench. She did not believe you. She asked whether you had eaten.');
      say('She was hanged on the nineteenth of July, which is what the stone says, and which you already knew in March.');
    } else if (state.talkedTo.has('nurseJail')) {
      say('You saw her twice. Once in her own kitchen, and once through a grate, and she was worried about her sister both times.');
    } else {
      say('You sat in her kitchen in March. She offered you something to eat and complained about the road.');
    }
  } else {
    say('You read her name here before you knew whose it was.');
  }

  // --- the noticing -----------------------------------------------------
  //
  // The one moment in the game where somebody looks back. It belongs here
  // more than anywhere, and it is the only line in this script that says
  // something about the player rather than about 1692.
  if (state.knows('sept.noticed')) {
    say('And in September a twelve-year-old girl in the Putnam house stopped what she was doing, looked directly at you, and asked whether you had been there before.');
    say('There was no answer you could give her. There was no option on the screen.');
    if (state.knows('reck.annapology')) {
      say('Fourteen years later she stood in that meeting house while her apology was read out over her head. She was the only one of them who ever did.');
    }
  }

  // --- who talked to you ------------------------------------------------
  const n = voices(state).size;
  if (n >= 8) {
    say(`${n} people told you something. Not one of them was lying to you, and no two of them agreed.`);
  } else if (n >= 3) {
    say(`${n} people told you something, and they did not tell you the same thing.`);
  } else if (n > 0) {
    say('You did not talk to many of them. What you did hear, you heard first-hand, from somebody standing in their own kitchen.');
  } else {
    say('You did not ask anybody. Everything you have, you saw yourself.');
  }

  // --- what the player made of the disagreements ------------------------
  //
  // This is the only place in the game that reads a judgement back, and it
  // is deliberately the player's own words about their own sources.
  const live = activeDisputes(state);
  const decided = live.filter((d) => state.positionOn(d.id) && state.positionOn(d.id) !== 'unsure');
  const unsure = live.filter((d) => state.positionOn(d.id) === 'unsure');

  if (decided.length) {
    say('You took a side.');
    for (const d of decided.slice(0, 3)) {
      const side = state.positionOn(d.id) === 'a' ? d.a : d.b;
      const who = shortSourceName(side.startsWith('doc:') ? 'document' : state.sourceOf(side));
      say(`On ${lower(d.claim)} — you believed ${who}.`);
    }
  }
  if (unsure.length) {
    say(unsure.length === 1
      ? `On ${lower(unsure[0].claim)}, you could not tell which account was true, and you said so. That is a real answer and it is written down as one.`
      : `On ${unsure.length} of them you could not tell, and you said so. That is a real answer and it is written down as one.`);
  }
  if (live.length && !decided.length && !unsure.length) {
    say('Your sources contradicted each other and you left every one of those contradictions open. Somebody will have to close them eventually.');
  }

  // --- the papers -------------------------------------------------------
  const docs = state.docs.size;
  if (docs >= 12) {
    say(`You copied ${docs} papers down in a handwriting nobody in 1692 could read.`);
  } else if (docs > 0) {
    say(`You copied ${docs} ${docs === 1 ? 'paper' : 'papers'} down.`);
  }

  // --- the descendant ---------------------------------------------------
  if (state.knows('reck.bothsides')) {
    say('The woman on the bench has an ancestor who was hanged and an ancestor who signed the complaint against her. Half of Essex County is in the same position, and most of them have never looked.');
  }

  // --- how they sorted it ------------------------------------------------
  //
  // The one place the filing is read back. It reports the shape of what they
  // built and nothing else: no comment on whether the balance is right, no
  // note about the case they left empty, and above all no correction. A
  // student who put everything under one heading has taken a position, and
  // taking a position is what the screen after this one asks for.
  const counts = filedCounts(state);
  const filedTotal = Object.values(counts).reduce((n, c) => n + c, 0);
  if (filedTotal) {
    const ranked = THEORIES
      .map((t) => ({ t, n: counts[t.id] }))
      .filter((r) => r.n > 0)
      .sort((a, b) => b.n - a.n);
    say(`You sorted ${filedTotal} ${filedTotal === 1 ? 'piece' : 'pieces'} of what you found into the four cases.`);
    if (ranked.length === 1) {
      say(`All of it went under ${lower(ranked[0].t.short)}. That is a position, and it is one several historians hold.`);
    } else {
      const most = ranked[0], least = ranked[ranked.length - 1];
      say(`Most of it went under ${lower(most.t.short)}. The least went under ${lower(least.t.short)}.`);
      const shared = [...state.filed.values()].filter((set) => set.size > 1).length;
      if (shared) {
        say(`And ${shared} ${shared === 1 ? 'item' : 'items'} you put under more than one. That is the most honest thing you could have done with them — the same ledger really is evidence for a quarrel about land and for who had the standing to be believed.`);
      }
    }
  }

  // --- handover ---------------------------------------------------------
  say('None of it adds up to one answer, and it was never going to.');
  say('Nobody here is going to tell you which of it matters most. That has been the arrangement since the first stone you stood on, the one with the sentence that runs into the wall and stops.');
  say('So: what caused it?');

  return L;
}

/** Claims are written as headings — "What happened in the parsonage before
 *  Tituba was examined" — and have to drop into mid-sentence. */
function lower(s) {
  return s.charAt(0).toLowerCase() + s.slice(1);
}
const DISPUTE_COUNT = DISPUTES.length;

// The fifteen documents.
//
// The player never picks one up. They are a student standing in front of a
// primary source, so they do the only thing available: copy it down. That
// needs no time-travel rule and no explanation.
//
// ---------------------------------------------------------------------
// A NOTE ON FIDELITY, WHICH MATTERS MORE HERE THAN ANYWHERE ELSE
//
// Presenting invented text to a student as a quotation from a primary
// source would be a worse sin than anything else this game could do. So
// every document carries a `fidelity` field, shown on the reader screen:
//
//   'close'         follows the surviving document closely in substance and
//                   largely in wording. Still check against the archive
//                   before this goes in front of a class.
//   'reconstructed' written in the form and language of the record — warrant
//                   formulas, account-book conventions, the standard clauses
//                   — but not a transcription of one specific surviving
//                   sheet. The substance is documented; the exact wording is
//                   a rendering.
//
// The distinction is displayed to the player, on purpose. A student noticing
// that some sources are transcriptions and some are reconstructions is a
// student doing source criticism, which is the entire point.
//
// ---------------------------------------------------------------------
// LENGTH, WHICH IS A HISTORICAL QUESTION AND NOT ONLY A DESIGN ONE
//
// These are excerpts, and they are meant to fit the reader without
// scrolling. A document a student scrolls through is a document a student
// skims. Two rules follow, and both are load-bearing:
//
//   * `original` lines are hand-wrapped to about 29 characters, because
//     that is the width of the reader's left column. Let a line run longer
//     and it wraps, doubling the line count for no gain.
//   * Anything cut from a transcription is marked `[…]` on its own line.
//     Silently trimming a source and still calling it the document would
//     teach exactly the wrong habit, in a game whose whole subject is what
//     a record does and does not say.
//
// `gloss` is a translation plus one pointed observation. It is not a place
// to re-narrate what the player has already been told by a person — that
// work belongs in dialogue, where somebody can be wrong about it.
//
// tools/check-fit.mjs measures every document against the real column box
// using the real fonts. Run it after editing anything here.
// ---------------------------------------------------------------------
//

// the Salem Witch-Hunt* (Cambridge, 2009), and the Salem Witch Trials
// Documentary Archive at the University of Virginia, both cited on screen.
// ---------------------------------------------------------------------

/** Notebook entries, in the order the player learned them. Internal
 *  bookkeeping flags (asked.*) never surface. */
function notebookEntries(state) {
  return state.knowledgeLog()
    .filter((e) => KNOWLEDGE[e.flag])
    .map((e) => ({ text: KNOWLEDGE[e.flag], source: e.source, flag: e.flag }));
}

/* ---------------------------------------------------------------------- *
 * The notebook, filed by who told you
 *
 * A finished game holds about ninety entries averaging a hundred and thirty
 * characters. As one flat scrolling list that is roughly seven screens of
 * unbroken prose, and a student looking for one thing in it will not find
 * it. So the notebook is headings, closed by default, one screen of them.
 *
 * Filed by SOURCE and not by chapter, deliberately. The axis a notebook is
 * organised on is the thing it teaches: file by chapter and a student
 * learns a chronology, file by source and they learn that every fact in
 * their notes arrived through a particular person who had a particular
 * reason to say it. That is the entire subject of this game, and it costs
 * nothing to make the filing system carry it.
 *
 * The one exception is `observed`. A third of everything the player knows
 * they saw for themselves, which would make one heading twice the size of
 * every other and by far the least interesting to open. It is split by
 * chapter — which is honest, because "what I saw in March" and "what I saw
 * in September" really are different bodies of evidence.
 * ---------------------------------------------------------------------- */

const WHEN = {
  memorial:  'at the memorial',
  march:     'in March',
  dig:       'at the parsonage dig',
  june:      'in June',
  archive:   'in the archive',
  september: 'in September',
  reckoning: 'at the memorial, afterwards',
};
function notebookGroups(state) {
  const groups = new Map();
  for (const e of state.knowledgeLog()) {
    if (!KNOWLEDGE[e.flag]) continue;
    const split = e.source === 'observed';
    const key = split ? `observed:${e.chapter}` : e.source;
    if (!groups.has(key)) {
      groups.set(key, {
        key,
        label: split
          ? `I saw this myself, ${WHEN[e.chapter] || e.chapter}`
          : sourceName(e.source),
        entries: [],
      });
    }
    groups.get(key).entries.push({ text: KNOWLEDGE[e.flag], flag: e.flag, source: e.source });
  }
  // Insertion order is the order the player met each source, which is the
  // order they will look for them in.
  return [...groups.values()];
}

/* ---------------------------------------------------------------------- *
 * Where a goal is
 *
 * Each step says where in the world it points, which drives the small
 * chevron at the screen edge. Deliberately NOT a minimap: the whole village
 * is about six screenfuls, and a map in the corner makes players watch the
 * corner instead of the village — and this game is entirely about noticing
 * the village.
 *
 * A multi-part goal returns the FIRST thing still outstanding, so the arrow
 * points at the next unfinished piece rather than at an average of four
 * places.
 * ---------------------------------------------------------------------- */

/**
 * The next thing outstanding — but if it is a document nobody has told the
 * player about yet, point at the person instead of at the paper.
 *
 * Documents are unlocked by conversation now, and the paper is not drawn
 * until somebody names it. So a goal reading "read the petition in the
 * Putnam house" would send a student to stand in front of an empty table.
 * The waypoint carries `via` — who to ask, and where they are — and the
 * step redirects there until that conversation has happened.
 */
const firstMissing = (s, list, has) => {
  const e = list.find((x) => !has(s, x));
  if (!e) return null;
  // `via` is an ordinary waypoint in its own right — it has a flag, a place
  // and a line — so everything downstream (the arrow, the goal text, the
  // key an NPC can point at) works on it without knowing it is a detour.
  // Marked as a detour so the goal text knows the destination has changed
  // out from under the step and must say so.
  if (e.via && !s.knows(e.via.flag)) return { ...e.via, detour: true };
  return e;
};
const byFlag = (s, e) => s.knows(e.flag);
const byDoc  = (s, e) => s.hasDoc(e.doc);
const byNpc  = (s, e) => s.hasSpokenTo(e.npc);
/**
 * A step that points at one fixed place.
 *
 * `key` names what is there, so a single-target step can be pointed at by a
 * character the same way a multi-part one can. Without it, the eight best
 * directions in the game were unreachable — Francis Nurse is standing in his
 * dooryard having just told you his wife is in the Salem jail, and the line
 * written for him, "South, down the road. They let people stand at the
 * bars", could never fire, because the step that wants it is a fixed place
 * rather than a list.
 */

/** The question the whole game exists to ask. Raised by the third panel at
 *  the memorial, then never dismissed. */
const STANDING = {
  id: 'why',
  text: 'What caused it?',
  active: (s) => s.knows('present.argument') && !s.answer,
};
function stepsFor(state) { return STEPS_BY_CHAPTER[state.chapter] || []; }

/**
 * The one thing the player is being asked for right now.
 *
 * A step that covers four items used to print all four: "look at the woodpile,
 * the seating chart, the account book, and a stone in the north woods". That
 * is a to-do list, and it reads as one — a student scans it, picks the nearest
 * item, and stops reading the game. Worse, the counter said 2/4 while the text
 * still named all four, so the two that were done stayed on screen as though
 * they were still owed.
 *
 * The waypoint already knows which item is outstanding, because the wayfinder
 * arrow points at it. So the text comes from the same place the arrow does,
 * and the two cannot disagree.
 */
function outstanding(state, step) {
  if (!step) return null;
  const w = typeof step.where === 'function' ? step.where(state) : step.where;
  return w && (w.flag || w.doc || w.npc || w.key) ? w : null;
}

/**
 * The goal line to print.
 *
 * Three cases, in order:
 *
 *   1. A DETOUR wins outright. The player has been sent somewhere other than
 *      where the step is about — go and ask this person before that table
 *      has anything on it — and the line has to say the new place.
 *   2. A STEP THAT COVERS SEVERAL ITEMS names the one still outstanding,
 *      because its own text would otherwise list all four while the counter
 *      says two of them are done. Those steps are the ones carrying `count`.
 *   3. OTHERWISE the step's own text, which is where the reason lives.
 *      March is a chain — each goal says what the last beat was, and why
 *      that sends you here — and a generic "read the agreement on the table"
 *      pulled from the waypoint throws exactly that away.
 */
function stepText(state, step) {
  if (!step) return null;
  const w = outstanding(state, step);
  if (w && w.detour) return w.line || step.text;
  if (step.text && !step.count) return step.text;
  return (w && w.line) || step.text;
}

/** What the outstanding item IS — a flag, a document, or a person — so a
 *  character standing in front of the player can point at it. */
function outstandingKey(state) {
  const w = outstanding(state, currentStep(state));
  return w ? (w.npc || w.doc || w.flag || w.key) : null;
}

/** Which map the current goal is on — so a character never points the
 *  player at something in the room they are already standing in. */
function outstandingMap(state) {
  const w = outstanding(state, currentStep(state));
  return w ? w.map : null;
}

/** The step currently in play, or null when the chapter is finished. */
function currentStep(state) {
  return stepsFor(state).find((o) => !o.done(state)) || null;
}
function progress(state) {
  const steps = stepsFor(state);
  return { done: steps.filter((o) => o.done(state)).length, total: steps.length };
}

// Steps that ARE the exit, and so must not gate themselves. "answer" is in
// here for the same reason: it is completed by the closing screen, which
// only opens once the chapter is otherwise finished.
const EXIT_STEPS = new Set(['leave', 'back', 'gap', 'answer']);

/** True when every step in the named chapter is complete — used to open
 *  the exits, so a player cannot skip past the point of a chapter. */
function chapterComplete(state, chapter) {
  return (STEPS_BY_CHAPTER[chapter] || [])
    .filter((o) => !EXIT_STEPS.has(o.id))
    .every((o) => o.done(state));
}

/** What is still missing, for the message shown at a closed exit. */
function remainingIn(state, chapter) {
  return (STEPS_BY_CHAPTER[chapter] || [])
    .filter((o) => !EXIT_STEPS.has(o.id))
    .filter((o) => !o.done(state));
}

/* ===== src/content/directions.js ===== */
// Where to go next, said by a person instead of by the corner of the screen.
//
// The objective HUD tells the player what is outstanding. That works, and a
// student who has never played a game before needs it. But a player who only
// reads the corner is playing the corner: they take the line, walk the arrow,
// press Z, and never look at the village the whole game is made of.
//
// So the people give directions too — but only when the player is actually
// stuck, and only about things the game has not just told them.
//
// ---------------------------------------------------------------------
// WHAT WENT WRONG THE FIRST TIME, BECAUSE ALL OF IT IS ENCODED HERE NOW
//
// The first version fired a pointer at the end of every conversation whose
// current goal this character happened to have a line about. Four separate
// failures came out of that, and they are worth naming because the fix for
// each is a rule in this file or in the caller:
//
//   1. THE AMBIENT VILLAGERS NEVER SHUT UP. A character with no topics ends
//      their conversation the instant the greeting finishes, so the woman at
//      the well, the man splitting wood, the watchman and the swineboy each
//      appended a direction to their single line, every time, forever. Those
//      are the characters a player walks past most. Most directions in the
//      game were therefore coming from people the player had not had a
//      conversation with at all — which is exactly the "this is machinery"
//      reading the pointer was supposed to avoid.
//
//   2. THEY POINTED AT PAPERS THE PLAYER HAD JUST BEEN TOLD ABOUT. Documents
//      became person-gated in the change before this one: the character who
//      unlocks a paper already says, in a written line, where it is. The
//      pointer then fired afterwards and said it again — in several cases
//      naming the wrong furniture, because the pointer text had not been
//      updated when the paper moved. Tituba sent the player to "his desk"
//      for an agreement lying on the table; Ingersoll sent them to "that
//      table" for a page now sitting on his bar.
//      => Every document pointer is deleted. If a paper needs explaining,
//         it gets explained by the person who unlocks it, in one place.
//
//   3. THEY POINTED AT THINGS IN THE ROOM. Ingersoll, standing four tiles
//      from his own account book, would tell the player to go and look at
//      his account book.
//      => Suppressed when the target is close enough to see — the same rule
//         the wayfinder chevron already uses, and for the same reason: if
//         you can see it, you do not need directions to it. NOT "same map":
//         the village is forty-six tiles by thirty-eight, and the boundary
//         stone in the north woods is genuinely a hike from the well.
//
//   4. THE EIGHT BEST LINES COULD NEVER FIRE. Francis Nurse, in his dooryard,
//      having just said his wife has been taken: "She is in the jail at Salem
//      town. South, down the road. They let people stand at the bars." Dead,
//      because a goal that points at one fixed place carried no name for what
//      was there, and only named things could be pointed at.
//      => `at()` waypoints take a key.
//
// ---------------------------------------------------------------------
// RULES FOR WRITING THESE
//

/**
 * The line this person has about what the player still owes, or null.
 *
 * Deliberately returns null far more often than not, and the caller adds
 * further conditions on top — see the header. A pointer on every goodbye
 * would train the player that the last line of every conversation is
 * machinery, and they would stop reading it.
 */
/**
 * Close enough to see, and therefore not worth giving directions to.
 *
 * Indoor maps render at 2x zoom, so about ten tiles by seven are on screen
 * at once; outdoors it is twice that. Measured from the speaker, whose
 * position is fixed — the player is standing next to them by definition.
 */
function withinSight(indoor, dx, dy) {
  // The view is 320x240 at 16px tiles: twenty tiles by fifteen outdoors, and
  // half that indoors, where everything renders at 2x. Half of each is how
  // far you can see from where you are standing.
  const rx = indoor ? 5 : 10;
  const ry = indoor ? 3 : 7;
  return Math.abs(dx) <= rx && Math.abs(dy) <= ry;
}
function pointerFor(state, npcId, key) {
  if (!npcId || !key || npcId === key) return null;
  const set = DIRECTIONS[npcId];
  if (!set || !set[key]) return null;
  if (state.knows(`pointed.${npcId}.${key}`)) return null;
  const v = set[key];
  return typeof v === 'string' ? v : (v[state.chapter] || null);
}

// The four cases historians actually argue, and the evidence a student can
// file under them.
//
// ---------------------------------------------------------------------
// THE ONE RULE THIS FILE EXISTS TO ENFORCE
//
// Nothing here says which theory a piece of evidence supports.
//
// That was the fork, and it matters more than it looks. The game could tag
// every fact with its cause and present four ready-made arguments, and a
// student who rushed would still see them. But deciding that Ingersoll's
// ledger is evidence about land and money — and noticing that it is *also*
// evidence about who had the standing to accuse whom — is the entire
// historical skill this game exists to practise. A game that files the
// evidence has done the reading for them and left them the typing.
//
// So the four cases are stated, the evidence is marked as arguable, and the
// filing is the player's. It is unscored, it is optional, a student who
// files nothing still finishes, and whatever they do file goes into the
// export as their own argument rather than the game's.
//
// ---------------------------------------------------------------------
// WHICH ENTRIES ARE FILABLE
//
// Not all of them. A finished notebook holds about ninety entries and most
// are texture — what a room smelled like, who was standing where. Asking a
// class to sort ninety items in a thirty-minute period would turn the best
// idea in the game into data entry.
//
// `ARGUABLE` is the subset a historian would actually cite in an argument
// about causes: roughly a third. Marking an entry arguable says "this is
// evidence about why", which is a different and much weaker claim than
// saying which why it is evidence for.
// ---------------------------------------------------------------------
const THEORIES = [
  {
    id: 'land',
    short: 'Land and money',
    title: 'LAND AND MONEY',
    blurb: 'A village split into two factions, feuding families, a disputed boundary, and a pattern in who accused whom.',
    // Named so a student can look the argument up afterwards. Deliberately
    // not presented as the answer — each of these historians is arguing
    // against the others.
    cite: 'Paul Boyer and Stephen Nissenbaum, Salem Possessed (1974)',
  },
  {
    id: 'war',
    short: 'The frontier war',
    title: 'THE WAR',
    blurb: 'A brutal war to the north, and refugees from it living in the very households that did most of the accusing.',
    cite: 'Mary Beth Norton, In the Devil\'s Snare (2002)',
  },
  {
    id: 'women',
    short: 'Who was accused',
    title: 'WHO WAS ACCUSED',
    blurb: 'Mostly women — and often women who stood to inherit property, or who had already been difficult in public.',
    cite: 'Carol Karlsen, The Devil in the Shape of a Woman (1987)',
  },
  {
    id: 'law',
    short: 'The law itself',
    title: 'THE LAW ITSELF',
    blurb: 'Spectral evidence, no defence counsel, a colony that had lost its charter, and a religion in which confessing was the only way to live.',
    cite: 'Bernard Rosenthal, Salem Story (1993)',
  },
];
const THEORY_IDS = THEORIES.map((t) => t.id);

/**
 * Knowledge flags that are evidence about causes rather than texture.
 *
 * Adding a flag here is a claim that a historian could build an argument on
 * it — NOT a claim about which argument. Several of these are cited by more
 * than one of the four, which is the point: the same ledger is evidence for
 * a village quarrel and for who had the standing to be believed.
 */
const ARGUABLE = new Set([
  // the village, its money, and its quarrels
  'fact.factions', 'fact.salary', 'fact.parris_deed', 'fact.topsfield',
  'fact.nurseland', 'clue.woodpile', 'clue.seating', 'clue.accounts',
  'clue.marker', 'clue.road',

  // the war to the north
  'fact.mercymaine', 'fact.maine_refugees', 'fact.maine_magistrates',
  'fact.maine_fear',

  // who was accused, and what they had in common
  'fact.tituba', 'fact.firstthree', 'fact.osborne', 'fact.good',
  'fact.womenproperty', 'fact.annsr', 'june.spectral', 'june.fatherwrites',

  // how the sickness started, and the bodily explanations
  'fact.girls', 'fact.griggs', 'fact.witchcake',
  'fact.wetyear', 'fact.spurredrye', 'fact.atetherye', 'fact.cattle',

  // the court
  'law.spectral', 'law.nocounsel', 'law.charter', 'law.confession',
  'law.ergot_rebut', 'sept.forfeiture', 'june.irons',
]);

/** Every filable entry the player currently holds. */
function filableEntries(state, KNOWLEDGE) {
  return state.knowledgeLog()
    .filter((e) => ARGUABLE.has(e.flag) && KNOWLEDGE[e.flag])
    .map((e) => ({ flag: e.flag, text: KNOWLEDGE[e.flag], source: e.source }));
}

/** How many pieces of evidence the player has filed under each theory. */
function filedCounts(state) {
  const counts = {};
  for (const t of THEORY_IDS) counts[t] = 0;
  for (const [, set] of state.filed) for (const id of set) if (counts[id] !== undefined) counts[id] += 1;
  return counts;
}

/** A bench inscription. Twenty of these, and they are all the same shape —
 *  which is the memorial's actual design argument: no ranking, no
 *  interesting one, just twenty people and what was done to them. */
function benchScript(b, state) {
  const lines = [
    { say: 'A granite slab, cantilevered out of the wall. Just long enough to sit on.', who: null },
    { say: `Cut into the edge:  ${b.name}`, who: null },
    { say: `${b.fate} · ${b.date}`, who: null },
  ];

  if (b.name === 'REBECCA NURSE') {
    lines.push(
      { learn: 'present.nurse', source: 'observed' },
      { say: 'It is exactly like the other nineteen. Same stone, same lettering, same length.', who: null },
    );
  }

  const memory = state && (BENCH_MEMORY[b.name] || []).find((m) => m.when(state));
  if (memory) {
    lines.push({ say: memory.say, who: null });
    // Only Rebecca Nurse gets a second beat, because she is the one the
    // player was told to remember before they had any reason to.
    if (b.name === 'REBECCA NURSE' && state.knows('june.warned')) {
      lines.push({ say: 'She was right that you had been listening to frightened people. She was wrong about the rest of it.', who: null });
    }
  } else if (b.name === 'REBECCA NURSE') {
    lines.push({ say: 'You will want to remember this one.', who: null });
  }

  return lines;
}

// The March 1692 cast.
//
// Timing is precise and it matters: this is the first week of March 1692.
// Betty Parris and Abigail Williams have been ill since midwinter. Doctor
// Griggs has already suggested the evil hand. Mary Sibley's witch cake was
// baked days ago. And nobody has been arrested yet.
//
// That week is the whole reason the March chapter works. Every grievance in
// the village is fully loaded and completely ordinary. The player meets a
// functioning community with a land dispute, a salary fight and a cold
// minister — and only later finds out what those ordinary things turned
// into.
//
// Voice rule: period-inflected but readable. No "forsooth". Where a real
// person's documented words exist they are used and marked in a comment;
// everything else is connective tissue written to be consistent with what
// the records show about that person.

const LINEN = '#d8d2c2';
const NPCS = {

  /* -------------------------------------------------------------------- *
   * NORA ALVAREZ, 17 — present day
   *

   * explaining the seventeenth century, the game turns into a worksheet

  nora: {

  /* ------------------------------------------------------------------ *
   * The rye farmer.
   *
   * THE HARD RULE, and everything about this character depends on it:
   * nobody alive in 1692 could connect blighted rye to a fit. The ergot
   * theory is Linnda Caporael's, published in Science in 1976. If this man
   * diagnoses anything, the history breaks.
   *
   * So he gives the player evidence and no interpretation. Every detail he
   * describes is real and is what the modern argument actually rests on:
   * black sclerotia replacing the grain (period farmers knew them as
   * cockspur or spurred rye and knew nothing else about them), a wet
   * growing season in 1691, a harvest you cannot afford to throw away, and
   * cattle slipping their calves — ergot causes abortion in livestock, and
   * a farmer would absolutely notice that and never know why.
   *
   * Then Dr. Whitfield hands the player the theory AND takes it apart. A
   * student who found this man walks into the archive certain they have
   * cracked it, and learns why a tidy cause that explains one symptom and
   * none of the pattern is usually the wrong answer. That sequence is the
   * best teaching this game does, and it only works because the evidence
   * was planted three chapters before the argument.
   * ------------------------------------------------------------------ */

/* ===== src/content/maps.js ===== */
// Salem Village and its interiors, March 1692.
//
// Geography is compressed but not invented. The meetinghouse sits at the
// centre with the parsonage close by; Ingersoll's ordinary is a short walk
// off; the Nurse homestead lies west and the Putnam land east, with the
// disputed Topsfield boundary north through the woods. Salem Town is five
// miles south, and the road there is walkable — the design doc is firm that
// the player should have that distance "in their legs" rather than be told
// about it.
//
// Ground is built with small stamping helpers rather than hand-typed ASCII.
// Counting columns in a 46-wide string is how ragged maps and mystery
// collision bugs happen; these helpers cannot produce a ragged grid.

/* ---------------------------------------------------------------------- *
 * Ground helpers
 * ---------------------------------------------------------------------- */

function grid(w, h, fill = '.') {
  return Array.from({ length: h }, () => new Array(w).fill(fill));
}

const rows = (g) => g.map((r) => r.join(''));

function box(g, x, y, w, h, ch) {
  for (let j = y; j < y + h; j++) {
    if (!g[j]) continue;
    for (let i = x; i < x + w; i++) {
      if (i < 0 || i >= g[j].length) continue;
      g[j][i] = ch;
    }
  }
}

/** Horizontal road, `t` tiles thick, starting at row y. */
function hroad(g, x0, x1, y, t = 2, ch = '-') { box(g, x0, y, x1 - x0 + 1, t, ch); }

/** Vertical road. */
function vroad(g, x, y0, y1, t = 2, ch = '-') { box(g, x, y0, t, y1 - y0 + 1, ch); }

/**
 * A rough patch of old snow lying in the shade.
 *
 * A strict circle test at small radii produces a hard plus-shape that reads
 * as a rendering artefact rather than as snow, so the edge is fattened and
 * then eroded with a deterministic hash. Same seed every load — the map must
 * not shimmer between sessions.
 */
function patch(g, cx, cy, r, ch = '*') {
  const h = (x, y) => {
    let n = x * 374761393 + y * 668265263 + r * 144665;
    n = (n ^ (n >>> 13)) >>> 0;
    return ((Math.imul(n, 1274126177) ^ (n >>> 16)) >>> 0) / 4294967296;
  };
  const rr = r * r + r * 0.9;
  for (let j = -r - 1; j <= r + 1; j++) {
    for (let i = -r - 1; i <= r + 1; i++) {
      const d = i * i + j * j;
      if (d > rr) continue;
      // Erode the outer ring so the blob has an irregular coastline.
      if (d > rr - r * 1.4 && h(cx + i, cy + j) < 0.45) continue;
      const y = cy + j, x = cx + i;
      if (!g[y] || x < 0 || x >= g[y].length) continue;
      if (g[y][x] === '.') g[y][x] = ch;   // never cover a road
    }
  }
}

/** A room: wall border, floor inside, one door gap in the bottom wall. */
function room(w, h, doorX) {
  const g = grid(w, h, 'f');
  box(g, 0, 0, w, 1, '#');
  box(g, 0, h - 1, w, 1, '#');
  box(g, 0, 0, 1, h, '#');
  box(g, w - 1, 0, 1, h, '#');
  g[h - 1][doorX] = 'f';
  return g;
}

/** Scatter evergreens along a rectangle's edge, skipping listed columns. */
function treeLine(kind, x0, x1, y, step = 2, skip = []) {
  const out = [];
  for (let x = x0; x <= x1; x += step) {
    if (skip.includes(x)) continue;
    out.push({ kind, x, y });
  }
  return out;
}

/* ---------------------------------------------------------------------- *
 * The village
 * ---------------------------------------------------------------------- */

const VW = 46, VH = 38;

function villageGround() {
  const g = grid(VW, VH, '.');

  // The two roads that organise the whole village.
  hroad(g, 4, 41, 20, 2);          // east-west, past the meetinghouse
  vroad(g, 22, 16, VH - 1, 2);     // north-south, out toward Salem Town

  // Spurs to each door.
  vroad(g, 10, 22, 28, 1);         // parsonage
  vroad(g, 33, 17, 20, 1);         // Ingersoll's tavern
  vroad(g, 33, 22, 29, 1);         // Putnam house
  vroad(g, 7, 14, 20, 1);          // Nurse homestead
  vroad(g, 28, 3, 20, 1);          // north, into the woods

  // A brook through the north woods.
  //
  // Colonial boundaries followed water, because water is the one line in a
  // forest that two parties can agree on without a survey. Putting the
  // disputed Topsfield line on a stream makes a thirty-year quarrel legible
  // at a glance: the marker stone stands on the bank of the thing being
  // argued over. The ford at x=14 is the only way across, and it is left
  // deliberately narrow — you should have to look for the crossing.
  hroad(g, 0, 21, 9, 1, '~');
  g[9][14] = '.';                  // the ford
  g[9][15] = '.';
  // The brook leaves the map east through the trees rather than stopping in
  // mid-air, which is what a one-tile stub would look like.
  g[8][21] = '~'; g[8][22] = '~'; g[7][22] = '~'; g[7][23] = '~';

  // Old snow in the shaded north and along the treelines.
  patch(g, 6, 4, 3); patch(g, 17, 3, 4); patch(g, 38, 5, 3);
  patch(g, 2, 16, 2); patch(g, 43, 27, 3); patch(g, 12, 34, 2);
  patch(g, 40, 14, 2);

  return rows(g);
}

/* ---------------------------------------------------------------------- *
 * Present day — the Salem Witch Trials Memorial, Charter Street
 *
 * Dedicated in 1992 for the tercentenary. A low granite enclosure with
 * twenty benches cantilevered out of the wall, one per person executed,
 * each cut with a name, a means of execution and a date. Black locust
 * trees inside. At the entrance, the victims' own protests of innocence
 * are inscribed into the threshold stones — and they run into the wall and
 * stop mid-sentence, to be walked over by everyone who comes in.
 *
 * That threshold is the first thing the player touches in this game, and
 * it is the whole thesis in one object: their words were cut off, and we
 * are still walking on them.
 * ---------------------------------------------------------------------- */

function memorialGround() {
  const g = grid(MW, MH, 'B');     // red brick sidewalk, a city block
  box(g, 5, 4, 18, 18, 'G');       // granite paving inside the enclosure
  box(g, 6, 5, 16, 16, 'L');       // the lawn

// The low wall: three sides plus a south face, with a gap at x=13-14 in each
// of the north and south walls — the entrance, and the way out of 1692.
const WALL_GAP = [13, 14];
const memorialWall = () => [
  ...Array.from({ length: 18 }, (_, i) => ({ kind: 'lowwall', x: 5, y: 4 + i })),
  ...Array.from({ length: 18 }, (_, i) => ({ kind: 'lowwall', x: 22, y: 4 + i })),
  ...Array.from({ length: 16 }, (_, i) => 6 + i)
    .filter((x) => !WALL_GAP.includes(x))
