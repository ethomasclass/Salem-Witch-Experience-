<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A thirty-minute walk through a village coming apart. High school US History.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'>
</head>
<body>
<title>Salem Village, 1692</title>
<style>
/* Page chrome, drawn from the game's own palette rather than default UI
     grey: weathered clapboard for labels, parchment for the title, madder
     for the one accent rule. Single dark theme on purpose — this is a
     viewing frame for a dark pixel-art canvas, and a light ground would
     fight the art rather than support it. */
  :root {
    color-scheme: dark;
    --ground:    #0e1013;
    --ground-2:  #14171b;
    --rule:      #23272d;
    --clapboard: #8a8172;
    --parchment: #e6e2d8;
    --madder:    #8f4530;
    --dim:       #6b727b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: var(--ground);
    color: #c9cdd3;
    font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  /* Masthead. Small, quiet, and out of the way — the game is the hero. */
  #masthead {
    width: min(100%, 1100px);
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    padding: 2px 4px 0;
  }
  #masthead h1 {
    margin: 0;
    font: 600 19px/1.1 Georgia, "Iowan Old Style", Palatino, serif;
    color: var(--parchment);
    letter-spacing: 0.01em;
  }
  #masthead .chapter {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--clapboard);
    border-left: 2px solid var(--madder);
    padding-left: 9px;
  }
  #masthead .tag {
    margin-left: auto;
    font-size: 12px;
    color: var(--dim);
    font-style: italic;
    font-family: Georgia, Palatino, serif;
  }
  @media (max-width: 620px) { #masthead .tag { display: none; } }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    /* Stop iPad/Chromebook touch scrolling from fighting the d-pad. */
    touch-action: none;
    user-select: none;
  }
  /* A fixed 4:3 box rather than a full-viewport fill: this has to survive
     being embedded in an iframe whose height is decided by the host page,
     where a height:100% layout collapses to nothing. */
  #stage {
    position: relative;
    width: min(100%, 1100px);
    max-width: 100%;
    min-width: 0;
    aspect-ratio: 4 / 3;
    max-height: min(82vh, 800px);
    margin: 0 auto;
    background: #0b0c0e;
  }
  #screen {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  /* min-width:0 is load-bearing: without it this flex item refuses to
     shrink below the width of the hint text, which pushes the whole page
     wider than the viewport on a phone and blows up the canvas sizing. */
  #bar {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 4px 12px calc(4px + env(safe-area-inset-bottom));
    flex-wrap: wrap;
    width: min(100%, 1100px);
    min-width: 0;
  }
  #bar .hint { flex-basis: 100%; text-align: center; min-width: 0; }
  @media (max-width: 620px) { #bar .hint { display: none; } }
  #bar button {
    font: inherit; font-size: 13px;
    color: #d3d7dd; background: var(--ground-2);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 7px 14px; cursor: pointer;
  }
  #bar button:hover { background: #1f232a; border-color: #363b43; }
  #bar button:focus-visible { outline: 2px solid var(--madder); outline-offset: 2px; }
  #bar .hint { color: var(--dim); font-size: 12px; }
  #bar kbd {
    font: inherit; font-size: 11px;
    background: var(--ground-2); border: 1px solid var(--rule);
    border-radius: 3px; padding: 1px 5px; color: #aab0b8;
  }
  #fallback {
    position: fixed; inset: 10% 8% auto 8%; height: 60%;
    background: #14161a; color: #d3d7dd;
    border: 1px solid #31353c; border-radius: 8px;
    padding: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    z-index: 20;
  }
  .hidden { display: none !important; }

  /* On-screen controls, shown only on touch devices. Anchored inside the
     stage rather than the viewport so they stay put when embedded. */
  #touch {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
  }
  #touch .pad, #touch .btns { position: absolute; bottom: 12px; pointer-events: auto; }
  #touch .pad { left: 12px; width: 156px; height: 156px; }
  #touch .btns { right: 12px; display: grid; gap: 10px; }
  #touch b {
    position: absolute; display: grid; place-items: center;
    width: 52px; height: 52px;
    background: rgba(30,34,40,0.72); border: 1px solid #3a3f47;
    border-radius: 10px; color: #aeb4bc; font-size: 18px;
  }
  #touch .pad b:nth-child(1) { left: 52px; top: 0; }
  #touch .pad b:nth-child(2) { left: 52px; top: 104px; }
  #touch .pad b:nth-child(3) { left: 0; top: 52px; }
  #touch .pad b:nth-child(4) { left: 104px; top: 52px; }
  #touch .btns b { position: relative; width: 64px; height: 44px; font-size: 13px; }

  #nojs, #nomodule {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 32px; text-align: center; background: #0b0c0e; z-index: 30;
  }
  #nomodule p { max-width: 34em; line-height: 1.6; }
  code { color: #9db4d0; }
</style>

<header id="masthead">
  <h1>Salem Village, 1692</h1>
  <span class="chapter">Seven chapters · ~32 minutes</span>

</div>

<script>
/* ===== src/palette.js ===== */
// Salem Village, 1692 — colour.
//
// Design rule: 1692 is cold greys and muted earth; the present-day interludes
// are warmer and more saturated. Early March in Essex County means dead dun
// grass, mud, patchy old snow and bare trees — which happens to be both
// historically right and the exact opposite temperature from the sunny GBA
// towns this game borrows its shape from.
//
// Every material gets a ramp of 3-4 shades plus a near-black outline. That
// ramp count is what separates a rich 16-bit look from a flat one.
const P = {
  // ---- ground ----------------------------------------------------------
  // Dun, not green. Nothing has greened up yet in the first week of March,
  // and keeping red slightly ahead of green in every step of this ramp is
  // what stops the village reading as a summer town.
  grassHi:   '#918366',
  grass:     '#7c7053',
  grassLo:   '#685d45',
  grassDeep: '#554c38',

  mudHi:     '#7f6c55',
  mud:       '#6b5a46',
  mudLo:     '#584938',
  mudDeep:   '#453a2c',

  // Old snow that has thawed and refrozen several times — never white.
  snowHi:    '#bcc0c4',
  snow:      '#a9aeb3',
  snowLo:    '#8e9497',

  waterHi:   '#5b7280',
  water:     '#4a5f6b',
  waterLo:   '#3a4b56',

  // ---- timber & building -----------------------------------------------
  // Unpainted riven clapboard, weathered a few winters. Paint was an expense
  // almost nobody in the village was carrying in 1692.
  wallHi:    '#9d9484',
  wall:      '#877e6f',
  wallLo:    '#6e6659',
  wallDeep:  '#565044',

  roofHi:    '#6c6d73',
  roof:      '#585a60',
  roofLo:    '#46484e',
  roofDeep:  '#36383d',

  // Interior floorboards: distinctly darker than the wall sheathing, and
  // laid across rather than up, so a room never reads as one flat texture.
  floorHi:   '#6d6154',
  floorMid:  '#5a5044',
  floorLo:   '#4a4136',
  floorSeam: '#332c25',

  doorHi:    '#7a6249',
  door:      '#63503b',
  doorLo:    '#4c3d2d',

  glass:     '#2b3037',
  glassLit:  '#7c8790',
  frame:     '#a9a191',

  stoneHi:   '#8a8c8f',
  stone:     '#72747a',
  stoneLo:   '#5c5e64',

  // ---- vegetation -------------------------------------------------------
  barkHi:    '#5d4c3d',
  bark:      '#4a3c30',
  barkLo:    '#382d24',

  pineHi:    '#4c5f47',
  pine:      '#3c4d39',
  pineLo:    '#2e3c2c',

  brushHi:   '#6a5e46',
  brush:     '#564c38',

  // ---- present day ------------------------------------------------------
  // The other half of the game. 1692 is cold greys and muted earth; the
  // present is warmer, greener and more saturated, so a student can tell
  // which century they are standing in before reading a single word.
  lawnHi:    '#7f9757',
  lawn:      '#69814b',
  lawnLo:    '#566a3d',
  lawnDeep:  '#455630',

  // Salem's downtown sidewalks are red brick. Using it here is accurate and
  // it also does the heavy lifting of separating three materials that would
  // otherwise all be grey: brick outside, granite enclosure, green lawn.
  brickHi:   '#8f5c4a',
  brick:     '#7b4d3f',
  brickLo:   '#653f34',
  mortar:    '#94897d',

  graniteHi: '#aeaeaa',
  granite:   '#94928e',
  graniteLo: '#787674',
  graniteDeep:'#5d5b59',

  asphaltHi: '#4e4f52',
  asphalt:   '#414245',
  asphaltLo: '#343538',

  leafHi:    '#8fa961',
  leaf:      '#728b4d',
  leafLo:    '#586d3b',

  // ---- ink --------------------------------------------------------------
  outline:   '#26262a',
  ink:       '#1b1c1f',
  shadow:    'rgba(28,28,32,0.28)',

  // ---- ui ---------------------------------------------------------------
  boxFill:   '#efeade',
  boxFill2:  '#ded7c6',
  boxEdge:   '#3a3630',
  boxInk:    '#26241f',
  boxDim:    '#6b6558',
  accent:    '#7d3f2c',
};

// Cloth colours for villagers. Puritan dress was not the black-and-white of
// later illustration — it was madder red, murrey, russet, sadd greens and
// undyed wool. Black cloth was expensive and reserved for Sunday best by
// those who could afford it, which is itself a class signal worth showing.
const CLOTH = {
  russet:   ['#8a6a4c', '#725640', '#5a4331'],
  murrey:   ['#7a4750', '#633a41', '#4c2c32'],
  madder:   ['#95513f', '#7b4133', '#613228'],
  saddGreen:['#5f6647', '#4d533a', '#3c412e'],
  undyed:   ['#b0a894', '#978f7d', '#7c7566'],
  slate:    ['#5c626c', '#4b5058', '#3b3f46'],
  black:    ['#3e3c3d', '#312f30', '#242223'],
  linen:    ['#cfc8b6', '#b5ae9c', '#98917f'],

  // Present day.
  staffTeal:['#41908b', '#31716d', '#245452'],
  denim:    ['#4d5d76', '#3c495e', '#2d3748'],
  hoodie:   ['#4a6d8c', '#3b5871', '#2c4356'],
};

// Skin ramps: highlight, mid, shadow.
const FLESH = {
  fair:   ['#e0bb9a', '#c79b7a', '#a67a5c'],
  ruddy:  ['#dcae8a', '#bf8e6b', '#9c6e4f'],
  olive:  ['#c9a077', '#a9825d', '#876446'],
  brown:  ['#a9784f', '#8a5e3d', '#6b472d'],
  deep:   ['#7d5334', '#63402a', '#4b301f'],
};
const HAIR = {
  black:  ['#3b3b3e', '#2b2b2e', '#1e1e21'],
  dark:   ['#4a3b2e', '#382c22', '#271e17'],
  brown:  ['#6b5238', '#54402b', '#3e2f20'],
  grey:   ['#a09a90', '#87817a', '#6b6660'],
  white:  ['#cfcac2', '#b0aba3', '#8f8a83'],
  auburn: ['#7d4b32', '#633a26', '#4a2b1c'],
};

/* ===== src/engine/pixels.js ===== */
// Low-level pixel-art helpers.
//
// Everything in this game is drawn procedurally into offscreen canvases once
// at boot, then blitted. No image assets to load, no CORS, no sprite sheet to
// keep in sync — which matters when the deploy target is a school Chromebook
// on a filtered network that may or may not let a .png through.

/** Create an offscreen canvas with image smoothing off. */
function surface(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { canvas: c, g, w, h };
}

/** Deterministic hash -> [0,1). Used for texture variation that must not
 *  shimmer between frames, so never use Math.random() for anything drawn. */
function hash(x, y, seed = 0) {
  let h = x * 374761393 + y * 668265263 + seed * 1274126177;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/** Filled rect, integer-snapped. */
function rect(g, x, y, w, h, color) {
  g.fillStyle = color;
  g.fillRect(x | 0, y | 0, w | 0, h | 0);
}

/** Single pixel. */
function px(g, x, y, color) {
  g.fillStyle = color;
  g.fillRect(x | 0, y | 0, 1, 1);
}

/** 1px hollow rect — the outline pass that sells the 16-bit look. */
function stroke(g, x, y, w, h, color) {
  rect(g, x, y, w, 1, color);
  rect(g, x, y + h - 1, w, 1, color);
  rect(g, x, y, 1, h, color);
  rect(g, x + w - 1, y, 1, h, color);
}

/** Horizontal 1px line. */
function hline(g, x, y, w, color) { rect(g, x, y, w, 1, color); }

/** Vertical 1px line. */
function vline(g, x, y, h, color) { rect(g, x, y, 1, h, color); }

/** Bresenham line, for roof rakes and branches. */
function line(g, x0, y0, x1, y1, color) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    px(g, x0, y0, color);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

/** Filled ellipse, pixel-stepped so it keeps hard edges. */
function ellipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t < 0) continue;
    const w = Math.round(rx * Math.sqrt(t));
    if (w <= 0) continue;
    g.fillRect((cx - w) | 0, (cy + y) | 0, w * 2, 1);
  }
}

/** 50% checker dither between two colours — the classic way to fake a shade
 *  between two ramp steps without spending a palette slot on it. */
function dither(g, x, y, w, h, a, b, phase = 0) {
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      px(g, x + i, y + j, ((i + j + phase) & 1) ? b : a);
    }
  }
}

/** Sparse speckle, seeded. Density is 0..1. Used for grass tufts, gravel,
 *  shingle wear — anything that should look hand-placed but stay stable. */
function speckle(g, x, y, w, h, color, density, seed = 0) {
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (hash(x + i, y + j, seed) < density) px(g, x + i, y + j, color);
    }
  }
}

/** Draw an existing surface into a 2d context at integer coords. */
function blit(g, src, x, y) {
  g.drawImage(src.canvas, x | 0, y | 0);
}

/** Tint an entire surface by compositing a colour over its opaque pixels.
 *  Used for the night/indoor mood shift without a second set of art. */
function tint(surf, color, alpha) {
  const { g, w, h } = surf;
  g.save();
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.fillRect(0, 0, w, h);
  g.restore();
}

/** Build a surface from a string-art grid. `key` maps chars to colours;
 *  space and '.' are transparent. Lets small sprites be authored as legible
 *  ASCII rather than a hundred rect() calls. */
function fromArt(rows, key, scale = 1) {
  const h = rows.length, w = rows[0].length;
  const s = surface(w * scale, h * scale);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === ' ' || ch === '.') continue;
      const c = key[ch];
      if (!c) continue;
      rect(s.g, x * scale, y * scale, scale, scale, c);
    }
  }
  return s;
}

/* ===== src/engine/art-ground.js ===== */
// Ground tiles.
//
// 16x16, built once at boot. Each terrain type is generated in 16 edge
// variants (a bitmask of which of N/E/S/W border a *different* terrain) so
// paths and snow get proper rims instead of hard checkerboard seams. That
// rim is most of what makes a GBA-era map read as hand-drawn.
const TS = 16; // tile size

const N = 1, E = 2, S = 4, W = 8;

/* ---------------------------------------------------------------------- *
 * Terrain painters. Each fills a 16x16 surface, edge-unaware; the rim pass
 * runs afterwards so every type gets consistent border treatment.
 * ---------------------------------------------------------------------- */

function paintGrass(g, v) {
  // Dead late-winter grass: dun, not green. Broken up with darker tufts and
  // a few bleached highlights so large fields don't band.
  rect(g, 0, 0, TS, TS, P.grass);
  speckle(g, 0, 0, TS, TS, P.grassLo, 0.12, 11 + v * 7);
  speckle(g, 0, 0, TS, TS, P.grassHi, 0.06, 31 + v * 13);

  // A couple of grass blades, placed by hash so they're stable per variant.
  for (let i = 0; i < 3; i++) {
    const bx = 2 + Math.floor(hash(i, v, 5) * 12);
    const by = 3 + Math.floor(hash(i, v, 9) * 10);
    vline(g, bx, by, 2, P.grassDeep);
    px(g, bx + 1, by + 1, P.grassDeep);
  }
}

function paintMud(g, v) {
  // The village had no paved street. This is churned, half-frozen mud.
  rect(g, 0, 0, TS, TS, P.mud);
  speckle(g, 0, 0, TS, TS, P.mudLo, 0.20, 3 + v * 5);
  speckle(g, 0, 0, TS, TS, P.mudHi, 0.10, 17 + v * 11);

  // Cart ruts: two faint parallel grooves, offset per variant.
  const r = v & 1 ? 4 : 5;
  for (let y = 0; y < TS; y++) {
    if ((y + v) % 3 === 0) continue;
    px(g, r, y, P.mudDeep);
    px(g, r + 6, y, P.mudDeep);
  }
}

function paintSnow(g, v) {
  // Old snow, not fresh — grey where it has thawed and refrozen.
  rect(g, 0, 0, TS, TS, P.snow);
  speckle(g, 0, 0, TS, TS, P.snowHi, 0.16, 7 + v * 3);
  speckle(g, 0, 0, TS, TS, P.snowLo, 0.12, 23 + v * 9);
  // Grass poking through where it has worn thin.
  for (let i = 0; i < 2; i++) {
    const bx = 3 + Math.floor(hash(i, v, 41) * 10);
    const by = 4 + Math.floor(hash(i, v, 47) * 8);
    px(g, bx, by, P.grassLo);
    px(g, bx, by + 1, P.grassLo);
  }
}

function paintWater(g, v) {
  rect(g, 0, 0, TS, TS, P.water);
  speckle(g, 0, 0, TS, TS, P.waterLo, 0.14, 13 + v * 6);
  // Two horizontal ripple strokes.
  const y0 = 3 + v * 2, y1 = 10 + ((v * 3) % 4);
  hline(g, 2, y0, 6, P.waterHi);
  hline(g, 9, y1, 5, P.waterHi);
}

function paintFloor(g, v) {
  // Wide riven floorboards laid east-west. Deliberately darker and running
  // the opposite direction to the wall sheathing — otherwise a room is one
  // undifferentiated brown texture and the space stops reading.
  rect(g, 0, 0, TS, TS, P.floorMid);
  speckle(g, 0, 0, TS, TS, P.floorLo, 0.10, 19 + v * 4);
  for (let y = 0; y < TS; y += 5) {
    hline(g, 0, y, TS, P.floorSeam);
    hline(g, 0, y + 1, TS, P.floorHi);
  }
  // Board-end joints, staggered per variant so the floor doesn't grid up.
  const joint = (v & 1) ? 4 : 11;
  vline(g, joint, 0, TS, P.floorSeam);
}

/* ---- present day ------------------------------------------------------ */

function paintLawn(g, v) {
  // Mown, watered, municipal. The deliberate opposite of the 1692 grass:
  // green, even, and obviously looked after by somebody with a budget.
  rect(g, 0, 0, TS, TS, P.lawn);
  speckle(g, 0, 0, TS, TS, P.lawnLo, 0.14, 61 + v * 5);
  speckle(g, 0, 0, TS, TS, P.lawnHi, 0.10, 73 + v * 9);
  // Mower stripes, alternating by tile column so the lawn reads as tended.
  if (v & 1) {
    for (let y = 0; y < TS; y++) if ((y & 3) === 0) hline(g, 0, y, TS, P.lawnHi);
  }
}

function paintPaving(g, v) {
  // Granite pavers. Big slabs, tight joints.
  rect(g, 0, 0, TS, TS, P.granite);
  speckle(g, 0, 0, TS, TS, P.graniteLo, 0.16, 83 + v * 4);
  speckle(g, 0, 0, TS, TS, P.graniteHi, 0.10, 89 + v * 7);
  // Joints, staggered per variant so it reads as coursed rather than tiled.
  hline(g, 0, 0, TS, P.graniteDeep);
  const j = (v & 1) ? 0 : 8;
  vline(g, j, 0, TS, P.graniteDeep);
  hline(g, 0, 8, TS, P.graniteDeep);
  vline(g, (j + 8) % TS, 8, 8, P.graniteDeep);
}

function paintBrick(g, v) {
  // Running bond, four courses to a tile, staggered by variant.
  rect(g, 0, 0, TS, TS, P.mortar);
  const off = (v & 1) ? 4 : 0;
  for (let row = 0; row < 4; row++) {
    const y = row * 4;
    const stagger = ((row & 1) ? 4 : 0) + off;
    for (let x = -8; x < TS; x += 8) {
      const bx = x + stagger;
      rect(g, bx, y, 7, 3, P.brick);
      hline(g, bx, y, 7, P.brickHi);
      px(g, bx + 6, y + 2, P.brickLo);
    }
  }
  speckle(g, 0, 0, TS, TS, P.brickLo, 0.08, 107 + v * 5);
}

function paintAsphalt(g, v) {
  rect(g, 0, 0, TS, TS, P.asphalt);
  speckle(g, 0, 0, TS, TS, P.asphaltLo, 0.22, 97 + v * 3);
  speckle(g, 0, 0, TS, TS, P.asphaltHi, 0.12, 101 + v * 6);
}

function paintWall(g, v) {
  // Interior wall: riven vertical sheathing boards, no plaster and no paint.
  // Most village houses were unfinished inside; the boards were the wall.
  rect(g, 0, 0, TS, TS, P.wallLo);
  for (let x = 0; x < TS; x += 5) {
    vline(g, x, 0, TS, P.wallDeep);
    vline(g, x + 1, 0, TS, P.wall);
    vline(g, x + 2, 0, TS, P.wallHi);
  }
  speckle(g, 0, 0, TS, TS, P.wallDeep, 0.06, 43 + v * 6);
  // Knots, placed by hash so a long wall doesn't visibly repeat.
  if (v & 1) { px(g, 4 + v, 6, P.wallDeep); px(g, 4 + v, 7, P.wallDeep); }
}

function paintHearthstone(g, v) {
  rect(g, 0, 0, TS, TS, P.stoneLo);
  speckle(g, 0, 0, TS, TS, P.stone, 0.30, 29 + v * 8);
  speckle(g, 0, 0, TS, TS, P.stoneHi, 0.08, 37 + v * 8);
}

const PAINTERS = {
  grass: paintGrass,
  mud: paintMud,
  snow: paintSnow,
  water: paintWater,
  floor: paintFloor,
  wall: paintWall,
  hearthstone: paintHearthstone,
  lawn: paintLawn,
  paving: paintPaving,
  brick: paintBrick,
  asphalt: paintAsphalt,
};

/* ---------------------------------------------------------------------- *
 * Rim pass
 * ---------------------------------------------------------------------- */

// What colour a terrain uses for its own outer rim, and whether it gets a
// soft inner highlight just inside that rim.
const RIM = {
  grass: null,                                   // grass is the base; no rim
  mud:   { edge: P.mudDeep, inner: P.mudLo },
  snow:  { edge: P.snowLo,  inner: P.snowHi },
  water: { edge: P.waterLo, inner: null },
  floor: { edge: P.floorSeam, inner: null },
  wall:  { edge: P.outline, inner: null },
  hearthstone: { edge: P.stoneLo, inner: null },
  lawn:  { edge: P.lawnDeep, inner: P.lawnLo },
  paving:{ edge: P.graniteDeep, inner: null },
  brick: { edge: P.brickLo, inner: null },
  asphalt:{ edge: P.asphaltLo, inner: null },
};

function applyRim(g, type, mask) {
  const r = RIM[type];
  if (!r || !mask) return;
  if (mask & N) { hline(g, 0, 0, TS, r.edge); if (r.inner) hline(g, 0, 1, TS, r.inner); }
  if (mask & S) { hline(g, 0, TS - 1, TS, r.edge); if (r.inner) hline(g, 0, TS - 2, TS, r.inner); }
  if (mask & W) { vline(g, 0, 0, TS, r.edge); if (r.inner) vline(g, 1, 0, TS, r.inner); }
  if (mask & E) { vline(g, TS - 1, 0, TS, r.edge); if (r.inner) vline(g, TS - 2, 0, TS, r.inner); }

  // Knock the corner pixel out on outside corners so rims read as rounded
  // rather than as a hard box.
  if ((mask & N) && (mask & W)) px(g, 0, 0, r.edge);
  if ((mask & N) && (mask & E)) px(g, TS - 1, 0, r.edge);
  if ((mask & S) && (mask & W)) px(g, 0, TS - 1, r.edge);
  if ((mask & S) && (mask & E)) px(g, TS - 1, TS - 1, r.edge);
}

/* ---------------------------------------------------------------------- *
 * Build
 * ---------------------------------------------------------------------- */

const VARIANTS = 4;

/** tiles[type][mask][variant] -> surface */
function buildGroundTiles() {
  const out = {};
  for (const type of Object.keys(PAINTERS)) {
    out[type] = [];
    for (let mask = 0; mask < 16; mask++) {
      const vs = [];
      for (let v = 0; v < VARIANTS; v++) {
        const s = surface(TS, TS);
        PAINTERS[type](s.g, v);
        applyRim(s.g, type, mask);
        vs.push(s);
      }
      out[type].push(vs);
    }
  }
  return out;
}

/** Pick a stable variant index for a map cell. */
function variantFor(x, y) {
  return Math.floor(hash(x, y, 101) * VARIANTS) % VARIANTS;
}
const EDGE_BITS = { N, E, S, W };

/* ===== src/engine/art-props.js ===== */
// Props: buildings, trees, fences, and the objects the player can examine.
//
// The important thing here is PROJECTION. This is not a true overhead view.
// Like the GBA Pokémon towns it borrows from, a building shows its roof from
// slightly above AND its front wall straight on, in the same image. That
// oblique cheat is what makes a village read as a place you're standing in
// rather than a floor plan.
//
// Everything is drawn into a surface sized to a whole number of 16px tiles,
// so props drop onto the tile grid cleanly and sort against the player by
// their baseline (bottom edge).



/* ---------------------------------------------------------------------- *
 * Buildings
 * ---------------------------------------------------------------------- */

function shingles(g, x0, y0, w, h, topInset) {
  // Split cedar shingles, laid in courses. Each course is 4px, drawn from the
  // eave upward so the overlap shadow falls the right way.
  const rows = Math.ceil(h / 4);
  for (let r = 0; r < rows; r++) {
    const yy = y0 + h - (r + 1) * 4;
    // Roof narrows toward the ridge — that taper is the whole illusion.
    const t = (r * 4) / h;
    const inset = Math.round(topInset * t);
    const xx = x0 + inset;
    const ww = w - inset * 2;
    if (ww <= 0) continue;

    const band = r % 2 === 0 ? P.roof : P.roofLo;
    rect(g, xx, yy, ww, 4, band);
    // Course shadow along the bottom of each row.
    hline(g, xx, yy + 3, ww, P.roofDeep);
    // Vertical shingle joints, staggered per course.
    for (let sx = xx + ((r % 2) ? 0 : 3); sx < xx + ww; sx += 6) {
      vline(g, sx, yy, 3, P.roofDeep);
    }
    // Weathering highlights.
    speckle(g, xx, yy, ww, 3, P.roofHi, 0.05, 71 + r * 5);
  }
}

function window16(g, x, y, w = 10, h = 11) {
  // Small leaded casement. Glass was expensive and windows were tiny; that
  // is why these interiors were dark, which is worth the player noticing.
  rect(g, x - 1, y - 1, w + 2, h + 2, P.wallDeep);
  rect(g, x, y, w, h, P.frame);
  rect(g, x + 1, y + 1, w - 2, h - 2, P.glass);
  // Diamond quarrel leading.
  for (let i = 1; i < h - 1; i += 3) hline(g, x + 1, y + i, w - 2, P.frame);
  vline(g, x + Math.floor(w / 2), y + 1, h - 2, P.frame);
  // A single glare pixel-run, top-left, as if catching the grey sky.
  hline(g, x + 1, y + 1, 3, P.glassLit);
  px(g, x + 1, y + 2, P.glassLit);
}

function door16(g, x, y, w = 12, h = 18) {
  rect(g, x - 1, y - 1, w + 2, h + 1, P.wallDeep);
  rect(g, x, y, w, h, P.door);
  // Vertical batten planks.
  for (let i = 3; i < w; i += 4) vline(g, x + i, y + 1, h - 1, P.doorLo);
  // Two cross-battens.
  hline(g, x, y + 4, w, P.doorHi);
  hline(g, x, y + h - 6, w, P.doorHi);
  // Latch and strap hinge.
  px(g, x + w - 3, y + Math.floor(h / 2), '#2f2a24');
  px(g, x + w - 4, y + Math.floor(h / 2), '#2f2a24');
  hline(g, x + 1, y + 5, 4, '#2f2a24');
  hline(g, x + 1, y + h - 5, 4, '#2f2a24');
}

function chimney(g, x, y, w, h) {
  rect(g, x, y, w, h, P.stone);
  speckle(g, x, y, w, h, P.stoneLo, 0.35, 91);
  speckle(g, x, y, w, h, P.stoneHi, 0.12, 97);
  stroke(g, x, y, w, h, P.outline);
  // Cap course.
  rect(g, x - 1, y, w + 2, 2, P.stoneHi);
  hline(g, x - 1, y + 2, w + 2, P.outline);
}

/**
 * Build a house.
 *
 * @param wT,hT   size in tiles
 * @param opts.doorCol   tile column (0-based) the door sits in
 * @param opts.windows   array of tile columns to place windows in
 * @param opts.roofFrac  fraction of height given to roof (0..1)
 * @param opts.chimney   'center' | 'left' | 'right' | null
 */
function buildHouse(wT, hT, opts = {}) {
  const {
    doorCol = Math.floor(wT / 2),
    windows = [],
    roofFrac = 0.52,
    chimney: chim = 'center',
  } = opts;

  const W = wT * TS, H = hT * TS;
  const s = surface(W, H + 6);           // +6 so the eave shadow has room
  const g = s.g;

  const foundH = 5;
  const roofH = Math.round(H * roofFrac);
  const wallY = roofH;
  const wallH = H - roofH - foundH;
  const overhang = 3;

  // --- chimney goes behind the ridge -----------------------------------
  if (chim) {
    const cw = 10, ch = 14;
    const cx = chim === 'center' ? Math.round(W / 2 - cw / 2)
             : chim === 'left'   ? Math.round(W * 0.24)
             :                     Math.round(W * 0.72);
    chimney(g, cx, 2, cw, ch);
  }

  // --- roof -------------------------------------------------------------
  const rx = -overhang, rw = W + overhang * 2;
  const topInset = Math.round(roofH * 0.34);
  shingles(g, rx, 8, rw, roofH - 8, topInset);

  // Ridge cap.
  const ridgeW = rw - topInset * 2;
  rect(g, rx + topInset, 6, ridgeW, 3, P.roofHi);
  hline(g, rx + topInset, 6, ridgeW, P.outline);
  hline(g, rx + topInset, 8, ridgeW, P.roofDeep);

  // Rake edges (the sloping sides), drawn as outline so the gable reads.
  line(g, rx + topInset, 7, rx, roofH, P.outline);
  line(g, rx + rw - topInset - 1, 7, rx + rw - 1, roofH, P.outline);

  // Eave: bright board, then the shadow it throws on the wall below.
  rect(g, rx, roofH - 3, rw, 3, P.roofHi);
  hline(g, rx, roofH - 4, rw, P.outline);
  hline(g, rx, roofH, rw, P.outline);
  rect(g, 0, roofH + 1, W, 3, P.wallDeep);

  // --- wall -------------------------------------------------------------
  rect(g, 0, wallY + 4, W, wallH - 4, P.wall);
  // Clapboard courses: each board casts a 1px shadow under its lower edge.
  for (let y = wallY + 6; y < wallY + wallH; y += 4) {
    hline(g, 0, y, W, P.wallLo);
    hline(g, 0, y + 1, W, P.wallHi);
  }
  speckle(g, 0, wallY + 4, W, wallH - 4, P.wallDeep, 0.04, 55);
  // Corner posts.
  rect(g, 0, wallY + 4, 3, wallH - 4, P.wallLo);
  rect(g, W - 3, wallY + 4, 3, wallH - 4, P.wallLo);
  vline(g, 0, wallY + 4, wallH - 4, P.outline);
  vline(g, W - 1, wallY + 4, wallH - 4, P.outline);

  // --- openings ---------------------------------------------------------
  const winY = wallY + 8;
  for (const col of windows) {
    window16(g, col * TS + 3, winY);
  }
  const dW = 12, dH = Math.min(20, wallH - 6);
  const dX = doorCol * TS + Math.floor((TS - dW) / 2);
  const dY = H - foundH - dH;
  door16(g, dX, dY, dW, dH);
  // Doorstone.
  rect(g, dX - 2, H - foundH, dW + 4, 3, P.stoneHi);
  hline(g, dX - 2, H - foundH + 3, dW + 4, P.stoneLo);

  // --- foundation -------------------------------------------------------
  rect(g, 0, H - foundH, W, foundH, P.stone);
  speckle(g, 0, H - foundH, W, foundH, P.stoneLo, 0.34, 61);
  speckle(g, 0, H - foundH, W, foundH, P.stoneHi, 0.14, 67);
  hline(g, 0, H - foundH, W, P.outline);

  // --- lean-to ----------------------------------------------------------
  // The visible half of a saltbox. A family that needed another room added
  // one against the end wall under a single long slope, and the result is
  // the silhouette everyone pictures when they picture a colonial house.
  if (opts.leanTo) {
    const lw = Math.round(W * 0.30);
    const lx = opts.leanTo === 'left' ? -overhang : W - lw + overhang;
    const lRoofTop = roofH - 8;
    const lRoofH = 12;
    rect(g, lx, lRoofTop, lw, lRoofH, P.roofLo);
    for (let yy = lRoofTop; yy < lRoofTop + lRoofH; yy += 4) hline(g, lx, yy + 3, lw, P.roofDeep);
    hline(g, lx, lRoofTop, lw, P.outline);
    rect(g, lx, lRoofTop + lRoofH - 2, lw, 2, P.roofHi);
    hline(g, lx, lRoofTop + lRoofH, lw, P.outline);
    const lwx = opts.leanTo === 'left' ? 0 : W - lw + overhang;
    const lwWidth = lw - overhang;
    rect(g, lwx, lRoofTop + lRoofH + 1, lwWidth, H - foundH - lRoofTop - lRoofH - 1, P.wall);
    for (let yy = lRoofTop + lRoofH + 3; yy < H - foundH; yy += 4) {
      hline(g, lwx, yy, lwWidth, P.wallLo);
      hline(g, lwx, yy + 1, lwWidth, P.wallHi);
    }
    if (opts.leanTo === 'left') vline(g, 0, lRoofTop + lRoofH, H - foundH - lRoofTop - lRoofH, P.outline);
    else vline(g, W - 1, lRoofTop + lRoofH, H - foundH - lRoofTop - lRoofH, P.outline);
  }

  // --- ground shadow ----------------------------------------------------
  g.fillStyle = P.shadow;
  g.fillRect(2, H, W - 4, 4);

  return s;
}

/**
 * An English barn. Bigger than any house in the village, no chimney, and a
 * pair of great doors in the long side — which is what a barn IS in New
 * England in 1692: a threshing floor with bays either side.
 *
 * Worth building because it corrects the picture. Salem Village was a
 * farming community, not a town: the largest building on most properties
 * was the one the animals and the harvest lived in.
 */
function buildBarn(wT = 8, hT = 6) {
  const W = wT * TS, H = hT * TS;
  const s = surface(W, H + 6);
  const g = s.g;
  const foundH = 4;
  const roofH = Math.round(H * 0.5);
  const wallH = H - roofH - foundH;
  const overhang = 3;

  // Roof — steeper and plainer than a house, no chimney.
  const rx = -overhang, rw = W + overhang * 2;
  const topInset = Math.round(roofH * 0.30);
  shingles(g, rx, 4, rw, roofH - 4, topInset);
  const ridgeW = rw - topInset * 2;
  rect(g, rx + topInset, 2, ridgeW, 3, P.roofHi);
  hline(g, rx + topInset, 2, ridgeW, P.outline);
  line(g, rx + topInset, 3, rx, roofH, P.outline);
  line(g, rx + rw - topInset - 1, 3, rx + rw - 1, roofH, P.outline);
  rect(g, rx, roofH - 3, rw, 3, P.roofHi);
  hline(g, rx, roofH, rw, P.outline);
  rect(g, 0, roofH + 1, W, 3, P.wallDeep);

  // Wall: vertical board-and-batten, not clapboard. Different texture from
  // every house, so the barn reads as a barn at a glance.
  const wy = roofH + 4;
  rect(g, 0, wy, W, wallH, P.wallLo);
  for (let x = 0; x < W; x += 6) {
    vline(g, x, wy, wallH, P.wallDeep);
    vline(g, x + 1, wy, wallH, P.wall);
  }
  speckle(g, 0, wy, W, wallH, P.wallDeep, 0.05, 501);
  vline(g, 0, wy, wallH, P.outline);
  vline(g, W - 1, wy, wallH, P.outline);

  // The great doors, centred, tall enough for a loaded cart.
  const dW = 30, dH = wallH - 3;
  const dX = Math.round(W / 2 - dW / 2), dY = H - foundH - dH;
  rect(g, dX - 1, dY - 1, dW + 2, dH + 1, P.wallDeep);
  rect(g, dX, dY, dW, dH, P.doorLo);
  for (let i = 4; i < dW; i += 5) vline(g, dX + i, dY + 1, dH - 1, P.door);
  hline(g, dX, dY + 4, dW, P.doorHi);
  hline(g, dX, dY + dH - 7, dW, P.doorHi);
  vline(g, dX + dW / 2, dY, dH, P.wallDeep);      // the split between leaves
  // Strap hinges.
  hline(g, dX + 1, dY + 5, 7, '#2f2a24');
  hline(g, dX + dW - 8, dY + 5, 7, '#2f2a24');

  // A pitching hole up in the gable for hay.
  const hx = Math.round(W / 2 - 5);
  rect(g, hx, roofH - 16, 10, 9, P.ink);
  stroke(g, hx - 1, roofH - 17, 12, 11, P.outline);

  rect(g, 0, H - foundH, W, foundH, P.stone);
  speckle(g, 0, H - foundH, W, foundH, P.stoneLo, 0.34, 503);
  hline(g, 0, H - foundH, W, P.outline);
  g.fillStyle = P.shadow;
  g.fillRect(2, H, W - 4, 4);
  return s;
}

/**
 * A dry-laid field wall. Cleared stone, stacked without mortar — the single
 * most characteristic object in the New England landscape, and the physical
 * record of every rock a family pulled out of a field by hand.
 */
function buildStoneWall() {
  const s = surface(TS, TS + 3);
  const g = s.g;
  rect(g, 0, 12, TS, 3, 'rgba(20,22,26,0.35)');
  // Two courses of irregular stone.
  const stones = [[0, 5, 6, 5], [6, 4, 5, 6], [11, 5, 5, 5],
                  [0, 9, 5, 5], [5, 10, 6, 4], [11, 9, 5, 5]];
  for (const [x, y, w, h] of stones) {
    ellipse(g, x + w / 2, y + h / 2, w / 2 + 0.5, h / 2 + 0.5, P.outline);
    ellipse(g, x + w / 2, y + h / 2, w / 2, h / 2, P.stone);
    ellipse(g, x + w / 2 - 1, y + h / 2 - 1, w / 3, h / 3, P.stoneHi);
  }
  speckle(g, 0, 4, TS, 11, P.stoneLo, 0.14, 511);
  return s;
}

/** A hay rick — cut hay stacked around a pole and thatched over. */
function buildHayrick() {
  const W = 2 * TS, H = 2 * TS;
  const s = surface(W, H + 3);
  const g = s.g;
  const cx = W / 2;
  ellipse(g, cx, H - 6, 14, 9, P.outline);
  ellipse(g, cx, H - 6, 13, 8, '#8a7647');
  // Conical top.
  for (let i = 0; i < 18; i++) {
    const w = Math.round(13 * (1 - i / 20));
    rect(g, cx - w, H - 12 - i, w * 2, 1, i % 4 === 0 ? '#9c8752' : '#8a7647');
  }
  speckle(g, cx - 13, H - 30, 26, 26, '#6f5f3a', 0.16, 521);
  speckle(g, cx - 13, H - 30, 26, 26, '#a8935c', 0.10, 523);
  vline(g, cx, H - 34, 6, P.bark);                 // the pole
  ellipse(g, cx, H + 1, 13, 3, P.shadow);
  return s;
}

/** A two-wheeled farm cart, tipped down on its shafts. */
function buildCart() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 3);
  const g = s.g;
  rect(g, 3, 4, W - 8, 7, P.barkHi);
  stroke(g, 3, 4, W - 8, 7, P.outline);
  for (let x = 6; x < W - 6; x += 4) vline(g, x, 5, 5, P.bark);
  // Shafts.
  rect(g, W - 6, 8, 6, 2, P.bark);
  // Wheel.
  ellipse(g, 8, 12, 5, 5, P.outline);
  ellipse(g, 8, 12, 4, 4, P.barkHi);
  ellipse(g, 8, 12, 2, 2, P.bark);
  ellipse(g, W / 2, H + 1, 12, 2, P.shadow);
  return s;
}

/** Apple tree, bare. Orchards were everywhere — mostly for cider, which is
 *  what a New England family actually drank. */
function buildAppleTree() {
  const W = 2 * TS, H = 3 * TS;
  const s = surface(W, H + 4);
  const g = s.g;
  const cx = W / 2, base = H;
  for (let i = 0; i < 16; i++) {
    const y = base - 1 - i, hw = Math.max(2, 4 - Math.floor(i / 6));
    rect(g, cx - hw, y, hw * 2, 1, P.bark);
    px(g, cx - hw, y, P.outline);
    px(g, cx + hw - 1, y, P.barkHi);
  }
  const fork = base - 16;
  const limbs = [[cx, fork + 2, cx - 11, fork - 11], [cx, fork + 2, cx + 10, fork - 12],
                 [cx, fork, cx - 4, fork - 17], [cx, fork, cx + 5, fork - 16]];
  for (const [x0, y0, x1, y1] of limbs) {
    line(g, x0, y0, x1, y1, P.bark);
    line(g, x0 + 1, y0, x1 + 1, y1, P.barkLo);
    line(g, x1, y1, x1 + (x1 > x0 ? 4 : -4), y1 - 6, P.bark);
  }
  speckle(g, 3, fork - 20, W - 6, 22, P.barkLo, 0.07, 531);
  ellipse(g, cx, base + 1, 9, 3, P.shadow);
  return s;
}

/**
 * The meetinghouse. Salem Village's was a plain rectangular box — no steeple,
 * no tower, galleries inside. Making it merely BIGGER than the houses rather
 * than prettier is the historically honest choice, and it still reads as the
 * centre of town because everything else is small.
 */
function buildMeetinghouse(wT = 9, hT = 6) {
  // No porch, no steeple, no ornament of any kind. Salem Village's
  // meetinghouse was a plain box roughly 34 by 28 feet, and making it merely
  // larger than the houses rather than prettier is the honest choice. It
  // still reads as the centre of town, because everything else is small.
  return buildHouse(wT, hT, {
    doorCol: Math.floor(wT / 2),
    windows: [1, 3, wT - 4, wT - 2],
    roofFrac: 0.55,
    chimney: null,
  });
}

/* ---------------------------------------------------------------------- *
 * Vegetation
 * ---------------------------------------------------------------------- */

/** Evergreen, 2x3 tiles. Layered boughs, dark outline, light from upper-left. */
function buildPine() {
  const W = 2 * TS, H = 3 * TS;
  const s = surface(W, H + 4);
  const g = s.g;
  const cx = W / 2;

  // Trunk.
  rect(g, cx - 2, H - 14, 4, 14, P.bark);
  vline(g, cx - 2, H - 14, 14, P.barkLo);
  vline(g, cx + 1, H - 14, 14, P.barkHi);

  // Three bough tiers, widest at the bottom.
  const tiers = [
    { y: H - 16, rx: 15, ry: 8 },
    { y: H - 27, rx: 12, ry: 7 },
    { y: H - 37, rx: 8,  ry: 6 },
  ];
  for (const t of tiers) {
    ellipse(g, cx, t.y, t.rx + 1, t.ry + 1, P.outline);
    ellipse(g, cx, t.y, t.rx, t.ry, P.pine);
    ellipse(g, cx - 2, t.y - 2, Math.round(t.rx * 0.6), Math.round(t.ry * 0.55), P.pineHi);
    ellipse(g, cx + 3, t.y + 2, Math.round(t.rx * 0.5), Math.round(t.ry * 0.4), P.pineLo);
  }
  // Needle texture.
  speckle(g, 2, H - 44, W - 4, 36, P.pineLo, 0.10, 123);
  speckle(g, 2, H - 44, W - 4, 36, P.pineHi, 0.06, 131);
  // Crown tip.
  vline(g, cx, H - 44, 4, P.pineHi);

  g.fillStyle = P.shadow;
  ellipse(g, cx, H + 1, 11, 3, P.shadow);
  return s;
}

/**
 * Bare hardwood, 3x4 tiles. It is early March — nothing has leafed out.
 *
 * A leafless tree has to be built with real mass or it reads as a weed: a
 * thick buttressed trunk, a proper fork, and enough twig density at the
 * crown to suggest a canopy that simply isn't there yet.
 */
function buildBareTree() {
  const W = 3 * TS, H = 4 * TS;
  const s = surface(W, H + 4);
  const g = s.g;
  const cx = Math.round(W / 2), base = H;

  // Trunk: wide at the root, tapering to the fork.
  const trunkH = 30;
  for (let i = 0; i < trunkH; i++) {
    const y = base - 1 - i;
    const t = i / trunkH;
    const hw = Math.max(2, Math.round(5 - t * 2.5));
    rect(g, cx - hw, y, hw * 2, 1, P.bark);
    px(g, cx - hw, y, P.outline);
    px(g, cx + hw - 1, y, P.barkHi);
    if (i % 4 === 0) px(g, cx - hw + 1, y, P.barkLo);
  }
  // Root buttress.
  for (let i = 0; i < 4; i++) {
    rect(g, cx - 6 - i, base - 4 + i, 3, 1, P.barkLo);
    rect(g, cx + 3 + i, base - 4 + i, 3, 1, P.bark);
  }

  // Primary limbs off the fork, then secondaries off those.
  const fork = base - trunkH;
  const limbs = [
    [cx, fork + 4, cx - 17, fork - 14, 3],
    [cx, fork + 6, cx + 16, fork - 12, 3],
    [cx, fork + 1, cx - 6, fork - 24, 3],
    [cx, fork, cx + 7, fork - 26, 3],
  ];
  for (const [x0, y0, x1, y1, wgt] of limbs) {
    for (let o = 0; o < wgt; o++) {
      line(g, x0 + o - 1, y0, x1 + (o - 1), y1, o === 0 ? P.outline : (o === 1 ? P.bark : P.barkHi));
    }
    // Secondaries.
    const mx = Math.round((x0 + x1) / 2), my = Math.round((y0 + y1) / 2);
    line(g, mx, my, mx + (x1 > x0 ? 9 : -9), my - 11, P.bark);
    line(g, x1, y1, x1 + (x1 > x0 ? 5 : -5), y1 - 9, P.bark);
    line(g, x1, y1, x1 + (x1 > x0 ? -3 : 3), y1 - 10, P.barkLo);
  }

  // Twig haze at the crown — the suggestion of a canopy in outline.
  speckle(g, 4, fork - 30, W - 8, 30, P.barkLo, 0.09, 211);
  speckle(g, 6, fork - 26, W - 12, 24, P.bark, 0.06, 223);

  ellipse(g, cx, base + 1, 13, 3, P.shadow);
  return s;
}

/* ---------------------------------------------------------------------- *
 * Fences, and the objects that carry the argument
 * ---------------------------------------------------------------------- */

/** One tile of post-and-rail fence. */
function buildFence() {
  const s = surface(TS, TS);
  const g = s.g;
  // Two rails.
  rect(g, 0, 7, TS, 3, P.barkHi);
  hline(g, 0, 7, TS, P.outline);
  hline(g, 0, 9, TS, P.bark);
  rect(g, 0, 12, TS, 3, P.barkHi);
  hline(g, 0, 12, TS, P.outline);
  hline(g, 0, 14, TS, P.bark);
  // Post.
  rect(g, 2, 3, 4, 13, P.bark);
  vline(g, 2, 3, 13, P.outline);
  vline(g, 5, 3, 13, P.barkHi);
  hline(g, 2, 3, 4, P.outline);
  return s;
}

/**
 * The parsonage woodpile.
 *
 * Parris's 1689 contract promised him firewood. The village stopped
 * delivering it. This prop is a clue: it should look CONSPICUOUSLY small
 * against the size of the house it is meant to heat.
 */
function buildWoodpile() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 3);
  const g = s.g;

  rect(g, 1, 6, W - 2, 10, P.barkLo);
  stroke(g, 1, 6, W - 2, 10, P.outline);
  // Stacked log ends — deliberately only two courses.
  for (let row = 0; row < 2; row++) {
    for (let i = 0; i < 6; i++) {
      const cxp = 4 + i * 4 + (row ? 2 : 0);
      const cyp = 13 - row * 4;
      if (cxp > W - 4) continue;
      ellipse(g, cxp, cyp, 2, 2, P.bark);
      px(g, cxp, cyp, P.barkHi);
      px(g, cxp - 1, cyp - 1, P.barkHi);
    }
  }
  ellipse(g, W / 2, H + 1, 12, 2, P.shadow);
  return s;
}

/**
 * A boundary marker in the woods, between the Nurse and Putnam land. Small,
 * easy to miss, and the entire faction thesis hangs off it. It is supposed
 * to be underwhelming — that's the lesson.
 */
function buildMarker() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  rect(g, 5, 3, 6, 12, P.stone);
  speckle(g, 5, 3, 6, 12, P.stoneLo, 0.3, 151);
  speckle(g, 5, 3, 6, 12, P.stoneHi, 0.15, 157);
  stroke(g, 5, 3, 6, 12, P.outline);
  // A weathered notch cut into the face.
  px(g, 7, 7, P.stoneLo); px(g, 8, 7, P.stoneLo); px(g, 8, 8, P.stoneLo);
  ellipse(g, 8, 15, 6, 2, P.shadow);
  return s;
}

/** A field-stone well. */
function buildWell() {
  const W = 2 * TS, H = 2 * TS;
  const s = surface(W, H + 3);
  const g = s.g;
  ellipse(g, W / 2, H - 8, 13, 8, P.outline);
  ellipse(g, W / 2, H - 8, 12, 7, P.stone);
  speckle(g, W / 2 - 12, H - 15, 24, 14, P.stoneLo, 0.3, 171);
  ellipse(g, W / 2, H - 10, 8, 4, P.ink);
  // Posts and crossbeam.
  rect(g, 7, 6, 3, 18, P.bark); rect(g, W - 10, 6, 3, 18, P.bark);
  rect(g, 5, 3, W - 10, 4, P.barkHi);
  stroke(g, 5, 3, W - 10, 4, P.outline);
  ellipse(g, W / 2, H + 1, 13, 3, P.shadow);
  return s;
}

/**
 * The meetinghouse seating chart, nailed to the wall. Pews assigned by wealth
 * and standing — a literal map of who matters, seen by every person in the
 * village every Sunday. Drawn as an interior wall prop.
 */
function buildSeatingChart() {
  const W = 2 * TS, H = 2 * TS;
  const s = surface(W, H);
  const g = s.g;
  rect(g, 2, 3, W - 4, H - 10, '#cbbfa6');
  stroke(g, 2, 3, W - 4, H - 10, P.doorLo);
  stroke(g, 1, 2, W - 2, H - 8, P.outline);
  // Ruled rows of names, with the top rows heavier — the good seats.
  for (let i = 0; i < 7; i++) {
    const y = 6 + i * 3;
    const w = i < 2 ? W - 10 : W - 10 - (i % 3) * 3;
    hline(g, 5, y, w, i < 2 ? P.ink : P.boxDim);
  }
  vline(g, W / 2, 5, H - 14, P.doorLo);
  return s;
}

/** Interior hearth — the only real light source in a 1692 house. */
function buildHearth() {
  const W = 3 * TS, H = 2 * TS;
  const s = surface(W, H);
  const g = s.g;
  rect(g, 0, 0, W, H - 2, P.stoneLo);
  speckle(g, 0, 0, W, H - 2, P.stone, 0.35, 181);
  speckle(g, 0, 0, W, H - 2, P.stoneHi, 0.12, 187);
  stroke(g, 0, 0, W, H - 2, P.outline);
  // Firebox.
  const fx = 10, fw = W - 20, fy = 10, fh = H - 16;
  rect(g, fx, fy, fw, fh, P.ink);
  stroke(g, fx - 1, fy - 1, fw + 2, fh + 2, P.outline);
  // Low fire — they are short of firewood, and that is the point.
  rect(g, fx + 4, fy + fh - 5, fw - 8, 3, '#6b3a22');
  rect(g, fx + 7, fy + fh - 7, fw - 14, 3, '#9c5a2c');
  rect(g, fx + 10, fy + fh - 9, fw - 20, 2, '#c98a3e');
  px(g, fx + Math.floor(fw / 2), fy + fh - 11, '#e0b45e');
  return s;
}

/** A plain trestle table. */
function buildTable() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 3);
  const g = s.g;
  rect(g, 0, 3, W, 6, P.barkHi);
  hline(g, 0, 3, W, P.outline);
  hline(g, 0, 8, W, P.bark);
  stroke(g, 0, 3, W, 6, P.outline);
  rect(g, 4, 9, 3, 7, P.bark);
  rect(g, W - 7, 9, 3, 7, P.bark);
  ellipse(g, W / 2, H + 1, 13, 2, P.shadow);
  return s;
}

/** A meetinghouse pew — one tile wide, benches face south. */
function buildPew() {
  const s = surface(TS, TS);
  const g = s.g;
  rect(g, 0, 5, TS, 4, P.barkHi);
  stroke(g, 0, 5, TS, 4, P.outline);
  rect(g, 0, 9, TS, 3, P.bark);
  rect(g, 1, 12, 2, 4, P.barkLo);
  rect(g, TS - 3, 12, 2, 4, P.barkLo);
  return s;
}

/* ---------------------------------------------------------------------- *
 * Present day — the Salem Witch Trials Memorial, Charter Street
 * ---------------------------------------------------------------------- */

/**
 * One memorial bench: a granite slab cantilevered out of the low wall, with
 * a name, a means of execution and a date cut into its edge. There are
 * twenty of them and they are identical, which is the point — the design
 * refuses to rank the dead or make any one of them the interesting one.
 */
function buildMemBench() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 5);
  const g = s.g;
  // A hard cast shadow first — this is granite sitting on granite, and the
  // shadow is doing most of the work of separating the two.
  rect(g, 2, 12, W - 3, 4, 'rgba(18,20,24,0.5)');
  // Slab, lit from upper-left.
  rect(g, 1, 3, W - 2, 10, P.granite);
  rect(g, 2, 3, W - 4, 4, P.graniteHi);
  rect(g, 1, 11, W - 2, 2, P.graniteDeep);
  stroke(g, 1, 3, W - 2, 10, P.outline);
  speckle(g, 2, 5, W - 4, 6, P.graniteLo, 0.16, 401);
  // The inscribed edge — reads as lettering without being readable.
  for (let x = 5; x < W - 5; x += 3) px(g, x, 9, P.graniteDeep);
  ellipse(g, W / 2, H + 2, 13, 2, P.shadow);
  return s;
}

/** A course of the low granite enclosure wall. */
function buildLowWall() {
  const s = surface(TS, TS + 4);
  const g = s.g;
  // Cast shadow, so the enclosure reads as a wall you are standing inside
  // rather than a change of paving.
  rect(g, 0, 14, TS, 4, 'rgba(18,20,24,0.42)');
  rect(g, 0, 1, TS, 14, P.granite);
  rect(g, 0, 1, TS, 4, P.graniteHi);       // top face catching the light
  hline(g, 0, 5, TS, P.graniteLo);
  rect(g, 0, 12, TS, 3, P.graniteDeep);    // shaded base course
  speckle(g, 0, 6, TS, 6, P.graniteLo, 0.20, 409);
  speckle(g, 0, 6, TS, 6, P.graniteHi, 0.08, 419);
  hline(g, 0, 1, TS, P.outline);
  hline(g, 0, 15, TS, P.outline);
  vline(g, 0, 1, 15, P.graniteDeep);       // block joint
  return s;
}

/** Black locust, in leaf. The memorial is planted with them. */
function buildLocust() {
  const W = 3 * TS, H = 4 * TS;
  const s = surface(W, H + 4);
  const g = s.g;
  const cx = Math.round(W / 2), base = H;

  // Trunk.
  for (let i = 0; i < 26; i++) {
    const y = base - 1 - i;
    const hw = Math.max(2, Math.round(4 - (i / 26) * 2));
    rect(g, cx - hw, y, hw * 2, 1, P.bark);
    px(g, cx - hw, y, P.outline);
    px(g, cx + hw - 1, y, P.barkHi);
  }
  // Canopy: three overlapping masses so it doesn't read as one blob.
  const lobes = [
    [cx, base - 40, 20, 13], [cx - 13, base - 32, 13, 9], [cx + 13, base - 33, 13, 9],
    [cx - 5, base - 48, 12, 8], [cx + 7, base - 47, 11, 8],
  ];
  for (const [x, y, rx, ry] of lobes) {
    ellipse(g, x, y, rx + 1, ry + 1, P.outline);
    ellipse(g, x, y, rx, ry, P.leaf);
  }
  for (const [x, y, rx, ry] of lobes) {
    ellipse(g, x - 3, y - 3, Math.round(rx * 0.55), Math.round(ry * 0.5), P.leafHi);
    ellipse(g, x + 4, y + 4, Math.round(rx * 0.4), Math.round(ry * 0.35), P.leafLo);
  }
  speckle(g, 4, base - 58, W - 8, 34, P.leafLo, 0.10, 431);
  speckle(g, 4, base - 58, W - 8, 34, P.leafHi, 0.07, 439);

  ellipse(g, cx, base + 1, 14, 3, P.shadow);
  return s;
}

/** An interpretive sign on two posts — the kind every historic site has. */
function buildSignboard() {
  const W = 2 * TS, H = 2 * TS;
  const s = surface(W, H + 3);
  const g = s.g;
  rect(g, 6, 16, 3, 14, '#4a4d52');
  rect(g, W - 9, 16, 3, 14, '#4a4d52');
  rect(g, 1, 3, W - 2, 15, '#2f4a52');
  stroke(g, 1, 3, W - 2, 15, P.outline);
  rect(g, 3, 5, W - 6, 11, '#3d616b');
  // Text ruling and a small image block, angled reader-style.
  for (let i = 0; i < 4; i++) hline(g, 5, 7 + i * 2, W - 16, '#9fc0c7');
  rect(g, W - 12, 7, 8, 7, '#8aa9b0');
  ellipse(g, W / 2, H + 1, 11, 2, P.shadow);
  return s;
}

/** A public bin. Small, mundane, and doing a lot of work to say "present". */
function buildBin() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  rect(g, 3, 4, 10, 12, '#3c4348');
  stroke(g, 3, 4, 10, 12, P.outline);
  rect(g, 2, 2, 12, 3, '#4d565c');
  stroke(g, 2, 2, 12, 3, P.outline);
  vline(g, 5, 6, 9, '#4d565c');
  vline(g, 10, 6, 9, '#4d565c');
  ellipse(g, 8, 16, 7, 2, P.shadow);
  return s;
}

/**
 * A storefront across the street. Salem sells this history — witch hats,
 * fridge magnets, ghost tours — about two hundred feet from the memorial.
 * The game never editorialises about it. It just puts it in frame.
 */
function buildShopfront(wT = 6, hT = 5) {
  const W = wT * TS, H = hT * TS;
  const s = surface(W, H + 6);
  const g = s.g;
  const foundH = 4;
  const upperH = Math.round(H * 0.44);

  // Upper storey: painted clapboard, sash windows.
  rect(g, 0, 0, W, upperH, '#6d5f5a');
  for (let y = 3; y < upperH; y += 4) { hline(g, 0, y, W, '#5b4f4b'); hline(g, 0, y + 1, W, '#7d6e68'); }
  for (let i = 1; i < wT - 1; i += 2) {
    const wx = i * TS + 3;
    rect(g, wx - 1, 7, 12, 15, '#3a3230');
    rect(g, wx, 8, 10, 13, '#2b3037');
    hline(g, wx, 14, 10, '#8f9aa2');
    vline(g, wx + 5, 8, 13, '#8f9aa2');
    hline(g, wx + 1, 9, 3, P.glassLit);
  }
  hline(g, 0, upperH - 1, W, P.outline);

  // Awning — a hard, saturated stripe that reads modern instantly.
  const ay = upperH;
  for (let x = 0; x < W; x++) {
    rect(g, x, ay, 1, 7, (Math.floor(x / 8) % 2) ? '#8a3b34' : '#d8cfc0');
  }
  hline(g, 0, ay, W, P.outline);
  hline(g, 0, ay + 7, W, P.outline);
  rect(g, 0, ay + 8, W, 2, 'rgba(20,20,24,0.4)');

  // Shopfront glazing: one big plate window and a door.
  const gy = ay + 10, gh = H - foundH - gy;
  rect(g, 0, gy, W, gh, '#3b3330');
  rect(g, 3, gy + 2, W - 22, gh - 4, '#2a3138');
  stroke(g, 3, gy + 2, W - 22, gh - 4, '#8d827a');
  // Reflected sky across the glass, and merchandise silhouettes behind it.
  for (let i = 0; i < 3; i++) rect(g, 6 + i * 5, gy + 4, 2, gh - 8, 'rgba(150,175,195,0.16)');
  for (let i = 0; i < 4; i++) rect(g, 8 + i * 9, gy + gh - 10, 5, 6, 'rgba(220,200,150,0.35)');
  // Door.
  rect(g, W - 17, gy + 2, 13, gh - 4, '#4a4038');
  rect(g, W - 15, gy + 4, 9, gh - 12, '#2a3138');
  stroke(g, W - 17, gy + 2, 13, gh - 4, P.outline);

  // Foundation.
  rect(g, 0, H - foundH, W, foundH, P.graniteLo);
  hline(g, 0, H - foundH, W, P.outline);
  g.fillStyle = P.shadow;
  g.fillRect(2, H, W - 4, 4);
  return s;
}

/* ---------------------------------------------------------------------- *
 * Livestock
 *
 * Not decoration. Free-ranging swine trespassing into a neighbour's field
 * was one of the most common causes of ill-feeling in a New England village,
 * and Rebecca Nurse mentions exactly that quarrel with the Putnams. Putting
 * the pigs on screen makes her line land.
 * ---------------------------------------------------------------------- */

function quadruped(g, x, y, w, h, body, dark, light) {
  ellipse(g, x + w / 2, y + h / 2, w / 2 + 1, h / 2 + 1, P.outline);
  ellipse(g, x + w / 2, y + h / 2, w / 2, h / 2, body);
  ellipse(g, x + w / 2 - 2, y + h / 2 - 2, w / 3, h / 3, light);
  ellipse(g, x + w / 2 + 2, y + h / 2 + 1, w / 4, h / 4, dark);
  // Legs.
  rect(g, x + 2, y + h - 1, 2, 3, dark);
  rect(g, x + w - 4, y + h - 1, 2, 3, dark);
}
function buildPig() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  quadruped(g, 1, 5, 12, 7, '#9a7d72', '#7a6058', '#b39a8e');
  // Snout and ear.
  rect(g, 0, 8, 3, 3, '#b39a8e');
  px(g, 0, 9, P.outline); px(g, 1, 9, '#7a6058');
  px(g, 4, 5, '#7a6058');
  px(g, 9, 7, P.ink);            // eye
  // Curl of tail.
  px(g, 13, 7, '#7a6058'); px(g, 14, 6, '#7a6058');
  ellipse(g, 7, TS, 6, 2, P.shadow);
  return s;
}
function buildCow() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 3);
  const g = s.g;
  quadruped(g, 3, 3, 22, 9, '#7b6247', '#5d4936', '#94795b');
  // Belted patch — most New England cattle were red devons and mongrels,
  // so this is a plausible mixed beast rather than a Holstein.
  ellipse(g, 14, 7, 5, 4, '#c9bda6');
  // Head, low, grazing.
  ellipse(g, 2, 10, 4, 3, P.outline);
  ellipse(g, 2, 10, 3, 2, '#5d4936');
  px(g, 1, 9, P.ink);
  // Horns.
  px(g, 2, 7, '#cfc6b0'); px(g, 4, 7, '#cfc6b0');
  // Tail.
  vline(g, 25, 5, 7, '#5d4936');
  ellipse(g, W / 2, H + 1, 12, 2, P.shadow);
  return s;
}
function buildSheep() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  // Fleece: a lumpy cloud rather than a smooth body.
  for (const [x, y, r] of [[5, 7, 4], [8, 6, 4], [11, 8, 3], [7, 9, 4]]) {
    ellipse(g, x, y, r + 1, r + 1, P.outline);
    ellipse(g, x, y, r, r, '#cfc9bb');
  }
  for (const [x, y, r] of [[5, 6, 2], [9, 5, 2]]) ellipse(g, x, y, r, r, '#e6e1d4');
  ellipse(g, 2, 9, 3, 2, P.outline);
  ellipse(g, 2, 9, 2, 2, '#4a4540');       // dark face
  px(g, 1, 9, P.ink);
  rect(g, 5, 12, 2, 3, '#4a4540');
  rect(g, 10, 12, 2, 3, '#4a4540');
  ellipse(g, 8, TS, 6, 2, P.shadow);
  return s;
}
function buildChicken() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  ellipse(g, 8, 10, 5, 4, P.outline);
  ellipse(g, 8, 10, 4, 3, '#b8a48c');
  ellipse(g, 7, 9, 2, 2, '#d3c3ad');
  ellipse(g, 5, 6, 3, 3, P.outline);
  ellipse(g, 5, 6, 2, 2, '#b8a48c');
  px(g, 4, 6, P.ink);
  px(g, 3, 7, '#c98a3e');                  // beak
  px(g, 5, 3, '#8f3d2b'); px(g, 6, 4, '#8f3d2b');   // comb
  rect(g, 7, 13, 1, 2, '#c98a3e');
  rect(g, 9, 13, 1, 2, '#c98a3e');
  ellipse(g, 8, TS, 4, 1, P.shadow);
  return s;
}

/** Iron bars. The Salem jail was a cellar with a grate. */
function buildBars() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  rect(g, 0, 0, TS, 3, '#3a3d42');
  hline(g, 0, 0, TS, P.outline);
  for (let x = 1; x < TS; x += 4) {
    rect(g, x, 2, 2, TS - 2, '#4c5057');
    vline(g, x, 2, TS - 2, P.outline);
    px(g, x + 1, 5, '#6d727a');
  }
  rect(g, 0, TS - 4, TS, 3, '#3a3d42');
  hline(g, 0, TS - 2, TS, P.outline);
  return s;
}

/**
 * A loose sheet of paper — where a document can be copied from.
 *
 * Drawn to sit UP off the surface it is on, with a hard drop shadow and a
 * lifted corner, because the first version was a flat pale rectangle that
 * disappeared into the table it was lying on and players could not find the
 * documents at all.
 */
function buildPaper() {
  const s = surface(TS, TS + 4);
  const g = s.g;
  // Shadow first: this is what separates the sheet from the table top.
  rect(g, 2, 12, 13, 3, 'rgba(18,16,14,0.45)');
  // Two sheets, slightly offset, so it reads as a small pile.
  rect(g, 1, 3, 13, 10, '#b9ad92');
  rect(g, 2, 2, 13, 10, '#efe6cf');
  stroke(g, 2, 2, 13, 10, '#6b6250');
  // Ruled writing.
  for (let i = 0; i < 4; i++) hline(g, 4, 4 + i * 2, 9 - (i % 2) * 3, '#8d8571');
  // A wax seal / signature blot, and a turned-up corner.
  px(g, 12, 9, '#8f3d2b'); px(g, 13, 9, '#8f3d2b'); px(g, 12, 10, '#8f3d2b');
  rect(g, 12, 2, 3, 3, '#d6cbb0');
  line(g, 12, 5, 15, 2, '#6b6250');
  return s;
}

/** An archive box on a shelf. Present day. */
function buildArchiveBox() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  rect(g, 1, 4, 14, 11, '#8a8272');
  stroke(g, 1, 4, 14, 11, P.outline);
  rect(g, 1, 4, 14, 3, '#9e9686');
  rect(g, 4, 9, 8, 4, '#d8d2c2');
  stroke(g, 4, 9, 8, 4, '#6f6857');
  return s;
}

/**
 * A bookshelf, two tiles wide and three tall.
 *
 * The reading room was twelve one-tile boxes along a wall, which reads as
 * storage rather than as a library. Height is what makes a room feel like
 * one — a shelf you cannot see over, with spines on it.
 */
function buildBookshelf(wT = 2, hT = 3) {
  const W = wT * TS, H = hT * TS;
  const s = surface(W, H + 3);
  const g = s.g;

  // Carcass.
  rect(g, 0, 2, W, H - 2, '#4a3f33');
  stroke(g, 0, 2, W, H - 2, P.outline);
  rect(g, 1, 3, W - 2, H - 4, '#5c4e3f');

  // Shelves, and the books on them. Spines are varied by hash so no two
  // shelves repeat, and stable so the room does not shimmer.
  const SPINE = ['#7a3f33', '#4d5b6b', '#6b6042', '#3f5545', '#6d4a5c', '#8a7350', '#40474f'];
  const shelves = hT * 2 - 1;
  for (let r = 0; r < shelves; r++) {
    const y = 4 + r * Math.floor((H - 8) / shelves);
    const hgt = Math.floor((H - 8) / shelves) - 2;
    if (hgt < 5) continue;
    rect(g, 2, y + hgt, W - 4, 2, '#3a3128');       // the shelf board
    let x = 3;
    while (x < W - 4) {
      const t = hash(x, r, 811);
      if (t < 0.10) { x += 2; continue; }            // a gap where one is out
      const bw = 2 + Math.floor(hash(x, r, 823) * 2);
      const bh = hgt - Math.floor(hash(x, r, 829) * 3);
      const col = SPINE[Math.floor(hash(x, r, 839) * SPINE.length)];
      rect(g, x, y + hgt - bh, bw, bh, col);
      // A lighter band along the spine, which is what makes it read as a book.
      hline(g, x, y + hgt - bh + 1, bw, 'rgba(255,255,255,0.13)');
      px(g, x, y + hgt - 1, 'rgba(0,0,0,0.35)');
      x += bw + 1;
    }
  }
  rect(g, 0, H - 3, W, 3, '#3a3128');
  hline(g, 0, H - 3, W, P.outline);
  g.fillStyle = P.shadow;
  g.fillRect(2, H, W - 4, 3);
  return s;
}

/** A green-shaded reading lamp. The visual shorthand for an archive. */
function buildReadingLamp() {
  const s = surface(TS, TS + 2);
  const g = s.g;
  rect(g, 6, 12, 5, 2, '#2f3238');            // base
  rect(g, 7, 6, 2, 7, '#5a5f66');             // stem
  rect(g, 3, 3, 11, 4, '#2f6b48');            // shade
  hline(g, 3, 3, 11, '#3f8a5e');
  hline(g, 3, 6, 11, '#1e4a31');
  stroke(g, 3, 3, 11, 4, P.outline);
  rect(g, 5, 7, 7, 1, 'rgba(255,236,170,0.55)');   // the light it throws
  rect(g, 6, 8, 5, 1, 'rgba(255,236,170,0.25)');
  return s;
}

/**
 * A writing desk with a sloped top and paper on it.
 *
 * Built for one room in particular: Thomas Putnam wrote his daughter's
 * depositions, which is one of the six things the player can find sources
 * disagreeing about. Standing at the desk where that happened is worth more
 * than another line of dialogue saying so.
 */
function buildDesk() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 4);
  const g = s.g;
  rect(g, 0, 1, W, 8, P.barkHi);              // sloped top
  hline(g, 0, 1, W, P.outline);
  for (let i = 2; i < 8; i++) hline(g, 0, i, W, i % 2 ? P.bark : P.barkHi);
  stroke(g, 0, 1, W, 8, P.outline);
  rect(g, 4, 3, 12, 5, '#e6dfc9');            // a sheet, mid-sentence
  stroke(g, 4, 3, 12, 5, '#7a7460');
  for (let i = 0; i < 3; i++) hline(g, 6, 4 + i * 2, 8 - i * 2, '#8d8571');
  px(g, 22, 4, '#2b2b30'); px(g, 23, 3, '#2b2b30');   // the inkwell
  rect(g, 21, 5, 4, 3, '#3a3a40');
  stroke(g, 21, 5, 4, 3, P.outline);
  rect(g, 3, 9, 3, 7, P.bark);
  rect(g, W - 6, 9, 3, 7, P.bark);
  ellipse(g, W / 2, H + 2, 13, 2, P.shadow);
  return s;
}

/** A bed. Two tiles, low, with the covers turned back. */
function buildBed() {
  const W = 2 * TS, H = 2 * TS;
  const s = surface(W, H + 3);
  const g = s.g;
  rect(g, 1, 4, W - 2, H - 6, '#4a3c30');
  stroke(g, 1, 4, W - 2, H - 6, P.outline);
  rect(g, 2, 6, W - 4, H - 11, '#b0a894');    // the tick
  speckle(g, 2, 6, W - 4, H - 11, '#9a927e', 0.10, 907);
  rect(g, 2, H - 12, W - 4, 6, '#7a4750');    // a murrey coverlet, turned back
  hline(g, 2, H - 12, W - 4, '#8f5760');
  rect(g, 4, 6, 9, 4, '#cfc8b6');             // the bolster
  stroke(g, 4, 6, 9, 4, '#98917f');
  rect(g, 1, H - 6, 3, 5, '#3a2f26');         // posts
  rect(g, W - 4, H - 6, 3, 5, '#3a2f26');
  g.fillStyle = P.shadow;
  g.fillRect(3, H, W - 6, 3);
  return s;
}

/** A spinning wheel. One of the few objects in a house that was a woman's
 *  own property and her own trade. */
function buildWheel() {
  const s = surface(TS, TS + 4);
  const g = s.g;
  ellipse(g, 6, 7, 6, 6, P.barkHi);
  ellipse(g, 6, 7, 4.5, 4.5, '#6b5d4a');
  ellipse(g, 6, 7, 1.5, 1.5, P.bark);
  for (let a = 0; a < 6; a++) {
    const t = (a / 6) * Math.PI * 2;
    line(g, 6, 7, 6 + Math.round(Math.cos(t) * 5), 7 + Math.round(Math.sin(t) * 5), P.bark);
  }
  rect(g, 11, 4, 2, 12, P.bark);              // the post
  rect(g, 3, 14, 10, 2, P.barkHi);            // the treadle bar
  hline(g, 3, 14, 10, P.outline);
  g.fillStyle = P.shadow;
  g.fillRect(3, TS + 1, 10, 2);
  return s;
}

/** A dresser with pewter on it — the thing the sheriff came for. */
function buildDresser() {
  const W = 2 * TS, H = TS;
  const s = surface(W, H + 3);
  const g = s.g;
  rect(g, 0, 5, W, 11, P.bark);
  stroke(g, 0, 5, W, 11, P.outline);
  rect(g, 1, 6, W - 2, 4, P.barkHi);
  hline(g, 0, 10, W, P.outline);
  // Pewter: three plates on edge and a tankard, which is exactly what the
  // seizure inventory lists.
  for (let i = 0; i < 3; i++) {
    const x = 4 + i * 7;
    ellipse(g, x + 2, 3, 3, 3, '#9aa0a6');
    ellipse(g, x + 2, 3, 2, 2, '#b6bcc2');
    px(g, x + 1, 2, '#d6dade');
  }
  rect(g, 25, 1, 4, 5, '#9aa0a6');
  stroke(g, 25, 1, 4, 5, '#6e747a');
  ellipse(g, W / 2, H + 1, 13, 2, P.shadow);
  return s;
}

/** Straw on a stone floor. */
function buildStraw() {
  const s = surface(TS, TS);
  const g = s.g;
  for (let i = 0; i < 14; i++) {
    const x = 1 + Math.floor(hash(i, 3, 601) * 13);
    const y = 3 + Math.floor(hash(i, 7, 607) * 11);
    const len = 2 + Math.floor(hash(i, 11, 613) * 3);
    rect(g, x, y, len, 1, i % 3 ? '#8a7647' : '#6f5f3a');
  }
  return s;
}

/** Ingersoll's account book, open on the tavern table. Debt as a map of
 *  resentment — who owes whom, in one object. */
function buildAccountBook() {
  const s = surface(TS, TS);
  const g = s.g;
  rect(g, 1, 5, 14, 9, '#d8cfb6');
  stroke(g, 1, 5, 14, 9, P.outline);
  vline(g, 8, 5, 9, P.boxDim);
  for (let i = 0; i < 4; i++) {
    hline(g, 3, 7 + i * 2, 4, P.boxDim);
    hline(g, 10, 7 + i * 2, 4, P.boxDim);
  }
  return s;
}

/* ===== src/engine/art-actors.js ===== */
// Character sprites and dialogue portraits.
//
// Proportions are deliberately less chibi than the GBA games this borrows
// from: 16x28 with roughly a 1:3.5 head-to-body ratio rather than Pokémon's
// ~1:2.5. Enough naturalism to carry adults, children and the elderly as
// visibly different bodies — Rebecca Nurse is 71 and Dorothy Good is 4, and
// the art has to be able to say so — without losing readability at 16px.
//
// Every actor is generated from one spec object, so the walking sprite and
// the close-up portrait always agree about who someone is.


// 16x24 on a 16px tile. Taller than the tile so characters have presence,
// but not so tall that a player standing directly south of someone buries
// their skirt under the player's own head — the single most common framing
// in the game is exactly that, and at 28px it was unreadable.
const SPR_W = 16, SPR_H = 24;
const DIR = { DOWN: 0, LEFT: 1, RIGHT: 2, UP: 3 };

/* ---------------------------------------------------------------------- *
 * Walking sprite
 * ---------------------------------------------------------------------- */

function drawBody(g, sp, dir, step) {
  const { flesh, hair, coat, under, coif, hat, apron, collar, band } = sp;
  const child = sp.child ? 1 : 0;
  const stoop = sp.stoop ? 1 : 0;         // the elderly stand shorter

  const top = 2 + child * 4 + stoop;      // where the head starts
  const headH = child ? 6 : 7;
  const headW = child ? 7 : 8;
  const hx = Math.floor((SPR_W - headW) / 2);
  const shoulder = top + headH;
  const hipY = SPR_H - (child ? 6 : 8);

  // ---- legs / skirt ----------------------------------------------------
  if (sp.skirt) {
    // A gown to the ankle. Hem sways with the step, which is most of what
    // sells walking when you cannot animate legs.
    const sway = step === 1 ? -1 : step === 2 ? 1 : 0;
    for (let y = hipY - 4; y < SPR_H - 1; y++) {
      const t = (y - (hipY - 4)) / (SPR_H - 1 - (hipY - 4));
      const w = Math.round(6 + t * 6);
      const x = Math.floor((SPR_W - w) / 2) + Math.round(sway * t);
      rect(g, x, y, w, 1, sp.skirt[1]);
      px(g, x, y, sp.skirt[2]);
      px(g, x + w - 1, y, sp.skirt[2]);
    }
    // Fold shading.
    vline(g, SPR_W / 2 - 2, hipY - 2, SPR_H - hipY, sp.skirt[2]);
    vline(g, SPR_W / 2 + 1, hipY - 1, SPR_H - hipY - 1, sp.skirt[0]);
    // Shoes just visible under the hem.
    px(g, 6, SPR_H - 1, P.ink); px(g, 9, SPR_H - 1, P.ink);
  } else {
    // Breeches and stockings.
    const l = step === 1 ? 1 : 0, r = step === 2 ? 1 : 0;
    rect(g, 5, hipY, 3, 6 - l, under ? under[1] : coat[2]);
    rect(g, 8, hipY, 3, 6 - r, under ? under[1] : coat[2]);
    rect(g, 5, SPR_H - 2 - l, 3, 2, P.ink);
    rect(g, 8, SPR_H - 2 - r, 3, 2, P.ink);
  }

  // ---- torso -----------------------------------------------------------
  const torsoH = hipY - shoulder + 2;
  const tw = child ? 8 : 10;
  const tx = Math.floor((SPR_W - tw) / 2);
  rect(g, tx, shoulder, tw, torsoH, coat[1]);
  vline(g, tx, shoulder, torsoH, coat[2]);
  vline(g, tx + tw - 1, shoulder, torsoH, coat[2]);
  // Light from upper-left.
  rect(g, tx + 1, shoulder, 3, torsoH - 1, coat[0]);

  if (apron) {
    const aw = tw - 2;
    rect(g, tx + 1, shoulder + 3, aw, torsoH - 3, apron);
    vline(g, tx + 1, shoulder + 3, torsoH - 3, P.wallLo);
  }

  // Arms.
  const swing = step === 1 ? 1 : step === 2 ? -1 : 0;
  rect(g, tx - 2, shoulder + 1 + swing, 2, torsoH - 3, coat[2]);
  rect(g, tx + tw, shoulder + 1 - swing, 2, torsoH - 3, coat[2]);
  // Hands.
  px(g, tx - 2, shoulder + torsoH - 2 + swing, flesh[1]);
  px(g, tx + tw + 1, shoulder + torsoH - 2 - swing, flesh[1]);

  // Linen collar / falling band — the one bright note in most of these
  // outfits, and a class marker when it is large and starched.
  if (collar) {
    rect(g, tx + 1, shoulder, tw - 2, band ? 3 : 2, collar);
    hline(g, tx + 1, shoulder + (band ? 3 : 2), tw - 2, P.wallLo);
  }

  // ---- head ------------------------------------------------------------
  rect(g, hx, top, headW, headH, flesh[1]);
  rect(g, hx + 1, top, headW - 2, 1, flesh[0]);
  vline(g, hx, top + 1, headH - 1, flesh[2]);
  vline(g, hx + headW - 1, top + 1, headH - 1, flesh[2]);
  // Neck.
  rect(g, hx + 3, top + headH, 2, 1, flesh[2]);

  // Face, by facing.
  const ey = top + 3;
  if (dir === DIR.DOWN) {
    px(g, hx + 2, ey, P.ink); px(g, hx + headW - 3, ey, P.ink);
    if (!sp.child) px(g, hx + Math.floor(headW / 2), ey + 2, flesh[2]);
  } else if (dir === DIR.LEFT) {
    px(g, hx + 2, ey, P.ink);
    px(g, hx + 1, ey + 2, flesh[2]);
  } else if (dir === DIR.RIGHT) {
    px(g, hx + headW - 3, ey, P.ink);
    px(g, hx + headW - 2, ey + 2, flesh[2]);
  }

  // ---- hair, coif, hat -------------------------------------------------
  if (dir === DIR.UP) {
    // Back of the head: all hair, no face.
    rect(g, hx, top, headW, headH - 1, hair[1]);
    rect(g, hx + 1, top, headW - 2, 1, hair[0]);
  } else {
    rect(g, hx, top, headW, 2, hair[1]);
    rect(g, hx + 1, top, headW - 2, 1, hair[0]);
    if (dir === DIR.DOWN) {
      px(g, hx, top + 2, hair[2]); px(g, hx + headW - 1, top + 2, hair[2]);
    } else if (dir === DIR.LEFT) {
      rect(g, hx + headW - 2, top, 2, 4, hair[1]);
    } else {
      rect(g, hx, top, 2, 4, hair[1]);
    }
  }

  if (coif) {
    // Linen coif — near-universal for women and girls, indoors and out.
    rect(g, hx - 1, top - 1, headW + 2, 4, coif);
    hline(g, hx - 1, top - 1, headW + 2, P.wallLo);
    if (dir !== DIR.UP) {
      px(g, hx - 1, top + 3, coif); px(g, hx + headW, top + 3, coif);
    } else {
      rect(g, hx - 1, top - 1, headW + 2, headH, coif);
      hline(g, hx - 1, top + headH - 1, headW + 2, P.wallLo);
    }
  }

  if (hat) {
    // Broad-brimmed felt. Not the buckled cone of later cartoons — that is a
    // 19th-century invention, and getting it right is a free history lesson.
    rect(g, hx - 3, top - 1, headW + 6, 2, hat);
    hline(g, hx - 3, top + 1, headW + 6, P.ink);
    rect(g, hx, top - 4, headW, 4, hat);
    rect(g, hx + 1, top - 4, headW - 2, 1, P.wallDeep);
  }
}

/** Build all frames for one actor: [dir][frame] -> surface. */
function buildActor(spec) {
  const sp = normalize(spec);
  const frames = [];
  for (let d = 0; d < 4; d++) {
    const row = [];
    for (let f = 0; f < 3; f++) {
      const s = surface(SPR_W, SPR_H + 3);
      ellipse(s.g, SPR_W / 2, SPR_H, 6, 2, P.shadow);
      drawBody(s.g, sp, d, f);
      row.push(s);
    }
    frames.push(row);
  }
  return frames;
}

function normalize(spec) {
  return {
    flesh: spec.flesh || FLESH.fair,
    hair: spec.hair || HAIR.dark,
    coat: spec.coat || CLOTH.russet,
    under: spec.under || null,
    skirt: spec.skirt || null,
    apron: spec.apron || null,
    coif: spec.coif || null,
    hat: spec.hat || null,
    collar: spec.collar || null,
    band: spec.band || false,
    child: !!spec.child,
    stoop: !!spec.stoop,
  };
}

/* ---------------------------------------------------------------------- *
 * Portrait
 *
 * The design doc is explicit that a four-line dialogue box cannot show
 * someone reacting. These are head-and-shoulders at 64x64, drawn from the
 * same spec as the walking sprite, with an `mood` variant so a character can
 * visibly harden between March and September.
 * ---------------------------------------------------------------------- */
const PORTRAIT = 64;
function buildPortrait(spec, mood = 'neutral') {
  const sp = normalize(spec);
  const s = surface(PORTRAIT, PORTRAIT);
  const g = s.g;
  const C = PORTRAIT / 2;

  // Backdrop: a cold vignette so pale faces still separate from the box.
  rect(g, 0, 0, PORTRAIT, PORTRAIT, '#3b3f46');
  for (let i = 0; i < 10; i++) {
    const t = i / 10;
    rect(g, 0, i * 6, PORTRAIT, 6, `rgba(20,22,26,${0.05 + t * 0.16})`);
  }

  const scale = sp.child ? 0.88 : 1;
  const headW = Math.round(29 * scale), headH = Math.round(34 * scale);
  const hx = C - Math.round(headW / 2);
  const hy = 13;

  // ---- shoulders -------------------------------------------------------
  const shY = hy + headH + 3;
  ellipse(g, C, shY + 16, 26, 16, sp.coat[2]);
  ellipse(g, C, shY + 15, 25, 15, sp.coat[1]);
  ellipse(g, C - 7, shY + 14, 12, 10, sp.coat[0]);
  if (sp.collar) {
    ellipse(g, C, shY + 2, sp.band ? 17 : 13, sp.band ? 8 : 6, sp.collar);
    ellipse(g, C, shY + 1, sp.band ? 16 : 12, sp.band ? 7 : 5, '#e8e2d2');
  }
  // Neck.
  rect(g, C - 5, hy + headH - 4, 10, 8, sp.flesh[2]);
  rect(g, C - 4, hy + headH - 4, 8, 6, sp.flesh[1]);

  // ---- head ------------------------------------------------------------
  ellipse(g, C, hy + headH / 2, headW / 2 + 1, headH / 2 + 1, P.outline);
  ellipse(g, C, hy + headH / 2, headW / 2, headH / 2, sp.flesh[1]);
  // Light from upper-left.
  ellipse(g, C - 4, hy + headH / 2 - 4, headW / 2 - 4, headH / 2 - 5, sp.flesh[0]);
  // Jaw and cheek shadow.
  ellipse(g, C + 5, hy + headH / 2 + 4, 7, 8, sp.flesh[2]);

  // ---- features --------------------------------------------------------
  const ey = hy + Math.round(headH * 0.46);
  const eo = Math.round(headW * 0.22);

  // Brow: the single most expressive line at this size.
  const browY = ey - 4 + (mood === 'hard' ? 1 : 0);
  hline(g, C - eo - 3, browY - (mood === 'hard' ? 0 : 1), 6, sp.hair[2]);
  hline(g, C + eo - 2, browY - (mood === 'hard' ? 0 : 1), 6, sp.hair[2]);
  if (mood === 'hard') {
    px(g, C - eo + 2, browY + 1, sp.hair[2]);
    px(g, C + eo - 2, browY + 1, sp.hair[2]);
  }

  // Eyes.
  for (const sx of [C - eo, C + eo]) {
    rect(g, sx - 2, ey, 5, 3, '#efe9df');
    rect(g, sx, ey, 2, 3, P.ink);
    px(g, sx, ey, '#7f8a92');
    hline(g, sx - 2, ey - 1, 5, sp.flesh[2]);
  }

  // Nose and mouth.
  vline(g, C, ey + 3, 4, sp.flesh[2]);
  px(g, C - 1, ey + 6, sp.flesh[2]);
  const mY = ey + 10;
  if (mood === 'hard') hline(g, C - 4, mY, 8, '#8a6154');
  else { hline(g, C - 3, mY, 7, '#8a6154'); px(g, C - 4, mY - 1, sp.flesh[2]); }

  // Age lines.
  if (sp.stoop) {
    hline(g, C - 10, ey - 7, 5, sp.flesh[2]);
    hline(g, C + 6, ey - 7, 5, sp.flesh[2]);
    hline(g, C - 8, mY + 4, 4, sp.flesh[2]);
    hline(g, C + 5, mY + 4, 4, sp.flesh[2]);
  }

  // ---- hair ------------------------------------------------------------
  ellipse(g, C, hy + 6, headW / 2 + 1, 8, sp.hair[1]);
  ellipse(g, C - 4, hy + 4, headW / 2 - 4, 5, sp.hair[0]);
  rect(g, hx - 1, hy + 5, 3, Math.round(headH * 0.55), sp.hair[1]);
  rect(g, hx + headW - 2, hy + 5, 3, Math.round(headH * 0.55), sp.hair[2]);

  if (sp.coif) {
    // A linen coif sits BACK on the head. If it covers the whole crown it
    // stops reading as cloth and starts reading as white hair, so the cap
    // stops short and a band of the wearer's own hair shows beneath it.
    ellipse(g, C, hy - 1, headW / 2 + 4, 12, P.outline);
    ellipse(g, C, hy - 1, headW / 2 + 3, 11, sp.coif);
    ellipse(g, C - 5, hy - 4, headW / 2 - 4, 6, '#eee9dc');   // catchlight
    // Hem of the cap, so the front edge has a visible thickness.
    ellipse(g, C, hy + 9, headW / 2 + 3, 3, P.wallLo);
    ellipse(g, C, hy + 8, headW / 2 + 3, 3, sp.coif);
    // Lappets falling past the jaw.
    rect(g, hx - 4, hy + 2, 4, 18, sp.coif);
    rect(g, hx + headW, hy + 2, 4, 18, sp.coif);
    vline(g, hx - 4, hy + 2, 18, P.outline);
    vline(g, hx + headW + 3, hy + 2, 18, P.outline);
    vline(g, hx - 1, hy + 2, 18, P.wallLo);
    vline(g, hx + headW, hy + 2, 18, P.wallLo);
  }
  if (sp.hat) {
    rect(g, C - 24, hy + 1, 48, 4, sp.hat);
    stroke(g, C - 24, hy + 1, 48, 4, P.ink);
    rect(g, hx - 1, hy - 11, headW + 2, 13, sp.hat);
    stroke(g, hx - 1, hy - 11, headW + 2, 13, P.ink);
    rect(g, hx, hy - 10, headW - 4, 2, '#4a4640');
  }

  speckle(g, 0, 0, PORTRAIT, PORTRAIT, 'rgba(255,255,255,0.03)', 0.05, 313);
  stroke(g, 0, 0, PORTRAIT, PORTRAIT, P.ink);
  return s;
}

/* ---------------------------------------------------------------------- *
 * The player
 *
 * A student from the present, in modern clothes, walking around 1692. The
 * visual mismatch is intentional and permanent: they never blend in, and by
 * September that is the point.
 * ---------------------------------------------------------------------- */
const PLAYER_SPEC = {
  flesh: FLESH.olive,
  hair: HAIR.dark,
  coat: ['#4a6d8c', '#3b5871', '#2c4356'],   // a blue hoodie
  under: ['#3a3f4a', '#2f333c', '#24272e'],  // jeans
  collar: null,
};

/* ===== src/engine/state.js ===== */
// Player knowledge, and the record of where it came from.
//
// Two rules from the design doc drive this whole module:
//
//   "Gating by knowledge, not by items: you can't ask Putnam about the
//    Topsfield line until you've stood at the boundary marker."
//
//   "NPCs know who you've been talking to. 'Who told you that? Was it
//    Putnam?' — and their story shifts based on the answer."
//
// So a flag is never just a boolean. Every piece of knowledge remembers who
// the player heard it from, which is what lets a villager react to the
// source rather than only to the fact. That is the difference between a
// conversation and a lecture with walking.
//
// Storage is localStorage only — no accounts, no network, no analytics.
// COPPA/FERPA: this game must never learn anything about a student that
// leaves their own browser.

const SAVE_KEY = 'salem1692.save.v1';

// Chapters in order, for asking whether something happened before now.
const CHAPTER_ORDER = ['memorial', 'march', 'dig', 'june', 'archive', 'september', 'reckoning'];
class GameState {
  constructor() {
    this.flags = new Map();        // flag -> { source, chapter, at }
    this.chapter = 'memorial';     // memorial|march|dig|june|archive|september|reckoning
    this.docs = new Map();         // doc id -> { chapter, at }
    this.answer = '';              // the player's final answer, never graded
    this.talkedTo = new Set();     // npc ids the player has spoken with
    // Which chapter each of them was FIRST spoken to in. `talkedTo` alone
    // cannot answer "did you know me before all this", because by June it
    // is true whether the player met them in March or thirty seconds ago.
    this.metIn = new Map();        // npc id -> chapter of first meeting
    this.lastSpoke = null;         // most recent npc id
    this.visited = new Set();      // map ids
    this.finalAnswer = '';

    // Disputes the game has already pointed out, so it says it once and
    // then shuts up, and the position the player has taken on each. A
    // position is never scored and never has to be given — it exists so the
    // exported notes can be an argument rather than an inventory.
    this.disputesSeen = new Set();   // dispute ids already announced
    this.positions = new Map();      // dispute id -> 'a' | 'b' | 'unsure'

    // Which of the four cases the player has filed each piece of evidence
    // under. Theirs, not the game's: nothing in the game says which theory a
    // fact supports, because deciding that is the whole skill. Unscored,
    // optional, and several facts can reasonably go under more than one.
    this.filed = new Map();          // flag -> Set of theory ids
  }

  /** Record a piece of knowledge. `source` is an npc id, a prop id, or
   *  'observed' for something the player simply saw. */
  learn(flag, source = 'observed') {
    if (this.flags.has(flag)) return false;
    this.flags.set(flag, { source, chapter: this.chapter, at: Date.now() });
    // The engine must not know what a dispute is — that is content. It just
    // reports that something genuinely new landed, and lets the game layer
    // decide whether it matters.
    if (this.onRecord) this.onRecord(flag);
    return true;
  }

  knows(flag) { return this.flags.has(flag); }

  /** Who the player heard this from. Null if they don't know it at all. */
  sourceOf(flag) {
    const rec = this.flags.get(flag);
    return rec ? rec.source : null;
  }

  /** True when every listed flag is known. Undefined/empty means no gate. */
