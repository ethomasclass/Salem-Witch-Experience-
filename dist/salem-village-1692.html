/* ===== src/engine/world.js ===== */
// Maps, collision, and rendering.
//
// A map is authored as ASCII ground plus a list of props. Ground handles
// terrain; anything with height — houses, trees, the woodpile — is a prop
// with a tile footprint and a baseline. Props and actors are sorted by that
// baseline every frame, so the player walks BEHIND a house's roof and IN
// FRONT of its doorstone. Without that sort the oblique projection falls
// apart instantly and the whole village reads as a flat diagram.
const VIEW_W = 320, VIEW_H = 240;

/* ---------------------------------------------------------------------- *
 * Terrain
 * ---------------------------------------------------------------------- */
const GROUND = {
  '.': 'grass',
  ',': 'grass',
  '-': 'mud',
  '*': 'snow',
  '~': 'water',
  'f': 'floor',
  '#': 'wall',
  'H': 'hearthstone',
  'x': 'void',
  // Present day.
  'L': 'lawn',
  'G': 'paving',
  'B': 'brick',
  'A': 'asphalt',
};

const SOLID_GROUND = new Set(['water', 'void', 'wall']);

/* ---------------------------------------------------------------------- *
 * Prop catalogue
 *
 * `w`/`h` are the tile footprint. `solidRows` limits collision to the
 * bottom N rows so the player can walk behind a tree canopy — the standard
 * trick, and the reason trees feel like scenery rather than walls.
 * ---------------------------------------------------------------------- */
const PROPS = {
  house:        { w: 6, h: 5, build: (o) => buildHouse(o.w || 6, o.h || 5, o), sized: true },
  meetinghouse: { w: 9, h: 6, build: (o) => buildMeetinghouse(o.w || 9, o.h || 6), sized: true },
  pine:         { w: 2, h: 3, build: () => buildPine(), solidRows: 1 },
  baretree:     { w: 3, h: 4, build: () => buildBareTree(), solidRows: 1 },
  fence:        { w: 1, h: 1, build: () => buildFence() },
  woodpile:     { w: 2, h: 1, build: () => buildWoodpile() },
  marker:       { w: 1, h: 1, build: () => buildMarker() },
  well:         { w: 2, h: 2, build: () => buildWell() },
  seatingchart: { w: 2, h: 2, build: () => buildSeatingChart(), solidRows: 2 },
  hearth:       { w: 3, h: 2, build: () => buildHearth() },
  table:        { w: 2, h: 1, build: () => buildTable() },
  pew:          { w: 1, h: 1, build: () => buildPew() },
  accountbook:  { w: 1, h: 1, build: () => buildAccountBook(), passable: true },

  // A working farm village, not a street of houses.
  barn:         { w: 8, h: 6, build: (o) => buildBarn(o.w || 8, o.h || 6), sized: true },
  stonewall:    { w: 1, h: 1, build: () => buildStoneWall() },
  hayrick:      { w: 2, h: 2, build: () => buildHayrick(), solidRows: 1 },
  cart:         { w: 2, h: 1, build: () => buildCart() },
  appletree:    { w: 2, h: 3, build: () => buildAppleTree(), solidRows: 1 },
  pig:          { w: 1, h: 1, build: () => buildPig() },
  cow:          { w: 2, h: 1, build: () => buildCow() },
  sheep:        { w: 1, h: 1, build: () => buildSheep() },
  chicken:      { w: 1, h: 1, build: () => buildChicken(), passable: true },
  // Solid, but you can speak through it. The jail scene is a conversation
  // held through a grate, which is the whole shape of it.
  bars:         { w: 1, h: 1, build: () => buildBars(), talkThrough: true },
  paper:        { w: 1, h: 1, build: () => buildPaper(), passable: true },
  archivebox:   { w: 1, h: 1, build: () => buildArchiveBox() },
  straw:        { w: 1, h: 1, build: () => buildStraw(), passable: true },

  // Present day.
  membench:     { w: 2, h: 1, build: () => buildMemBench() },
  lowwall:      { w: 1, h: 1, build: () => buildLowWall() },
  locust:       { w: 3, h: 4, build: () => buildLocust(), solidRows: 1 },
  signboard:    { w: 2, h: 2, build: () => buildSignboard(), solidRows: 1 },
  bin:          { w: 1, h: 1, build: () => buildBin() },
  shopfront:    { w: 6, h: 5, build: (o) => buildShopfront(o.w || 6, o.h || 5), sized: true },
};

let TILES = null;
const PROP_CACHE = new Map();
function initArt() {
  if (!TILES) TILES = buildGroundTiles();
}

function propImage(prop) {
  const def = PROPS[prop.kind];
  // Sized props (houses) need one image per distinct configuration.
  const key = def.sized
    ? `${prop.kind}:${prop.w}x${prop.h}:${prop.doorCol}:${(prop.windows || []).join(',')}:${prop.chimney}:${prop.leanTo}:${prop.roofFrac}`
    : prop.kind;
  let img = PROP_CACHE.get(key);
  if (!img) { img = def.build(prop); PROP_CACHE.set(key, img); }
  return img;
}

/* ---------------------------------------------------------------------- *
 * Map construction
 * ---------------------------------------------------------------------- */

/**
 * Build a map for a given chapter.
 *
 * The village is dressed three times across the game, so a map definition
 * may carry `byChapter` overrides — extra props, removed props, a different
 * cast, a different name. Everything not overridden is shared, which is the
 * whole reason one village map can carry March, June and September.
 */
function buildMap(def, chapter = 'march') {
  const over = (def.byChapter && def.byChapter[chapter]) || {};
  def = {
    ...def,
    ...over,
    props: [...(def.props || []), ...(over.addProps || [])]
      .filter((p) => !(over.hideProps || []).some((h) => h.x === p.x && h.y === p.y && h.kind === p.kind)),
    interact: [...(def.interact || []), ...(over.addInteract || [])],
    triggers: [...(def.triggers || []), ...(over.addTriggers || [])],
    warps: [...(def.warps || []), ...(over.addWarps || [])],
    npcs: over.npcs !== undefined ? over.npcs : (def.npcs || []),
  };
  const rows = def.ground;
  const h = rows.length;
  const w = Math.max(...rows.map((r) => r.length));

  // Validate up front — a ragged ASCII map is the single easiest mistake to
  // make when hand-authoring one of these, and silently padding it produces
  // collision bugs that are miserable to track down later.
  rows.forEach((r, i) => {
    if (r.length !== w) {
      console.warn(`[map:${def.id}] row ${i} is ${r.length} wide, expected ${w}`);
    }
  });

  const terrain = new Array(w * h);
  const solid = new Uint8Array(w * h);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || 'x';
      const t = GROUND[ch] || 'grass';
      terrain[y * w + x] = t;
      if (SOLID_GROUND.has(t)) solid[y * w + x] = 1;
    }
  }

  const talkThrough = new Set();
  const props = (def.props || []).map((p) => {
    const d = PROPS[p.kind];
    if (!d) throw new Error(`unknown prop kind: ${p.kind}`);
    if (d.talkThrough) {
      for (let y = p.y; y < p.y + (p.h || d.h); y++) {
        for (let x = p.x; x < p.x + (p.w || d.w); x++) talkThrough.add(`${x},${y}`);
      }
    }
    const inst = {
      ...p,
      w: p.w || d.w,
      h: p.h || d.h,
      doorCol: p.doorCol !== undefined ? p.doorCol : Math.floor((p.w || d.w) / 2),
    };
    if (!d.passable) {
      const rowsSolid = d.solidRows || inst.h;
      const y0 = inst.y + inst.h - rowsSolid;
      for (let y = y0; y < inst.y + inst.h; y++) {
        for (let x = inst.x; x < inst.x + inst.w; x++) {
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          solid[y * w + x] = 1;
        }
      }
    }
    return inst;
  });

  // Warps punch a hole back through whatever solid the door sits in.
  const warps = new Map();
  for (const wp of def.warps || []) {
    warps.set(`${wp.x},${wp.y}`, wp);
    if (wp.x >= 0 && wp.y >= 0 && wp.x < w && wp.y < h) solid[wp.y * w + wp.x] = 0;
  }

  // Examinable tiles.
  const interact = new Map();
  for (const it of def.interact || []) {
    const iw = it.w || 1, ih = it.h || 1;
    for (let y = it.y; y < it.y + ih; y++) {
      for (let x = it.x; x < it.x + iw; x++) interact.set(`${x},${y}`, it);
    }
  }

  // Tiles that fire once when stepped on, without the player pressing
  // anything. Used sparingly — the road to Salem Town is worth one, because
  // the point of that walk is the walk itself.
  const triggers = new Map();
  for (const t of def.triggers || []) {
    const tw = t.w || 1, th = t.h || 1;
    for (let y = t.y; y < t.y + th; y++) {
      for (let x = t.x; x < t.x + tw; x++) triggers.set(`${x},${y}`, t);
    }
  }

  return {
    id: def.id, name: def.name, indoor: !!def.indoor,
    era: def.era || '1692', chapter,
    w, h, terrain, solid, props, warps, interact, triggers, talkThrough,
    npcs: [], def,
  };
}

/* ---------------------------------------------------------------------- *
 * Queries
 * ---------------------------------------------------------------------- */
function terrainAt(map, x, y) {
  if (x < 0 || y < 0 || x >= map.w || y >= map.h) return 'void';
  return map.terrain[y * map.w + x];
}
function isSolid(map, x, y, actors = []) {
  if (x < 0 || y < 0 || x >= map.w || y >= map.h) return true;
  if (map.solid[y * map.w + x]) return true;
  for (const a of actors) {
    if (a.tx === x && a.ty === y) return true;
  }
  return false;
}
function warpAt(map, x, y) { return map.warps.get(`${x},${y}`) || null; }
function interactAt(map, x, y) { return map.interact.get(`${x},${y}`) || null; }
function triggerAt(map, x, y) { return map.triggers.get(`${x},${y}`) || null; }
const DIR_VEC = {
  up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0],
};
const DIR_INDEX = {
  up: DIR.UP, down: DIR.DOWN, left: DIR.LEFT, right: DIR.RIGHT,
};

/* ---------------------------------------------------------------------- *
 * Rendering
 * ---------------------------------------------------------------------- */

/** Edge mask for a ground tile: which neighbours are a different terrain. */
function edgeMask(map, x, y, t) {
  let m = 0;
  if (terrainAt(map, x, y - 1) !== t) m |= EDGE_BITS.N;
  if (terrainAt(map, x + 1, y) !== t) m |= EDGE_BITS.E;
  if (terrainAt(map, x, y + 1) !== t) m |= EDGE_BITS.S;
  if (terrainAt(map, x - 1, y) !== t) m |= EDGE_BITS.W;
  return m;
}

/** Interiors render at 2x so a small room reads as a small room rather than
 *  as a postage stamp floating in a black viewport. These houses genuinely
 *  were cramped, and the camera should be inside that rather than above it. */
function zoomFor(map) { return map.indoor ? 2 : 1; }
function computeCamera(map, focusPx, focusPy) {
  const z = zoomFor(map);
  const vw = VIEW_W / z, vh = VIEW_H / z;
  const mapPxW = map.w * TS, mapPxH = map.h * TS;
  let cx = Math.round(focusPx + TS / 2 - vw / 2);
  let cy = Math.round(focusPy + TS / 2 - vh / 2);
  // Clamp, unless the map is smaller than the viewport — then centre it.
  cx = mapPxW <= vw ? Math.round((mapPxW - vw) / 2) : Math.max(0, Math.min(cx, mapPxW - vw));
  cy = mapPxH <= vh ? Math.round((mapPxH - vh) / 2) : Math.max(0, Math.min(cy, mapPxH - vh));
  return { x: cx, y: cy };
}
function renderMap(g, map, cam, actors) {
  initArt();

  const z = zoomFor(map);
  const VW = VIEW_W / z, VH = VIEW_H / z;

  // --- ground ---------------------------------------------------------
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = map.indoor ? '#0d0e11' : (map.era === 'present' ? '#2b3038' : '#20232a');
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  if (z !== 1) g.setTransform(z, 0, 0, z, 0, 0);

  const x0 = Math.max(0, Math.floor(cam.x / TS));
  const y0 = Math.max(0, Math.floor(cam.y / TS));
  const x1 = Math.min(map.w - 1, Math.ceil((cam.x + VW) / TS));
  const y1 = Math.min(map.h - 1, Math.ceil((cam.y + VH) / TS));

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = terrainAt(map, x, y);
      if (t === 'void') continue;
      const set = TILES[t];
      if (!set) continue;
      const mask = edgeMask(map, x, y, t);
      const img = set[mask][variantFor(x, y)];
      g.drawImage(img.canvas, x * TS - cam.x, y * TS - cam.y);
    }
  }

  // --- props + actors, sorted by baseline ------------------------------
  const draws = [];

  for (const p of map.props) {
    const img = propImage(p);
    const dx = p.x * TS - cam.x;
    const dy = (p.y + p.h) * TS - img.h - cam.y + (PROPS[p.kind].sized ? 6 : 0);
    // Cull generously — props can be tall.
    if (dx > VW || dx + img.w < 0 || dy > VH || dy + img.h < 0) continue;
    draws.push({ img: img.canvas, dx, dy, base: (p.y + p.h) * TS });
  }

  for (const a of actors) {
    if (!a.frames) continue;
    const frame = a.frames[a.dirIndex][a.animFrame];
    const dx = Math.round(a.px) - cam.x;
    const dy = Math.round(a.py) - (SPR_H - TS) - cam.y;
    if (dx > VW || dx + SPR_W < 0 || dy > VH || dy + SPR_H < 0) continue;
    draws.push({ img: frame.canvas, dx, dy, base: Math.round(a.py) + TS });
  }

  draws.sort((m, n) => m.base - n.base);
  for (const d of draws) g.drawImage(d.img, d.dx, d.dy);

  // --- indoor vignette --------------------------------------------------
  // Glass was expensive and windows were tiny; these rooms were genuinely
  // dark. Cheap way to make the hearth feel like it is doing real work.
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (map.indoor) {
    const grd = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.34,
                                       VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.92);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(8,8,12,0.5)');
    g.fillStyle = grd;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  } else if (map.era === 'present') {
    // A warm lift over the present-day maps. The terrain and props already
    // do most of the work of separating the eras; this is the last few
    // percent, so a student registers the century before reading a word.
    g.save();
    g.globalCompositeOperation = 'soft-light';
    g.fillStyle = 'rgba(255, 196, 122, 0.30)';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.restore();
  }
}

/* ===== src/engine/ui.js ===== */
// UI: dialogue box, choice menu, notebook, title.
//
// Deliberate split of resolutions. The world renders into a 320x240 buffer
// and is scaled up with nearest-neighbour so the pixel art stays crunchy.
// The UI draws afterwards at full display resolution with real font
// rendering. This game is 95% dialogue and it is going on a Chromebook in a
// classroom — chunky upscaled text would be authentic and also genuinely
// harder to read for thirty minutes straight. Portraits stay pixel-scaled so
// they still belong to the world.

/** Greedy word wrap against a measured width. */
function wrapText(g, text, maxWidth) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const trial = line ? `${line} ${word}` : word;
    if (g.measureText(trial).width <= maxWidth || !line) {
      line = trial;
    } else {
      lines.push(line);
      line = word;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function panel(g, x, y, w, h, s) {
  // Two-tone parchment panel with a dark rule and an inner hairline.
  g.fillStyle = 'rgba(16,16,20,0.35)';
  g.fillRect(x + 3 * s, y + 3 * s, w, h);
  g.fillStyle = P.boxFill;
  g.fillRect(x, y, w, h);
  g.fillStyle = P.boxFill2;
  g.fillRect(x, y + h - 4 * s, w, 4 * s);
  g.strokeStyle = P.boxEdge;
  g.lineWidth = Math.max(2, 2 * s);
  g.strokeRect(x + s, y + s, w - 2 * s, h - 2 * s);
  g.strokeStyle = 'rgba(58,54,48,0.30)';
  g.lineWidth = 1;
  g.strokeRect(x + 4 * s, y + 4 * s, w - 8 * s, h - 8 * s);
}
const DIALOGUE_FONT = (s) =>
  `${11.5 * s}px Georgia, "Iowan Old Style", Palatino, serif`;

/**
 * Geometry for the dialogue box, and the wrapped lines for a given string.
 *
 * Kept separate from drawing so the game loop can paginate: a lot of the
 * writing in this game runs longer than four lines, and reflowing text
 * mid-typewriter looks broken. Wrap once, page through, reveal per page.
 */
function dialogueLayout(g, view, s, text, hasPortrait) {
  const pad = 8 * s;
  const boxH = 88 * s;
  const bx = view.x + pad;
  const by = view.y + view.h - boxH - pad;
  const bw = view.w - pad * 2;

  const bodyX = hasPortrait ? bx + 74 * s : bx + 14 * s;
  const bodyW = (hasPortrait ? bw - 88 * s : bw - 28 * s);
  const lineH = 15 * s;
  const maxLines = Math.max(1, Math.floor((boxH - 26 * s) / lineH));

  g.font = DIALOGUE_FONT(s);
  const lines = text ? wrapText(g, text, bodyW) : [];

  const pages = [];
  for (let i = 0; i < lines.length; i += maxLines) pages.push(lines.slice(i, i + maxLines));
  if (!pages.length) pages.push([]);

  return { bx, by, bw, boxH, bodyX, bodyW, lineH, maxLines, lines, pages };
}

/**
 * The dialogue box.
 *
 * @param d  { who, portrait, page: string[], revealed, done, more }
 */
function drawDialogue(g, view, s, L, d) {
  panel(g, L.bx, L.by, L.bw, L.boxH, s);

  // Portrait, pixel-scaled so it still belongs to the world art.
  if (d.portrait) {
    const size = 62 * s;
    const px0 = L.bx + 8 * s;
    const py0 = L.by - size + 16 * s;
    g.fillStyle = P.boxEdge;
    g.fillRect(px0 - 2 * s, py0 - 2 * s, size + 4 * s, size + 4 * s);
    g.imageSmoothingEnabled = false;
    g.drawImage(d.portrait.canvas, px0, py0, size, size);
  }

  // Name plate rides the box's top edge.
  if (d.who) {
    g.font = `700 ${10.5 * s}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    const nameW = g.measureText(d.who).width + 16 * s;
    const nx = d.portrait ? L.bx + 74 * s : L.bx + 10 * s;
    g.fillStyle = P.boxEdge;
    g.fillRect(nx, L.by - 10 * s, nameW, 20 * s);
    g.fillStyle = P.boxFill;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(d.who, nx + 8 * s, L.by);
  }

  // Body. Serif — this is a game about the seventeenth century and the voice
  // should not sound like a UI string.
  g.font = DIALOGUE_FONT(s);
  g.fillStyle = d.who ? P.boxInk : P.boxDim;   // narration reads quieter
  if (!d.who) g.font = `italic ${11.5 * s}px Georgia, Palatino, serif`;
  g.textAlign = 'left';
  g.textBaseline = 'top';

  let budget = d.revealed;
  let ty = L.by + 15 * s;
  for (const line of d.page) {
    if (budget <= 0) break;
    g.fillText(line.slice(0, budget), L.bodyX, ty);
    budget -= line.length + 1;
    ty += L.lineH;
  }

  // Advance caret.
  if (d.done) {
    const cx = L.bx + L.bw - 20 * s;
    const cy = L.by + L.boxH - 15 * s + Math.sin(Date.now() / 220) * 1.5 * s;
    g.fillStyle = P.accent;
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + 9 * s, cy);
    g.lineTo(cx + 4.5 * s, cy + 6 * s);
    g.closePath();
    g.fill();
    if (d.more) {
      g.font = `${8.5 * s}px system-ui, sans-serif`;
      g.fillStyle = P.boxDim;
      g.textAlign = 'right';
      g.fillText('more', cx - 6 * s, cy - 2 * s);
    }
  }
}

/** Choice menu, anchored above the dialogue box. */
function drawChoices(g, view, s, options, index) {
  g.font = `${12 * s}px Georgia, "Iowan Old Style", Palatino, serif`;
  let maxW = 0;
  for (const o of options) maxW = Math.max(maxW, g.measureText(o.label).width);

  const rowH = 22 * s;
  const bw = Math.min(view.w - 32 * s, maxW + 48 * s);
  const bh = options.length * rowH + 16 * s;
  const bx = view.x + view.w - bw - 16 * s;
  const by = view.y + view.h - 88 * s - 14 * s - bh;

  panel(g, bx, by, bw, bh, s);

  g.textAlign = 'left';
  g.textBaseline = 'middle';
  options.forEach((o, i) => {
    const y = by + 8 * s + rowH * i + rowH / 2;
    if (i === index) {
      g.fillStyle = 'rgba(125,63,44,0.14)';
      g.fillRect(bx + 8 * s, y - rowH / 2 + 2 * s, bw - 16 * s, rowH - 4 * s);
      g.fillStyle = P.accent;
      g.beginPath();
      g.moveTo(bx + 16 * s, y - 5 * s);
      g.lineTo(bx + 22 * s, y);
      g.lineTo(bx + 16 * s, y + 5 * s);
      g.closePath();
      g.fill();
    }
    g.fillStyle = i === index ? P.boxInk : P.boxDim;
    g.fillText(o.label, bx + 30 * s, y);
  });

  return { bx, by, bw, bh, rowH };
}

/** A small transient line at the top of the screen — used when the player
 *  examines something and learns from it. */
function drawToast(g, view, s, text, alpha) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = Math.min(1, alpha);
  // Tucked under the place-name label rather than beside it — some map
  // names are long, and "Salem Witch Trials Memorial" collides with
  // anything sharing that line.
  g.font = `600 ${8.5 * s}px system-ui, -apple-system, sans-serif`;
  const w = g.measureText(text).width + 20 * s;
  const h = 17 * s;
  const x = view.x + 8 * s;
  const y = view.y + 30 * s;
  g.fillStyle = 'rgba(26,26,30,0.88)';
  g.fillRect(x, y, w, h);
  g.fillStyle = P.accent;
  g.fillRect(x, y, 2.5 * s, h);
  g.fillStyle = '#efeade';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, x + w / 2 + 1 * s, y + h / 2);
  g.restore();
}

/**
 * The notebook. Everything the player has learned, in the order they learned
 * it, with who told them. This is the spine of the exit artifact — the design
 * doc is firm that without something the teacher can collect, this is a fun
 * thirty minutes with no assessment hook.
 */
function drawNotebook(g, view, s, entries, scroll, sourceName) {
  g.fillStyle = 'rgba(12,12,16,0.72)';
  g.fillRect(view.x, view.y, view.w, view.h);

  const bx = view.x + 20 * s, by = view.y + 20 * s;
  const bw = view.w - 40 * s, bh = view.h - 40 * s;
  panel(g, bx, by, bw, bh, s);

  g.textAlign = 'left';
  g.font = `700 ${13 * s}px Georgia, serif`;
  g.fillStyle = P.boxInk;
  g.textBaseline = 'top';
  g.fillText('What I have seen and been told', bx + 18 * s, by + 14 * s);

  g.font = `${8.5 * s}px system-ui, sans-serif`;
  g.fillStyle = P.boxDim;
  g.fillText('X or Esc to close  ·  ↑ ↓ to scroll', bx + 18 * s, by + 31 * s);

  const top = by + 46 * s;
  const bottom = by + bh - 12 * s;

  g.strokeStyle = 'rgba(58,54,48,0.35)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(bx + 18 * s, top - 8 * s);
  g.lineTo(bx + bw - 18 * s, top - 8 * s);
  g.stroke();

  if (!entries.length) {
    g.font = `italic ${11 * s}px Georgia, serif`;
    g.fillStyle = P.boxDim;
    g.fillText('Nothing yet. Go and talk to someone.', bx + 18 * s, top + 6 * s);
    return;
  }

  // Clip to the panel so a long list scrolls under the frame instead of
  // spilling out over the darkened world behind it.
  g.save();
  g.beginPath();
  g.rect(bx + 8 * s, top - 4 * s, bw - 16 * s, bottom - top + 4 * s);
  g.clip();

  const textW = bw - 52 * s;
  const lineH = 13 * s;
  const bodyFont = `${10.5 * s}px Georgia, serif`;
  const srcFont = `${8.5 * s}px system-ui, sans-serif`;

  let y = top - scroll;
  let contentH = 0;

  for (const e of entries) {
    g.font = bodyFont;
    const lines = wrapText(g, e.text, textW);
    const blockH = lines.length * lineH + 13 * s + 10 * s;

    if (y + blockH > top - 20 * s && y < bottom + 20 * s) {
      g.font = bodyFont;
      g.fillStyle = P.boxInk;
      let ly = y;
      for (const l of lines) { g.fillText(l, bx + 32 * s, ly); ly += lineH; }

      g.font = srcFont;
      g.fillStyle = P.boxDim;
      g.fillText(sourceName(e.source), bx + 32 * s, ly + 1 * s);

      g.fillStyle = P.accent;
      g.fillRect(bx + 20 * s, y + 4 * s, 4 * s, 4 * s);
    }
    y += blockH;
    contentH += blockH;
  }
  g.restore();

  // Scroll affordance when there is more below.
  const maxScroll = Math.max(0, contentH - (bottom - top));
  if (scroll < maxScroll - 1) {
    g.fillStyle = P.boxDim;
    g.textAlign = 'center';
    g.font = `${9 * s}px system-ui, sans-serif`;
    g.fillText('▼ more', bx + bw / 2, bottom - 2 * s);
  }
  return maxScroll;
}

/**
 * The objective HUD.
 *
 * One line, top-right, in the yellow every game has used for "here is what
 * to do next" since the nineties — because that convention is doing real
 * work for a student who has never played anything like this. Below it, once
 * the memorial has raised it, the standing question in a quieter colour.
 *
 * Deliberately not a quest log: one step at a time, no checklist, nothing
 * that looks like a worksheet.
 */
function drawObjective(g, view, s, { step, standing, progress, flash }) {
  const pad = 8 * s;
  const right = view.x + view.w - pad;
  // Hard cap, so a long goal wraps instead of spanning the whole screen and
  // colliding with the place-name label in the opposite corner.
  const maxW = Math.min(118 * s, view.w * 0.34);
  let y = view.y + pad;

  g.textAlign = 'right';
  g.textBaseline = 'top';

  if (step) {
    const bodyFont = `600 ${7 * s}px system-ui, -apple-system, sans-serif`;
    g.font = bodyFont;
    const lines = wrapText(g, step.text, maxW);
    let textW = 0;
    for (const l of lines) textW = Math.max(textW, g.measureText(l).width);

    const lineH = 9.5 * s;
    const boxW = textW + 16 * s;
    const boxH = 13 * s + lines.length * lineH;

    g.fillStyle = 'rgba(14,16,20,0.72)';
    g.fillRect(right - boxW, y, boxW, boxH);
    g.fillStyle = flash > 0 ? '#f6e8b8' : '#e8c46a';
    g.fillRect(right - boxW, y, 2 * s, boxH);

    g.font = `700 ${5.5 * s}px system-ui, -apple-system, sans-serif`;
    g.fillStyle = '#8d939b';
    g.fillText(`GOAL  ${progress.done}/${progress.total}`, right - 8 * s, y + 4 * s);

    g.font = bodyFont;
    // A brief pale flash when a goal completes, then back to steady yellow.
    g.fillStyle = flash > 0 ? '#fff6d8' : '#e8c46a';
    let ly = y + 12 * s;
    for (const l of lines) { g.fillText(l, right - 8 * s, ly); ly += lineH; }
    y += boxH + 4 * s;
  }

  if (standing) {
    g.font = `italic ${7.5 * s}px Georgia, Palatino, serif`;
    const w = g.measureText(standing).width + 14 * s;
    const h = 13 * s;
    g.fillStyle = 'rgba(14,16,20,0.58)';
    g.fillRect(right - w, y, w, h);
    g.fillStyle = '#b9a06a';
    g.fillText(standing, right - 8 * s, y + 3 * s);
  }
}

/**
 * The document reader.
 *
 * One of the two screens the design doc says this game needs that Pokémon
 * never had: original text on one side, a plain modern gloss on the other,
 * full screen, with the citation and — deliberately — a fidelity label. A
 * student noticing that some sources are transcriptions and some are
 * reconstructions is a student doing source criticism.
 *
 * It is a reader, not a graphic organiser. No fields, no prompts, nothing to
 * fill in.
 */
function drawReader(g, view, s, doc, fidelityLabel, scroll, copied) {
  g.fillStyle = 'rgba(10,10,13,0.9)';
  g.fillRect(view.x, view.y, view.w, view.h);

  const bx = view.x + 12 * s, by = view.y + 12 * s;
  const bw = view.w - 24 * s, bh = view.h - 24 * s;
  panel(g, bx, by, bw, bh, s);

  g.textAlign = 'left';
  g.textBaseline = 'top';

  // --- header ---------------------------------------------------------
  g.font = `700 ${13 * s}px Georgia, serif`;
  g.fillStyle = P.boxInk;
  g.fillText(doc.title, bx + 16 * s, by + 12 * s);

  g.font = `${8.5 * s}px system-ui, sans-serif`;
  g.fillStyle = P.boxDim;
  g.fillText(`${doc.date}  ·  ${doc.kind}`, bx + 16 * s, by + 30 * s);

  g.textAlign = 'right';
  g.fillStyle = copied ? '#5d7a4a' : P.accent;
  g.fillText(copied ? 'copied into your notebook' : 'Z to copy this down',
             bx + bw - 16 * s, by + 30 * s);
  g.textAlign = 'left';

  const ruleY = by + 44 * s;
  g.strokeStyle = 'rgba(58,54,48,0.4)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(bx + 16 * s, ruleY); g.lineTo(bx + bw - 16 * s, ruleY); g.stroke();

  // --- two columns ----------------------------------------------------
  const colGap = 18 * s;
  const colW = (bw - 32 * s - colGap) / 2;
  const leftX = bx + 16 * s;
  const rightX = leftX + colW + colGap;
  const top = ruleY + 12 * s;
  const bottom = by + bh - 26 * s;

  g.save();
  g.beginPath();
  g.rect(bx + 8 * s, top - 6 * s, bw - 16 * s, bottom - top + 6 * s);
  g.clip();

  // Original: monospaced, because the layout of a ledger or a warrant is
  // part of what it is saying.
  const monoH = 10 * s;
  g.font = `${7.5 * s}px ui-monospace, Menlo, Consolas, monospace`;
  g.fillStyle = '#3f3a32';
  let ly = top - scroll;
  for (const line of doc.original) { g.fillText(line, leftX, ly); ly += monoH; }

  // Gloss: serif, plain modern English, wrapped.
  g.font = `${10 * s}px Georgia, serif`;
  g.fillStyle = P.boxInk;
  let ry = top - scroll;
  for (const para of doc.gloss) {
    if (!para) { ry += 8 * s; continue; }
    for (const l of wrapText(g, para, colW)) { g.fillText(l, rightX, ry); ry += 13 * s; }
  }
  g.restore();

  const contentH = Math.max(doc.original.length * monoH, ry + scroll - top);
  const maxScroll = Math.max(0, contentH - (bottom - top));

  // --- footer ---------------------------------------------------------
  g.font = `${7 * s}px system-ui, sans-serif`;
  g.fillStyle = P.boxDim;
  const foot = `${fidelityLabel}  ·  ${doc.cite}`;
  const footLines = wrapText(g, foot, bw - 32 * s);
  let fy = by + bh - 12 * s - footLines.length * 9 * s;
  g.beginPath(); g.moveTo(bx + 16 * s, fy - 6 * s); g.lineTo(bx + bw - 16 * s, fy - 6 * s); g.stroke();
  for (const l of footLines) { g.fillText(l, bx + 16 * s, fy); fy += 9 * s; }

  if (maxScroll > 0) {
    g.textAlign = 'right';
    g.fillStyle = P.accent;
    g.fillText(scroll < maxScroll - 1 ? '↓ more' : '↑ back to the top', bx + bw - 16 * s, by + bh - 12 * s - 9 * s);
    g.textAlign = 'left';
  }
  g.font = `${7 * s}px system-ui, sans-serif`;
  g.fillStyle = P.boxDim;
  g.fillText('X to close', bx + 16 * s, by + 12 * s + 2 * s);

  return maxScroll;
}

/** The notebook's document tab: what the player has copied down. */
function drawDocTab(g, view, s, docs, scroll, total) {
  const bx = view.x + 20 * s, by = view.y + 20 * s;
  const bw = view.w - 40 * s, bh = view.h - 40 * s;

  g.textAlign = 'left';
  g.textBaseline = 'top';
  const top = by + 46 * s;
  const bottom = by + bh - 12 * s;

  if (!docs.length) {
    g.font = `italic ${11 * s}px Georgia, serif`;
    g.fillStyle = P.boxDim;
    g.fillText('Nothing copied yet. Papers you find can be copied down.',
               bx + 18 * s, top + 6 * s);
    return 0;
  }

  g.save();
  g.beginPath();
  g.rect(bx + 8 * s, top - 4 * s, bw - 16 * s, bottom - top + 4 * s);
  g.clip();

  let y = top - scroll;
  let contentH = 0;
  for (const d of docs) {
    const blockH = 30 * s;
    if (y + blockH > top - 20 * s && y < bottom + 20 * s) {
      g.font = `600 ${11 * s}px Georgia, serif`;
      g.fillStyle = P.boxInk;
      g.fillText(d.title, bx + 32 * s, y);
      g.font = `${8.5 * s}px system-ui, sans-serif`;
      g.fillStyle = P.boxDim;
      g.fillText(`${d.date} · ${d.kind}`, bx + 32 * s, y + 14 * s);
      g.fillStyle = P.accent;
      g.fillRect(bx + 20 * s, y + 4 * s, 4 * s, 4 * s);
    }
    y += blockH;
    contentH += blockH;
  }
  g.restore();

  return Math.max(0, contentH - (bottom - top));
}

/** The two tabs across the top of the notebook. */
function drawNotebookTabs(g, view, s, tab, docCount, docTotal) {
  const bx = view.x + 20 * s, by = view.y + 20 * s;
  const labels = ['What I was told', `What I copied down   ${docCount}/${docTotal}`];
  g.font = `600 ${9 * s}px system-ui, sans-serif`;
  g.textAlign = 'left';
  g.textBaseline = 'top';
  let x = bx + 18 * s;
  const y = by + 30 * s;
  labels.forEach((label, i) => {
    const w = g.measureText(label).width;
    g.fillStyle = i === tab ? P.boxInk : P.boxDim;
    g.fillText(label, x, y);
    if (i === tab) {
      g.fillStyle = P.accent;
      g.fillRect(x, y + 13 * s, w, 2 * s);
    }
    x += w + 26 * s;
  });
}

/**
 * The closing screen. The game asks its question once, takes whatever the
 * player types, and does not respond to it.
 */
function drawAnswer(g, view, s, text, caret) {
  g.fillStyle = 'rgba(8,9,12,0.94)';
  g.fillRect(view.x, view.y, view.w, view.h);

  const bx = view.x + 26 * s, by = view.y + 26 * s;
  const bw = view.w - 52 * s, bh = view.h - 52 * s;
  panel(g, bx, by, bw, bh, s);

  g.textAlign = 'left';
  g.textBaseline = 'top';
  g.font = `700 ${17 * s}px Georgia, serif`;
  g.fillStyle = P.boxInk;
  g.fillText('What caused it?', bx + 22 * s, by + 22 * s);

  g.font = `italic ${9.5 * s}px Georgia, serif`;
  g.fillStyle = P.boxDim;
  const intro = 'Write what you think. There is no right answer and nothing here is scored. '
              + 'Use what you saw and what you were told, and say which of it you trust.';
  let iy = by + 48 * s;
  for (const l of wrapText(g, intro, bw - 44 * s)) { g.fillText(l, bx + 22 * s, iy); iy += 13 * s; }

  const fx = bx + 22 * s, fy = iy + 12 * s;
  const fw = bw - 44 * s, fh = bh - (fy - by) - 44 * s;
  g.fillStyle = 'rgba(255,255,255,0.5)';
  g.fillRect(fx, fy, fw, fh);
  g.strokeStyle = P.boxEdge;
  g.lineWidth = Math.max(1, s);
  g.strokeRect(fx, fy, fw, fh);

  g.font = `${11 * s}px Georgia, serif`;
  g.fillStyle = P.boxInk;
  let ty = fy + 10 * s;
  const lines = text ? wrapText(g, text, fw - 20 * s) : [''];
  for (const l of lines.slice(-Math.floor((fh - 20 * s) / (14 * s)))) {
    g.fillText(l, fx + 10 * s, ty); ty += 14 * s;
  }
  if (caret) {
    const last = lines[lines.length - 1] || '';
    g.fillStyle = P.accent;
    g.fillRect(fx + 10 * s + g.measureText(last).width + 1 * s, ty - 14 * s, 2 * s, 12 * s);
  }

  g.font = `${8.5 * s}px system-ui, sans-serif`;
  g.fillStyle = P.boxDim;
  g.textAlign = 'right';
  g.fillText(text.trim() ? 'Enter to finish' : 'Type your answer',
             bx + bw - 22 * s, by + bh - 24 * s);
  g.textAlign = 'left';
}

/** Title screen. */
function drawTitle(g, view, s, hasSave, index) {
  g.fillStyle = '#14161a';
  g.fillRect(view.x, view.y, view.w, view.h);

  // A cold wash from the top, like the sky over a March village.
  const grd = g.createLinearGradient(0, view.y, 0, view.y + view.h);
  grd.addColorStop(0, '#2b3138');
  grd.addColorStop(1, '#14161a');
  g.fillStyle = grd;
  g.fillRect(view.x, view.y, view.w, view.h);

  g.textAlign = 'center';
  g.textBaseline = 'middle';

  g.font = `700 ${34 * s}px Georgia, "Iowan Old Style", Palatino, serif`;
  g.fillStyle = '#e6e2d8';
  g.fillText('Salem Village', view.x + view.w / 2, view.y + view.h * 0.34);

  g.font = `italic ${30 * s}px Georgia, serif`;
  g.fillStyle = '#a8b4c4';
  g.fillText('1692', view.x + view.w / 2, view.y + view.h * 0.34 + 38 * s);

  g.font = `${12 * s}px system-ui, sans-serif`;
  g.fillStyle = '#7e858e';
  g.fillText('Walk. Talk to people. Notice things.',
             view.x + view.w / 2, view.y + view.h * 0.34 + 74 * s);

  const items = hasSave ? ['Continue', 'Begin again'] : ['Begin'];
  items.forEach((label, i) => {
    const y = view.y + view.h * 0.68 + i * 30 * s;
    g.font = `${i === index ? '700 ' : ''}${15 * s}px Georgia, serif`;
    g.fillStyle = i === index ? '#efeade' : '#79808a';
    g.fillText(label, view.x + view.w / 2, y);
    if (i === index) {
      g.fillStyle = P.accent;
      g.fillRect(view.x + view.w / 2 - g.measureText(label).width / 2, y + 13 * s,
                 g.measureText(label).width, 2 * s);
    }
  });

  g.font = `${10 * s}px system-ui, sans-serif`;
  g.fillStyle = '#5c626b';
  g.fillText('Arrow keys or WASD to move  ·  Z / Space to talk  ·  N for notebook',
             view.x + view.w / 2, view.y + view.h - 22 * s);
}

/* ===== src/main.js ===== */
// Salem Village, 1692 — game loop.
//
// Chapter one of three: March 1692. Nothing has happened yet.














const MOVE_TIME = 0.16;      // seconds per tile
const REVEAL_CPS = 55;       // typewriter speed

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.g = canvas.getContext('2d');

    // World renders into a fixed 320x240 buffer and is scaled up with
    // nearest-neighbour; UI draws afterwards at full resolution.
    this.buf = document.createElement('canvas');
    this.buf.width = VIEW_W;
    this.buf.height = VIEW_H;
    this.bg = this.buf.getContext('2d');
    this.bg.imageSmoothingEnabled = false;

    this.input = new Input();
    this.audio = new Audio();
    this.state = new GameState();
    this.runner = new DialogueRunner(this.state);

    this.mode = 'title';
    this.titleIndex = 0;
    this.maps = {};
    this.portraits = new Map();
    this.toast = { text: '', t: 0 };
    this.notebookScroll = 0;
    this.docScroll = 0;
    this.notebookTab = 0;
    this.convNpc = null;
    this.objFlash = 0;
    this.lastStepId = null;
    this.reader = null;         // the document currently open
    this.answerText = '';

    initArt();
    this.playerFrames = buildActor(PLAYER_SPEC);

    this.player = {
      map: 'memorial', tx: 13, ty: 25, px: 13 * TS, py: 25 * TS,
      dir: 'down', dirIndex: DIR_INDEX.down, moving: false, t: 0,
      fromX: 0, fromY: 0, steps: 0, animFrame: 0,
      frames: this.playerFrames,
    };

    this.saved = GameState.load();
    this.resize();
    addEventListener('resize', () => this.resize());
    // The canvas sits in an aspect-ratio box, so its size can change without
    // the window changing at all — notably when embedded in a host page that
    // resizes the frame after load.
    if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(canvas);
  }

  /* ---------------- setup ---------------- */

  /** Ambience is chosen by era and by whether you are under a roof. */
  syncAmbience() {
    const m = this.mapFor(this.player.map);
    this.audio.setAmbience(m.indoor ? 'indoor' : (m.era === 'present' ? 'present' : '1692'));
  }

  mapFor(id, chapter = this.state.chapter) {
    const key = `${id}:${chapter}`;
    if (!this.maps[key]) {
      const m = buildMap(MAPS[id], chapter);
      m.actors = (m.def.byChapter && m.def.byChapter[chapter] && m.def.byChapter[chapter].npcs !== undefined
        ? m.def.byChapter[chapter].npcs
        : (MAPS[id].npcs || [])).map((n) => this.makeNpc(n));
      this.maps[key] = m;
    }
    return this.maps[key];
  }

  makeNpc(placement) {
    const def = NPCS[placement.id];
    if (!def) throw new Error(`unknown npc: ${placement.id}`);
    return {
      id: def.id, def, name: def.name,
      tx: placement.x, ty: placement.y,
      px: placement.x * TS, py: placement.y * TS,
      dir: placement.dir || 'down',
      dirIndex: DIR_INDEX[placement.dir || 'down'],
      homeDir: placement.dir || 'down',
      animFrame: 0, moving: false,
      frames: buildActor(def.spec),
    };
  }

  portraitFor(npcId) {
    if (!this.portraits.has(npcId)) {
      const def = NPCS[npcId];
      this.portraits.set(npcId, def ? buildPortrait(def.spec, 'neutral') : null);
    }
    return this.portraits.get(npcId);
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = this.canvas.clientWidth, H = this.canvas.clientHeight;
    this.canvas.width = Math.round(W * dpr);
    this.canvas.height = Math.round(H * dpr);
    this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.g.imageSmoothingEnabled = false;

    // Integer scale keeps the pixel art honest.
    this.scale = Math.max(1, Math.floor(Math.min(W / VIEW_W, H / VIEW_H)));
    const vw = VIEW_W * this.scale, vh = VIEW_H * this.scale;
    this.view = { x: Math.round((W - vw) / 2), y: Math.round((H - vh) / 2), w: vw, h: vh };
  }

  /* ---------------- lifecycle ---------------- */

  begin(fresh) {
    if (!fresh && this.saved) {
      this.state = this.saved.state;
      this.runner = new DialogueRunner(this.state);
      const p = this.saved.player;
      if (p && MAPS[p.map]) {
        this.player.map = p.map;
        this.setTile(p.x, p.y);
        this.player.dir = p.dir || 'down';
        this.player.dirIndex = DIR_INDEX[this.player.dir];
      }
    } else {
      GameState.clear();
      this.state = new GameState();
      this.runner = new DialogueRunner(this.state);
      this.player.map = 'memorial';
      this.setTile(13, 25);
      this.player.dir = 'up';
      this.player.dirIndex = DIR_INDEX.up;
    }
    this.mode = 'play';
    this.state.visited.add(this.player.map);
    this.lastStepId = (currentStep(this.state) || {}).id || null;
    this.syncAmbience();
    this.openingBeat();
  }

  openingBeat() {
    // Deliberately almost nothing. The game opens on a street in Salem in
    // the present day, and the memorial itself does the framing — the
    // threshold stones, twenty benches, and a bored seventeen-year-old.
    // The one thing worth saying out loud is the rule the whole game runs
    // on, and even that waits until the player has stepped into 1692.
    this.startScript([
      { say: 'Arrow keys or WASD to walk. Z to look at things and to talk. N for your notebook.', who: null },
    ], null);
  }

  setTile(x, y) {
    const p = this.player;
    p.tx = x; p.ty = y; p.px = x * TS; p.py = y * TS;
    p.moving = false; p.t = 0;
  }

  save() { this.state.save(this.player); }

  /* ---------------- dialogue plumbing ---------------- */

  startScript(script, speaker, onEnd = null) {
    this.mode = 'dialogue';
    this.choiceIndex = 0;
    this.runner.start(script, speaker, onEnd || (() => { this.endConversation(); }));
    this.syncDialogue();
  }

  talkTo(npc) {
    this.convNpc = npc;
    // Face the player.
    const p = this.player;
    npc.dir = p.ty < npc.ty ? 'up' : p.ty > npc.ty ? 'down' : p.tx < npc.tx ? 'left' : 'right';
    npc.dirIndex = DIR_INDEX[npc.dir];

    const speaker = { id: npc.id, name: npc.name, spec: npc.def.spec };
    this.mode = 'dialogue';
    this.choiceIndex = 0;
    this.runner.start(npc.def.greet || [], speaker, () => {
      this.state.markSpoke(npc.id);
      // Ambient villagers have no topics — they say their piece and go back
      // to work. Showing them a menu with one "say nothing more" option in
      // it would be worse than showing them nothing.
      if (!npc.def.topics || !npc.def.topics.length) { this.endConversation(); return; }
      this.openTopics();
    });
    this.syncDialogue();
  }

  openTopics() {
    const npc = this.convNpc;
    if (!npc) { this.endConversation(); return; }
    const options = buildTopicMenu(npc.def, this.state);
    const speaker = { id: npc.id, name: npc.name, spec: npc.def.spec };
    this.choiceIndex = 0;
    this.runner.start([{ choice: options }], speaker, () => {
      // The last option is always "say nothing more".
      const wasFarewell = this.runner.lastChoiceIndex === this.runner.lastChoiceCount - 1;
      if (wasFarewell) this.endConversation();
      else this.openTopics();
    });
    this.syncDialogue();
  }

  endConversation() {
    const npc = this.convNpc;
    if (npc) { npc.dir = npc.homeDir; npc.dirIndex = DIR_INDEX[npc.homeDir]; }
    this.convNpc = null;
    this.mode = 'play';
    this.dlg = null;
    this.save();
  }

  /** Rebuild the paginated view whenever the runner produces a new line. */
  syncDialogue() {
    const cur = this.runner.current;
    if (!cur) { this.dlg = null; return; }
    if (cur.type === 'choice') { this.dlg = null; this.choiceIndex = 0; return; }

    const portrait = cur.speaker ? this.portraitFor(cur.speaker.id) : null;
    // Stable per-speaker pitch, derived from the id so it never drifts.
    const id = cur.speaker ? cur.speaker.id : '';
    let hsum = 0; for (let i = 0; i < id.length; i++) hsum = (hsum * 31 + id.charCodeAt(i)) >>> 0;
    const pitch = id ? 0.8 + ((hsum % 70) / 100) : 0.62;
    const L = dialogueLayout(this.g, this.view, this.scale, cur.text, !!portrait);
    this.dlg = {
      who: cur.who || '',
      portrait,
      pitch,
      layout: L,
      pages: L.pages,
      page: 0,
      revealed: 0,
      total: L.pages[0].join(' ').length,
    };
  }

  advanceDialogue() {
    const d = this.dlg;
    if (!d) return;
    if (d.revealed < d.total) { d.revealed = d.total; return; }
    if (d.page < d.pages.length - 1) {
      d.page += 1;
      d.revealed = 0;
      d.total = d.pages[d.page].join(' ').length;
      return;
    }
    this.runner.advance();
    this.syncDialogue();
  }

  /* ---------------- interaction ---------------- */

  facingTile() {
    const [dx, dy] = DIR_VEC[this.player.dir];
    return [this.player.tx + dx, this.player.ty + dy];
  }

  interact() {
    const map = this.mapFor(this.player.map);
    const [dx, dy] = DIR_VEC[this.player.dir];
    let [fx, fy] = this.facingTile();

    let npc = map.actors.find((a) => a.tx === fx && a.ty === fy);
    // Speak through a grate. The jail scene is a conversation held through
    // iron bars, so interaction reaches one tile further when the thing in
    // the way is something you can talk through.
    if (!npc && map.talkThrough.has(`${fx},${fy}`)) {
      const bx = fx + dx, by = fy + dy;
      npc = map.actors.find((a) => a.tx === bx && a.ty === by);
      if (npc) { this.talkTo(npc); return; }
      fx = bx; fy = by;
    }
    if (npc) { this.talkTo(npc); return; }

    const spot = interactAt(map, fx, fy);
    if (!spot) return;

    // A document. Knowledge-gated exactly like a conversation topic: you
    // cannot read Parris's contract until you have counted his woodpile.
    if (spot.doc) {
      if (spot.require && !this.state.knowsAll(spot.require)) {
        this.startScript([{ say: spot.locked || 'Not yet.', who: null }], null, () => {
          this.mode = 'play'; this.dlg = null;
        });
        return;
      }
      this.openReader(spot.doc);
      return;
    }
    // Memorial benches are generated from their inscription data rather than
    // hand-written twenty times over.
    const script = spot.bench ? benchScript(spot.bench) : CLUES[spot.id];
    if (!script) return;

    const before = this.state.flags.size;
    this.startScript(script, null, () => {
      this.mode = 'play';
      this.dlg = null;
      if (this.state.flags.size > before) this.showToast('Noted in your notebook');
      this.save();
    });
  }

  showToast(text) { this.toast = { text, t: 2.6 }; this.audio.noted(); }

  openReader(id) {
    const doc = DOCUMENTS[id];
    if (!doc) return;
    this.reader = doc;
    this.docScroll = 0;
    this.mode = 'reader';
    this.audio.menuPick();
  }

  /** Watch for a completed objective so it can be announced once. */
  checkObjective() {
    const step = currentStep(this.state);
    const id = step ? step.id : '__done__';
    if (this.lastStepId !== null && id !== this.lastStepId) {
      this.objFlash = 1.1;
      this.audio.objective();
    }
    this.lastStepId = id;
  }

  /* ---------------- movement ---------------- */

  tryStep(dir) {
    const p = this.player;
    const map = this.mapFor(p.map);
    p.dir = dir;
    p.dirIndex = DIR_INDEX[dir];

    const [dx, dy] = DIR_VEC[dir];
    const nx = p.tx + dx, ny = p.ty + dy;
    if (isSolid(map, nx, ny, map.actors)) return;

    p.fromX = p.tx; p.fromY = p.ty;
    p.tx = nx; p.ty = ny;
    p.moving = true; p.t = 0;
  }

  arrive() {
    const p = this.player;
    p.steps += 1;
    p.animFrame = [0, 1, 0, 2][p.steps % 4];
    const map = this.mapFor(p.map);
    this.audio.step(terrainAt(map, p.tx, p.ty));

    const w = warpAt(map, p.tx, p.ty);
    if (w) {
      const blocked = this.warpBlocked(w);
      if (blocked) {
        // Step back off it and say what is still missing.
        this.setTile(p.fromX, p.fromY);
        this.startScript([
          { say: 'Not yet. There is something here you have not done.', who: null },
          { say: blocked, who: null },
        ], null, () => { this.mode = 'play'; this.dlg = null; });
        return;
      }
      this.doWarp(w);
      return;
    }

    const t = triggerAt(map, p.tx, p.ty);
    if (t && !this.state.knows(`fired.${map.id}.${t.id}`)) {
      this.state.learn(`fired.${map.id}.${t.id}`, 'observed');
      if (CLUES[t.id]) {
        this.startScript(CLUES[t.id], null, () => {
          this.mode = 'play'; this.dlg = null;
          this.showToast('Noted in your notebook');
          this.save();
        });
      }
    }
  }

  /** A gated exit will not open until the chapter has actually been done. */
  warpBlocked(w) {
    if (!w.gate) return null;
    if (chapterComplete(this.state, w.gate)) return null;
    const left = remainingIn(this.state, w.gate);
    return left.length ? left[0].text : null;
  }

  doWarp(w) {
    const p = this.player;
    if (w.setChapter) {
      this.state.chapter = w.setChapter;
      this.lastStepId = (currentStep(this.state) || {}).id || null;
    }
    p.map = w.to;
    this.state.visited.add(w.to);
    this.setTile(w.tx, w.ty);
    p.dir = w.dir || 'down';
    p.dirIndex = DIR_INDEX[p.dir];
    this.mapFor(w.to);
    this.fade = 0.28;
    this.syncAmbience();
    if (w.script === 'arrive1692') this.audio.timeShift(); else this.audio.door();
    this.save();

    // A warp can carry its own arrival beat. Only one does: the gap in the
    // memorial wall, which is where the player crosses three centuries and
    // the game declines to explain how.
    if (w.script && CLUES[w.script] && !this.state.knows(`fired.warp.${w.script}`)) {
      this.state.learn(`fired.warp.${w.script}`, 'observed');
      this.startScript(CLUES[w.script], null, () => {
        this.mode = 'play';
        this.dlg = null;
        this.save();
      });
    }
  }

  /* ---------------- update ---------------- */

  update(dt) {
    const inp = this.input;

    if (this.toast.t > 0) this.toast.t -= dt;
    if (this.objFlash > 0) this.objFlash = Math.max(0, this.objFlash - dt);
    if (this.fade > 0) this.fade = Math.max(0, this.fade - dt);

    // Browsers require a gesture before audio; this is the first one.
    if (inp.justPressed('confirm') || inp.direction()) this.audio.unlock();
    if (this.mode !== 'title') this.checkObjective();

    if (this.mode === 'title') {
      const items = this.saved ? 2 : 1;
      if (inp.justPressed('up')) { this.titleIndex = (this.titleIndex + items - 1) % items; this.audio.menuMove(); }
      if (inp.justPressed('down')) { this.titleIndex = (this.titleIndex + 1) % items; this.audio.menuMove(); }
      if (inp.justPressed('confirm')) {
        this.audio.unlock();
        this.audio.menuPick();
        this.begin(!this.saved ? true : this.titleIndex === 1);
      }
      return;
    }

    if (this.mode === 'reader') {
      if (inp.justPressed('cancel') || inp.justPressed('notebook')) {
        this.mode = 'play'; this.reader = null; return;
      }
      if (inp.justPressed('confirm')) {
        if (this.state.copyDoc(this.reader.id)) {
          this.showToast('Copied into your notebook');
          this.save();
        } else {
          this.mode = 'play'; this.reader = null;
        }
        return;
      }
      if (inp.isDown('down')) this.docScroll += 320 * dt;
      if (inp.isDown('up')) this.docScroll -= 320 * dt;
      this.docScroll = Math.max(0, Math.min(this.docScroll, this.docMax || 0));
      return;
    }

    if (this.mode === 'answer') return;   // driven by a DOM keydown handler

    if (this.mode === 'notebook') {
      if (inp.justPressed('cancel') || inp.justPressed('notebook')) this.mode = 'play';
      if (inp.justPressed('left') || inp.justPressed('right')) {
        this.notebookTab = 1 - this.notebookTab;
        this.notebookScroll = 0;
        this.audio.menuMove();
      }
      if (inp.isDown('down')) this.notebookScroll += 300 * dt;
      if (inp.isDown('up')) this.notebookScroll -= 300 * dt;
      // maxScroll comes back from the last draw, so clamp against that.
      this.notebookScroll = Math.max(0, Math.min(this.notebookScroll, this.notebookMax || 0));
      return;
    }

    // Reaching the reckoning's final step opens the closing screen.
    if (this.mode === 'play' && this.state.chapter === 'reckoning'
        && !this.state.answer && chapterComplete(this.state, 'reckoning')) {
      this.openAnswer();
      return;
    }

    if (this.mode === 'dialogue') {
      const cur = this.runner.current;
      if (cur && cur.type === 'choice') {
        const n = cur.options.length;
        if (inp.justPressed('up')) { this.choiceIndex = (this.choiceIndex + n - 1) % n; this.audio.menuMove(); }
        if (inp.justPressed('down')) { this.choiceIndex = (this.choiceIndex + 1) % n; this.audio.menuMove(); }
        if (inp.justPressed('confirm')) {
          this.audio.menuPick();
          this.runner.choose(this.choiceIndex);
          this.syncDialogue();
        } else if (inp.justPressed('cancel')) {
          // Backing out picks "say nothing more" — always the last option —
          // so a player can leave a conversation without hunting for it.
          this.runner.choose(n - 1);
          this.syncDialogue();
        }
        return;
      }
      if (this.dlg) {
        if (this.dlg.revealed < this.dlg.total) {
          const before = Math.floor(this.dlg.revealed);
          this.dlg.revealed += REVEAL_CPS * dt;
          // A blip every few characters, pitched per speaker so the cast
          // sound different from each other and from narration.
          const after = Math.floor(this.dlg.revealed);
          if (Math.floor(after / 3) !== Math.floor(before / 3)) this.audio.blip(this.dlg.pitch);
        }
        if (inp.justPressed('confirm')) this.advanceDialogue();
      }
      return;
    }

    // ---- play ----
    if (inp.justPressed('notebook')) { this.mode = 'notebook'; this.notebookScroll = 0; return; }
    if (inp.justPressed('confirm')) { this.interact(); return; }

    const p = this.player;
    if (p.moving) {
      p.t += dt / MOVE_TIME;
      if (p.t >= 1) {
        p.t = 0; p.moving = false;
        p.px = p.tx * TS; p.py = p.ty * TS;
        this.arrive();
      } else {
        p.px = (p.fromX + (p.tx - p.fromX) * p.t) * TS;
        p.py = (p.fromY + (p.ty - p.fromY) * p.t) * TS;
        // Two-step walk cycle within the tile.
        p.animFrame = [0, 1, 0, 2][(p.steps + (p.t > 0.5 ? 1 : 0)) % 4];
      }
    } else {
      const dir = inp.direction();
      if (dir) this.tryStep(dir);
      else p.animFrame = 0;
    }
  }

  /* ---------------- draw ---------------- */

  draw() {
    const g = this.g, v = this.view, s = this.scale;
    const W = this.canvas.clientWidth, H = this.canvas.clientHeight;

    g.fillStyle = '#0b0c0e';
    g.fillRect(0, 0, W, H);

    if (this.mode === 'title') { drawTitle(g, v, s, !!this.saved, this.titleIndex); return; }

    const map = this.mapFor(this.player.map);
    const cam = computeCamera(map, this.player.px, this.player.py);
    const actors = [this.player, ...map.actors];
    renderMap(this.bg, map, cam, actors);

    g.imageSmoothingEnabled = false;
    g.drawImage(this.buf, v.x, v.y, v.w, v.h);

    if (this.fade > 0) {
      g.fillStyle = `rgba(8,8,12,${(this.fade / 0.28) * 0.85})`;
      g.fillRect(v.x, v.y, v.w, v.h);
    }

    // Place name, top-left.
    g.font = `600 ${10 * s}px system-ui, sans-serif`;
    g.textAlign = 'left';
    g.textBaseline = 'top';
    g.fillStyle = 'rgba(12,12,16,0.6)';
    const label = map.name;
    const lw = g.measureText(label).width + 16 * s;
    g.fillRect(v.x + 8 * s, v.y + 8 * s, lw, 18 * s);
    g.fillStyle = '#d8d4c8';
    g.fillText(label, v.x + 16 * s, v.y + 13 * s);

    // Objective HUD, above everything except the notebook.
    if (this.mode !== 'notebook') {
      drawObjective(g, v, s, {
        step: currentStep(this.state),
        standing: STANDING.active(this.state) ? STANDING.text : null,
        progress: progress(this.state),
        flash: this.objFlash,
      });
    }

    const cur = this.runner.current;
    if (this.mode === 'dialogue' && cur) {
      if (cur.type === 'choice') {
        drawChoices(g, v, s, cur.options, this.choiceIndex);
      } else if (this.dlg) {
        const d = this.dlg;
        drawDialogue(g, v, s, d.layout, {
          who: d.who,
          portrait: d.portrait,
          page: d.pages[d.page],
          revealed: Math.floor(d.revealed),
          done: d.revealed >= d.total,
          more: d.page < d.pages.length - 1,
        });
      }
    }

    if (this.mode === 'notebook') {
      if (this.notebookTab === 0) {
        this.notebookMax = drawNotebook(
          g, v, s, notebookEntries(this.state), this.notebookScroll, sourceName) || 0;
      } else {
        // Draw the shell, then the document list in place of the entries.
        drawNotebook(g, v, s, [], 0, sourceName);
        const docs = this.state.docLog().map((d) => DOCUMENTS[d.id]).filter(Boolean);
        this.notebookMax = drawDocTab(g, v, s, docs, this.notebookScroll, DOC_COUNT) || 0;
      }
      drawNotebookTabs(g, v, s, this.notebookTab, this.state.docs.size, DOC_COUNT);
    }

    if (this.mode === 'reader' && this.reader) {
      this.docMax = drawReader(g, v, s, this.reader,
        FIDELITY_LABEL[this.reader.fidelity] || '', this.docScroll,
        this.state.hasDoc(this.reader.id)) || 0;
    }

    if (this.mode === 'answer') {
      drawAnswer(g, v, s, this.answerText, (Date.now() % 1000) < 500);
    }

    if (this.toast.t > 0) drawToast(g, v, s, this.toast.text, Math.min(1, this.toast.t));
  }

  openAnswer() {
    this.mode = 'answer';
    this.answerText = this.state.answer || '';
  }

  submitAnswer() {
    this.state.answer = this.answerText.trim();
    this.save();
    this.mode = 'dialogue';
    this.startScript([
      { say: 'Written down.', who: null },
      { say: 'Nothing here is going to tell you whether you are right. Historians have been arguing about this for three hundred and thirty years and they have not finished.', who: null },
      { say: 'What you can do is show your working.', who: null },
      { say: 'Press "Copy my notes" below. Everything you saw, everyone who told you something, every paper you copied, and what you just wrote — as plain text you can paste anywhere.', who: null },
      { say: 'Twenty benches. Charter Street. Any time you like.', who: null },
    ], null, () => { this.mode = 'play'; this.dlg = null; });
  }

  /* ---------------- export ---------------- */

  /**
   * The exit artifact. Plain text the student can paste into an assignment.
   * Scoped to general US History rather than the AP rubric: a claim, the
   * evidence they actually gathered, and where each piece came from.
   */
  exportNotes() {
    const entries = notebookEntries(this.state);
    const lines = [
      'SALEM VILLAGE, 1692',
      '',
    ];
    if (this.state.answer) {
      lines.push('MY ANSWER — what caused it?', '', this.state.answer, '',
                 '---------------------------------------------', '');
    }
    lines.push('WHAT I SAW AND WAS TOLD', '');
    if (!entries.length) {
      lines.push('(Nothing recorded yet.)');
    } else {
      entries.forEach((e, i) => {
        lines.push(`${i + 1}. ${e.text}`);
        lines.push(`   [${sourceName(e.source)}]`);
        lines.push('');
      });
    }

    const docs = this.state.docLog().map((d) => DOCUMENTS[d.id]).filter(Boolean);
    if (docs.length) {
      lines.push('---------------------------------------------', '');
      lines.push(`DOCUMENTS I COPIED  (${docs.length}/${DOC_COUNT})`, '');
      docs.forEach((d, i) => {
        lines.push(`${i + 1}. ${d.title} (${d.date})`);
        lines.push(`   ${d.note}`);
        lines.push(`   Source: ${d.cite}`);
        lines.push(`   [${FIDELITY_LABEL[d.fidelity]}]`);
        lines.push('');
      });
    }

    if (!this.state.answer) {
      lines.push('---------------------------------------------');
      lines.push('Question to answer: what caused this? Weigh the causes against');
      lines.push('each other and use the evidence above. Say which source you trust');
      lines.push('for each claim, and why.');
    }
    return lines.join('\n');
  }
}

/* ---------------------------------------------------------------------- *
 * Boot
 * ---------------------------------------------------------------------- */

const canvas = document.getElementById('screen');
const game = new Game(canvas);
window.__salem = game;   // handy in a console during development

const pad = document.getElementById('touch');
if (pad) {
  game.input.bindTouch(pad);
  if (!matchMedia('(pointer: coarse)').matches) pad.classList.add('hidden');
}

document.getElementById('copy')?.addEventListener('click', async (e) => {
  const text = game.exportNotes();
  try {
    await navigator.clipboard.writeText(text);
    e.target.textContent = 'Copied';
  } catch {
    // Clipboard is frequently blocked on managed school profiles; fall back
    // to something the student can select by hand rather than failing.
    const ta = document.getElementById('fallback');
    ta.value = text;
    ta.classList.remove('hidden');
    ta.select();
    e.target.textContent = 'Select and copy';
  }
  setTimeout(() => { e.target.textContent = 'Copy my notes'; }, 2500);
});

const soundBtn = document.getElementById('sound');
function paintSoundBtn() {
  if (soundBtn) soundBtn.textContent = game.audio.muted ? 'Sound: off' : 'Sound: on';
}
paintSoundBtn();
soundBtn?.addEventListener('click', () => {
  game.audio.unlock();
  game.audio.toggleMute();
  paintSoundBtn();
  canvas.focus();
});

document.getElementById('reset')?.addEventListener('click', () => {
  if (!confirm('Erase your saved progress and start again?')) return;
  GameState.clear();
  location.reload();
});

// The closing screen takes free text, so it needs a real key handler rather
// than the game's four-button input model.
addEventListener('keydown', (e) => {
  if (game.mode !== 'answer') return;
  if (e.key === 'Enter') {
    if (game.answerText.trim()) { e.preventDefault(); game.submitAnswer(); }
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); game.answerText = game.answerText.slice(0, -1); return; }
  if (e.key.length === 1 && game.answerText.length < 1200) {
    e.preventDefault();
    game.answerText += e.key;
  }
}, true);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  game.update(dt);
  game.draw();
  game.input.endFrame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body>
