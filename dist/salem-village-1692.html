  /** Evaluate a gate object. Missing keys always pass. */
  test(cond) {
    if (!cond) return true;
    const s = this.state;
    if (cond.require && !s.knowsAll(cond.require)) return false;
    if (cond.knows && !s.knowsAll(cond.knows)) return false;
    if (cond.notKnows && !s.knowsNone(cond.notKnows)) return false;
    if (cond.hide && s.knowsAll(cond.hide)) return false;
    if (cond.spokenTo && !cond.spokenTo.every((id) => s.hasSpokenTo(id))) return false;
    if (cond.notSpokenTo && cond.notSpokenTo.some((id) => s.hasSpokenTo(id))) return false;
    if (cond.chapter && s.chapter !== cond.chapter) return false;
    if (typeof cond.when === 'function' && !cond.when(s)) return false;
    return true;
  }

  finish() {
    this.current = null;
    this.stack.length = 0;
    const cb = this.onEnd;
    this.onEnd = null;
    if (cb) cb();
  }
}

/**
 * Build the topic menu for an NPC out of whatever the player currently
 * knows. Topics the player has no business asking about simply are not
 * listed — the design doc is firm that gating is by knowledge, and that an
 * unavailable topic should be invisible rather than greyed out. A visible
 * locked option tells the player there is a checklist; an absent one lets
 * them discover there was something to ask.
 */
function buildTopicMenu(npc, state) {
  const runner = { test: DialogueRunner.prototype.test, state };
  const available = (npc.topics || []).filter((t) => {
    // Asked topics drop off the list by default. Two reasons: the shrinking
    // menu shows the player what they have not raised yet, and it guarantees
    // a conversation terminates — otherwise a player holding the confirm key
    // re-picks the first topic forever and can never get out.
    if (!t.repeatable && state.knows(`asked.${npc.id}.${t.id}`)) return false;
    return DialogueRunner.prototype.test.call(runner, t);
  });

  const options = available.map((t) => ({
    label: t.label,
    then: [
      { learn: `asked.${npc.id}.${t.id}`, source: npc.id },
      ...t.lines,
    ],
  }));

  options.push({ label: 'Say nothing more.', then: npc.farewell || [] });
  return options;
}

/* ===== src/engine/input.js ===== */
// Input. Keyboard first, with a touch d-pad that only appears if the device
// actually reports touch — school Chromebooks are frequently touchscreens,
// and a kid on a 2-in-1 should not have to find the keyboard.

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'confirm', Space: 'confirm', Enter: 'confirm',
  KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel',
  KeyN: 'notebook', Tab: 'notebook',
};
class Input {
  constructor() {
    this.held = new Set();
    this.pressed = new Set();   // cleared once per frame after being read

    addEventListener('keydown', (e) => {
      const a = KEYMAP[e.code];
      if (!a) return;
      // Stop the page scrolling out from under the game.
      e.preventDefault();
      if (!this.held.has(a)) this.pressed.add(a);
      this.held.add(a);
    });

    addEventListener('keyup', (e) => {
      const a = KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      this.held.delete(a);
    });

    // Losing focus mid-walk should not leave a direction stuck down.
    addEventListener('blur', () => { this.held.clear(); });
  }

  /** Bind on-screen buttons. Each element carries data-act="up|confirm|...". */
  bindTouch(root) {
    const press = (a) => { if (!this.held.has(a)) this.pressed.add(a); this.held.add(a); };
    const release = (a) => this.held.delete(a);

    for (const el of root.querySelectorAll('[data-act]')) {
      const a = el.dataset.act;
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(a); });
      el.addEventListener('pointerup', (e) => { e.preventDefault(); release(a); });
      el.addEventListener('pointercancel', () => release(a));
      el.addEventListener('lostpointercapture', () => release(a));
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    }
  }

  isDown(a) { return this.held.has(a); }

  /** True once per physical press. */
  justPressed(a) { return this.pressed.has(a); }

  /** Call at the end of each frame. */
  endFrame() { this.pressed.clear(); }

  /** The direction currently being requested, or null. */
  direction() {
    if (this.held.has('up')) return 'up';
    if (this.held.has('down')) return 'down';
    if (this.held.has('left')) return 'left';
    if (this.held.has('right')) return 'right';
    return null;
  }
}

/* ===== src/engine/audio.js ===== */
// Sound, synthesised at runtime.
//
// No audio files. Everything here is generated with the Web Audio API, for
// the same reason the art is drawn in code: the game has to survive being a
// single HTML file on a filtered school network, and a blocked .mp3 is a
// silent game with no error message.
//
// Two rules that matter in a classroom:
//   - Nothing plays until the player presses a key. Browsers require a
//     gesture before audio anyway, and a game that starts making noise in a
//     room of thirty Chromebooks is a game a teacher turns off.
//   - The mute state is remembered. One toggle, honoured forever.

const MUTE_KEY = 'salem1692.muted';
class Audio {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.ambientGain = null;
    this.ambient = null;        // { nodes: [], name }
    this.muted = false;
    try { this.muted = localStorage.getItem(MUTE_KEY) === '1'; } catch { /* private mode */ }
    this.pendingAmbience = null;
  }

  /** Called from the first real input event. Safe to call repeatedly. */
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = 0.35;
    this.ambientGain.connect(this.master);
    if (this.pendingAmbience) {
      const a = this.pendingAmbience;
      this.pendingAmbience = null;
      this.setAmbience(a);
    }
  }

  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch { /* nothing to do */ }
    if (this.master) {
      this.master.gain.setTargetAtTime(m ? 0 : 0.5, this.ctx.currentTime, 0.05);
    }
  }

  toggleMute() { this.setMuted(!this.muted); return this.muted; }

  /* ---- building blocks ------------------------------------------------ */

  /** A short buffer of white noise, reused for every noise-based voice. */
  noiseBuffer(seconds = 2) {
    if (this._noise && this._noiseLen >= seconds) return this._noise;
    const n = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf; this._noiseLen = seconds;
    return buf;
  }

  /** One short tone. */
  tone({ freq = 440, type = 'square', dur = 0.06, gain = 0.15, slide = 0, delay = 0 }) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  /** A filtered burst of noise — footsteps, thumps, wind gusts. */
  burst({ dur = 0.08, gain = 0.12, freq = 900, q = 1, type = 'bandpass', delay = 0 }) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer();
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  /* ---- one-shots ------------------------------------------------------ */

  step(terrain) {
    // Different ground, different footstep. Small detail, but it is the
    // sound the player hears more than any other.
    const kinds = {
      mud:    { freq: 420, dur: 0.07, gain: 0.055, q: 0.8 },
      grass:  { freq: 1500, dur: 0.05, gain: 0.035, q: 0.7 },
      lawn:   { freq: 1600, dur: 0.05, gain: 0.035, q: 0.7 },
      snow:   { freq: 2400, dur: 0.06, gain: 0.04, q: 0.9 },
      floor:  { freq: 260, dur: 0.06, gain: 0.06, q: 2.5 },
      paving: { freq: 1100, dur: 0.04, gain: 0.05, q: 3 },
      brick:  { freq: 950, dur: 0.04, gain: 0.05, q: 3 },
      asphalt:{ freq: 700, dur: 0.05, gain: 0.045, q: 1.5 },
    };
    const k = kinds[terrain] || kinds.grass;
    this.burst({ ...k, freq: k.freq * (0.9 + Math.random() * 0.2) });
  }

  /** The text-advance blip. Pitched per speaker so voices feel distinct. */
  blip(pitch = 1) {
    this.tone({ freq: 300 * pitch, type: 'square', dur: 0.028, gain: 0.045, slide: 40 });
  }

  menuMove() { this.tone({ freq: 520, type: 'triangle', dur: 0.05, gain: 0.07 }); }
  menuPick() {
    this.tone({ freq: 620, type: 'triangle', dur: 0.05, gain: 0.08 });
    this.tone({ freq: 930, type: 'triangle', dur: 0.07, gain: 0.06, delay: 0.05 });
  }

  /** Something went into the notebook. */
  noted() {
    this.tone({ freq: 740, type: 'sine', dur: 0.10, gain: 0.09 });
    this.tone({ freq: 1108, type: 'sine', dur: 0.14, gain: 0.07, delay: 0.08 });
  }

  /** An objective completed. Deliberately warmer than `noted`. */
  objective() {
    this.tone({ freq: 587, type: 'triangle', dur: 0.09, gain: 0.08 });
    this.tone({ freq: 784, type: 'triangle', dur: 0.09, gain: 0.08, delay: 0.07 });
    this.tone({ freq: 1175, type: 'triangle', dur: 0.20, gain: 0.07, delay: 0.14 });
  }

  door() { this.burst({ freq: 220, dur: 0.16, gain: 0.10, q: 1.2 }); }

  /** Crossing three centuries. Low, wrong-footed, and over quickly. */
  timeShift() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 1.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 1.8);
    this.burst({ freq: 200, dur: 1.4, gain: 0.05, q: 0.6, type: 'lowpass' });
  }

  /* ---- ambience ------------------------------------------------------- */

  /**
   * A continuous bed per era. 1692 is wind and, occasionally, a crow. The
   * present is traffic. The difference is doing the same job as the palette
   * shift: you should know what century you are in with your eyes shut.
   */
  setAmbience(name) {
    if (!this.ctx) { this.pendingAmbience = name; return; }
    if (this.ambient && this.ambient.name === name) return;
    this.stopAmbience();
    if (!name) return;

    const t = this.ctx.currentTime;
    const nodes = [];
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(4);
    src.loop = true;

    const filt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);

    if (name === 'present') {
      // Distant traffic: low rumble, very little movement.
      filt.type = 'lowpass'; filt.frequency.value = 260; filt.Q.value = 0.6;
      g.gain.linearRampToValueAtTime(0.30, t + 1.5);
    } else if (name === 'indoor') {
      filt.type = 'lowpass'; filt.frequency.value = 150; filt.Q.value = 0.5;
      g.gain.linearRampToValueAtTime(0.14, t + 1.2);
    } else {
      // Open ground in March: wind, with slow gusts.
      filt.type = 'bandpass'; filt.frequency.value = 480; filt.Q.value = 0.5;
      g.gain.linearRampToValueAtTime(0.22, t + 1.5);
      const lfo = this.ctx.createOscillator();
      const lfoGain = this.ctx.createGain();
      lfo.frequency.value = 0.09;
      lfoGain.gain.value = 260;
      lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
      lfo.start(t); nodes.push(lfo, lfoGain);
    }

    src.connect(filt); filt.connect(g); g.connect(this.ambientGain);
    src.start(t);
    nodes.push(src, filt, g);
    this.ambient = { name, nodes, gain: g };

    // Occasional punctuation, so the bed does not become wallpaper.
    clearInterval(this._punct);
    if (name === '1692') {
      this._punct = setInterval(() => {
        if (!this.muted && Math.random() < 0.35) this.crow();
      }, 9000);
    } else if (name === 'present') {
      this._punct = setInterval(() => {
        if (!this.muted && Math.random() < 0.3) this.passingCar();
      }, 11000);
    }
  }

  crow() {
    // Two harsh descending calls. Not a realistic corvid, but unmistakably
    // a bird and unmistakably not friendly.
    for (let i = 0; i < 2; i++) {
      const d = i * 0.26;
      this.tone({ freq: 720, type: 'sawtooth', dur: 0.15, gain: 0.035, slide: -300, delay: d });
      this.burst({ freq: 1400, dur: 0.13, gain: 0.02, q: 1.6, delay: d });
    }
  }

  passingCar() {
    this.burst({ freq: 300, dur: 2.2, gain: 0.045, q: 0.5, type: 'lowpass' });
  }

  stopAmbience() {
    clearInterval(this._punct);
    if (!this.ambient) return;
    const t = this.ctx.currentTime;
    try {
      this.ambient.gain.gain.cancelScheduledValues(t);
      this.ambient.gain.gain.setTargetAtTime(0, t, 0.2);
      for (const n of this.ambient.nodes) {
        if (n.stop) { try { n.stop(t + 1.2); } catch { /* already stopped */ } }
      }
    } catch { /* context torn down */ }
    this.ambient = null;
  }
}

// The fifteen documents.
//
// The player never picks one up. They are a student standing in front of a
// primary source, so they do the only thing available: copy it down. That
// needs no time-travel rule and no explanation.
//
// ---------------------------------------------------------------------
// A NOTE ON FIDELITY, WHICH MATTERS MORE HERE THAN ANYWHERE ELSE
//
// Presenting invented text to a student as a quotation from a primary
// source would be a worse sin than anything else this game could do. So
// every document carries a `fidelity` field, shown on the reader screen:
//
//   'close'         follows the surviving document closely in substance and
//                   largely in wording. Still check against the archive
//                   before this goes in front of a class.
//   'reconstructed' written in the form and language of the record — warrant
//                   formulas, account-book conventions, the standard clauses
//                   — but not a transcription of one specific surviving
//                   sheet. The substance is documented; the exact wording is
//                   a rendering.
//
// The distinction is displayed to the player, on purpose. A student noticing
// that some sources are transcriptions and some are reconstructions is a
// student doing source criticism, which is the entire point.
//
// Everything here should be checked against Bernard Rosenthal, *Records of
// the Salem Witch-Hunt* (Cambridge, 2009), and the Salem Witch Trials
// Documentary Archive at the University of Virginia, both cited on screen.

/** Notebook entries, in the order the player learned them. Internal

// Objectives.
//
// The design doc is firm that the game should never look like a worksheet,
// so this is deliberately not a quest log. It is one line at a time, in the
// corner, telling a student who has never played a game like this what to do
// next — and nothing else.
//
// Steps are scoped to the chapter. The first incomplete step in the current
// chapter is the one shown; anything reached out of order completes silently.
// When a chapter's steps are all done, its exit opens.
const STEPS_BY_CHAPTER = {

  memorial: [
    { id: 'enter', text: 'Walk into the memorial', done: (s) => s.knows('present.memorial') },
    { id: 'threshold', text: 'Read the stones you walked in over', done: (s) => s.knows('present.threshold') },
    { id: 'panels', text: 'Read the three panels by the wall',
      done: (s) => s.knows('present.happened') && s.knows('present.court') && s.knows('present.argument') },
    { id: 'nurse', text: 'Find the bench for Rebecca Nurse', done: (s) => s.knows('present.nurse') },
    { id: 'nora', text: 'Talk to the girl on the wall', done: (s) => s.hasSpokenTo('nora') },
    { id: 'gap', text: 'Go through the gap in the far wall', done: (s) => s.visited.has('road') },

    { id: 'meetnurse', text: 'Find Rebecca Nurse — she lives west of the meetinghouse',

    { id: 'clues', text: 'Four things in this village are worth a closer look',

    { id: 'papers', text: 'Read the last three papers',
      done: (s) => ['annApology', 'sewallApology', 'johnsonAct'].every((d) => s.hasDoc(d)) },

};

/** The question the whole game exists to ask. Raised by the third panel at
 *  the memorial, then never dismissed. */
const STANDING = {
  id: 'why',
  text: 'What caused it?',
  active: (s) => s.knows('present.argument') && !s.answer,
};
function stepsFor(state) { return STEPS_BY_CHAPTER[state.chapter] || []; }

/** The step currently in play, or null when the chapter is finished. */
function currentStep(state) {
  return stepsFor(state).find((o) => !o.done(state)) || null;
}
function progress(state) {
  const steps = stepsFor(state);
  return { done: steps.filter((o) => o.done(state)).length, total: steps.length };
}

// Steps that ARE the exit, and so must not gate themselves. "answer" is in
// here for the same reason: it is completed by the closing screen, which
// only opens once the chapter is otherwise finished.
const EXIT_STEPS = new Set(['leave', 'back', 'gap', 'answer']);

/** True when every step in the named chapter is complete — used to open
 *  the exits, so a player cannot skip past the point of a chapter. */
function chapterComplete(state, chapter) {
  return (STEPS_BY_CHAPTER[chapter] || [])
    .filter((o) => !EXIT_STEPS.has(o.id))
    .every((o) => o.done(state));
}

/** What is still missing, for the message shown at a closed exit. */
function remainingIn(state, chapter) {
  return (STEPS_BY_CHAPTER[chapter] || [])
    .filter((o) => !EXIT_STEPS.has(o.id))
    .filter((o) => !o.done(state));
}

// Things the player can examine.
//
// The design doc's rule: "The causes are in the furniture." What the player
// finds should be environmental and concrete, not textual. Nothing here is a
// document handed over to be read — it is a woodpile you can count, a chart
// nailed to a wall, a line of credits in a book, and five miles of road.
//
// These are written as narration (no speaker, no portrait) so they read as
// the player noticing rather than as someone explaining.

/* ---------------------------------------------------------------------- *
 * Present day
 *
 * Different register on purpose. The 1692 voice is period-inflected; this
 * one is plain contemporary English, because the player is a student
 * standing on a city street in Massachusetts and it should feel like it.
 * ---------------------------------------------------------------------- */

/** A bench inscription. Twenty of these, and they are all the same shape —
 *  which is the memorial's actual design argument: no ranking, no
 *  interesting one, just twenty people and what was done to them. */
function benchScript(b) {
  const lines = [
    { say: 'A granite slab, cantilevered out of the wall. Just long enough to sit on.', who: null },
    { say: `Cut into the edge:  ${b.name}`, who: null },
    { say: `${b.fate} · ${b.date}`, who: null },
  ];
  if (b.name === 'REBECCA NURSE') {
    lines.push(
      { learn: 'present.nurse', source: 'observed' },
      { say: 'It is exactly like the other nineteen. Same stone, same lettering, same length.', who: null },
      { say: 'You will want to remember this one.', who: null },
    );
  } else if (b.name === 'GILES COREY') {
    lines.push({ say: 'It is the only one that does not say HANGED.', who: null });
  }
  return lines;
}

/* ===== src/content/npcs.js ===== */
// The March 1692 cast.
//
// Timing is precise and it matters: this is the first week of March 1692.
// Betty Parris and Abigail Williams have been ill since midwinter. Doctor
// Griggs has already suggested the evil hand. Mary Sibley's witch cake was
// baked days ago. And nobody has been arrested yet.
//
// That week is the whole reason the March chapter works. Every grievance in
// the village is fully loaded and completely ordinary. The player meets a
// functioning community with a land dispute, a salary fight and a cold
// minister — and only later finds out what those ordinary things turned
// into.
//
// Voice rule: period-inflected but readable. No "forsooth". Where a real
// person's documented words exist they are used and marked in a comment;
// everything else is connective tissue written to be consistent with what
// the records show about that person.

const LINEN = '#d8d2c2';
const NPCS = {

  /* -------------------------------------------------------------------- *
   * NORA ALVAREZ, 17 — present day
   *
   * Summer job at the memorial. The design doc calls for a peer voice, and
   * the rule for every present-day character is that they ask questions
   * rather than answer them: the moment a modern character starts
   * explaining the seventeenth century, the game turns into a worksheet
   * with a walking animation.
   *
   * She sounds seventeen. Contractions, deflection, a joke when it gets
   * heavy. She is not a docent and she is not the theme.
   * -------------------------------------------------------------------- */
  nora: {
    id: 'nora',
    name: 'Nora',
    spec: {
      flesh: FLESH.olive, hair: HAIR.black,
      coat: CLOTH.staffTeal, under: CLOTH.denim,
    },
    greet: [
      {
        if: { notSpokenTo: ['nora'] },
        then: [
          { say: 'A girl about your age, in a staff polo, sitting on the wall with her phone face-down beside her.', who: null },
          'Hey. You can sit on them, by the way. Everyone stands there trying to figure out if they\'re allowed.',
          'You\'re allowed. That\'s the whole point of a bench.',
        ],
        else: ['Hey again.'],
      },
    ],
    topics: [
      {
        id: 'job', label: 'Do you work here?',
        lines: [
          'Sort of. I do the visitor cart in summer and I keep an eye on this place.',
          'It\'s mostly telling people the bathroom is not in the cemetery.',
          { say: 'She nods at the graveyard on the other side of the wall.', who: null },
          'That\'s the Old Burying Point back there. It\'s older than the memorial by about three hundred years, and people get them confused constantly.',
          'None of the twenty are buried here, if that\'s what you were going to ask. They didn\'t get graves. That was sort of the point of executing them as witches.',
          { learn: 'present.nograves' },
        ],
      },
      {
        id: 'real', label: 'Do people ask you if it was real?',
        lines: [
          { say: 'She laughs, but not like it\'s funny.', who: null },
          'Every single day.',
          '"Was it real?" And I never know what to tell them, because — what are you asking me?',
          'Because if you mean were there actual witches, then no, obviously.',
          'But if you mean did twenty real people actually get killed by an actual court that actually sat right over there and wrote it all down —',
          { say: 'She taps the bench she\'s sitting on.', who: null },
          'Then it\'s the realest thing in this whole city.',
          { learn: 'present.realquestion' },
          'And people go "oh, right," and then they go buy a witch hat. I\'m not even mad about it. I just think it\'s weird that both things are on the same street.',
        ],
      },
      {
        id: 'shop', label: 'What do you think about the shops?',
        require: ['present.tourism'],
        lines: [
          { say: 'She shrugs, and it\'s a real shrug, not a dismissive one.', who: null },
          'My cousin works at one. It pays better than this does.',
          'Look — this city has, like, a million visitors a year and most of them come because of the witch thing. That pays for roads. It pays for my school.',
          'I\'m not going to stand here and tell you those people are monsters for selling a magnet.',
          'It\'s just... nobody in 1692 called themselves a witch. That was the accusation. That was the thing that got them killed.',
          { say: 'She looks at the shop for a second.', who: null },
          'And now it\'s the brand. That\'s all. I don\'t have a solution, I just notice it.',
        ],
      },
      {
        id: 'johnson', label: 'Has anything changed recently?',
        lines: [
          'Actually, yeah. Two thousand twenty-two.',
          'So there was one person still on the list who\'d never been officially cleared. Elizabeth Johnson Jr. Convicted, sentenced to hang, never executed — and then just... never formally pardoned. For three hundred and twenty-nine years.',
          'Everybody else got cleared eventually. She didn\'t, because she had no descendants to push for it. Nobody was left to be annoyed on her behalf.',
          { say: 'She sits up a bit.', who: null },
          'And then an eighth-grade civics class in North Andover found out and decided that was ridiculous.',
          'They did the research, they wrote the bill, they got a state senator to file it. It went through as an amendment to the state budget.',
          { learn: 'present.johnson' },
          'Thirteen-year-olds. In 2022. Cleared her name.',
          'So when people ask me if this is old history, I usually just tell them that.',
        ],
      },
      {
        id: 'gap', label: 'What\'s the gap in the wall for?',
        require: ['present.threshold'],
        lines: [
          { say: 'She looks where you\'re pointing — the opening in the far wall.', who: null },
          'Huh. I actually don\'t know.',
          'I\'ve worked here two summers and I\'ve never gone through it.',
          { say: 'She picks her phone back up.', who: null },
          'You should go look, I guess. Tell me what\'s over there.',
        ],
      },
    ],
    farewell: ['See you.'],
  },

  /* -------------------------------------------------------------------- *

  tituba: {

/* ===== src/content/maps.js ===== */
// Salem Village and its interiors, March 1692.
//
// Geography is compressed but not invented. The meetinghouse sits at the
// centre with the parsonage close by; Ingersoll's ordinary is a short walk
// off; the Nurse homestead lies west and the Putnam land east, with the
// disputed Topsfield boundary north through the woods. Salem Town is five
// miles south, and the road there is walkable — the design doc is firm that
// the player should have that distance "in their legs" rather than be told
// about it.
//
// Ground is built with small stamping helpers rather than hand-typed ASCII.
// Counting columns in a 46-wide string is how ragged maps and mystery
// collision bugs happen; these helpers cannot produce a ragged grid.

/* ---------------------------------------------------------------------- *
 * Ground helpers
 * ---------------------------------------------------------------------- */

function grid(w, h, fill = '.') {
  return Array.from({ length: h }, () => new Array(w).fill(fill));
}

const rows = (g) => g.map((r) => r.join(''));

function box(g, x, y, w, h, ch) {
  for (let j = y; j < y + h; j++) {
    if (!g[j]) continue;
    for (let i = x; i < x + w; i++) {
      if (i < 0 || i >= g[j].length) continue;
      g[j][i] = ch;
    }
  }
}

/** Horizontal road, `t` tiles thick, starting at row y. */
function hroad(g, x0, x1, y, t = 2, ch = '-') { box(g, x0, y, x1 - x0 + 1, t, ch); }

/** Vertical road. */
function vroad(g, x, y0, y1, t = 2, ch = '-') { box(g, x, y0, t, y1 - y0 + 1, ch); }

/**
 * A rough patch of old snow lying in the shade.
 *
 * A strict circle test at small radii produces a hard plus-shape that reads
 * as a rendering artefact rather than as snow, so the edge is fattened and
 * then eroded with a deterministic hash. Same seed every load — the map must
 * not shimmer between sessions.
 */
function patch(g, cx, cy, r, ch = '*') {
  const h = (x, y) => {
    let n = x * 374761393 + y * 668265263 + r * 144665;
    n = (n ^ (n >>> 13)) >>> 0;
    return ((Math.imul(n, 1274126177) ^ (n >>> 16)) >>> 0) / 4294967296;
  };
  const rr = r * r + r * 0.9;
  for (let j = -r - 1; j <= r + 1; j++) {
    for (let i = -r - 1; i <= r + 1; i++) {
      const d = i * i + j * j;
      if (d > rr) continue;
      // Erode the outer ring so the blob has an irregular coastline.
      if (d > rr - r * 1.4 && h(cx + i, cy + j) < 0.45) continue;
      const y = cy + j, x = cx + i;
      if (!g[y] || x < 0 || x >= g[y].length) continue;
      if (g[y][x] === '.') g[y][x] = ch;   // never cover a road
    }
  }
}

/** A room: wall border, floor inside, one door gap in the bottom wall. */
function room(w, h, doorX) {
  const g = grid(w, h, 'f');
  box(g, 0, 0, w, 1, '#');
  box(g, 0, h - 1, w, 1, '#');
  box(g, 0, 0, 1, h, '#');
  box(g, w - 1, 0, 1, h, '#');
  g[h - 1][doorX] = 'f';
  return g;
}

/** Scatter evergreens along a rectangle's edge, skipping listed columns. */
function treeLine(kind, x0, x1, y, step = 2, skip = []) {
  const out = [];
  for (let x = x0; x <= x1; x += step) {
    if (skip.includes(x)) continue;
    out.push({ kind, x, y });
  }
  return out;
}

/* ---------------------------------------------------------------------- *
 * The village
 * ---------------------------------------------------------------------- */

const VW = 46, VH = 38;

function villageGround() {
  const g = grid(VW, VH, '.');

  // The two roads that organise the whole village.
  hroad(g, 4, 41, 20, 2);          // east-west, past the meetinghouse
  vroad(g, 22, 16, VH - 1, 2);     // north-south, out toward Salem Town

  // Spurs to each door.
  vroad(g, 10, 22, 28, 1);         // parsonage
  vroad(g, 33, 17, 20, 1);         // Ingersoll's tavern
  vroad(g, 33, 22, 29, 1);         // Putnam house
  vroad(g, 7, 14, 20, 1);          // Nurse homestead
  vroad(g, 28, 3, 20, 1);          // north, into the woods

  // Old snow in the shaded north and along the treelines.
  patch(g, 6, 4, 3); patch(g, 17, 3, 4); patch(g, 38, 5, 3);
  patch(g, 2, 16, 2); patch(g, 43, 27, 3); patch(g, 12, 34, 2);
  patch(g, 40, 14, 2);

  return rows(g);
}

  return rows(g);
